<script>
// ---- 기운 색 (지도용 밝은 빛) ----
const AURA = [
  { id: 'gold', name: '황금빛', c: '#ffd84a', w: '#fff6c8' },
  { id: 'violet', name: '보랏빛', c: '#c27dff', w: '#f0dcff' },
  { id: 'burn', name: '불타는', c: '#ff7a36', w: '#ffe0b0' },
  { id: 'omen', name: '전조의', c: '#5ab4ff', w: '#dcf0ff' },
  { id: 'myth', name: '신화의', c: '#72f070', w: '#e4ffd8' }
];
const T = 16, Z = 2;      // 한 칸 16 도트, 화면 2배 (도트 1개 = 2px — 게임과 같은 굵기)
function art(id) {
  const s = MOB_SPRITES[id], mk = rows => { const n = rows.length, c = document.createElement('canvas'); c.width = c.height = n; const g = c.getContext('2d'); rows.forEach((r, y) => { for (let x = 0; x < n; x++) if (r[x] !== '.') { g.fillStyle = s.pal[r[x]]; g.fillRect(x, y, 1, 1); } }); return c; };
  return { a: mk(s.a), b: mk(s.b), n: s.a.length };
}
// 도트 반짝이 — 가장자리로 갈수록 가늘어지는 마름모 (✦). 단계 0~3 (0 = 점 하나 … 3 = 7×7)
const SPARK = [
  ['#'],
  ['.#.', '#W#', '.#.'],
  ['..#..', '..#..', '##W##', '..#..', '..#..'],
  ['...#...', '...#...', '..#W#..', '##WWW##', '..#W#..', '...#...', '...#...']
];
function spark(g, cx, cy, step, col, white) {
  const m = SPARK[step], h = (m.length - 1) / 2;
  m.forEach((r, y) => [...r].forEach((ch, x) => { if (ch === '.') return; g.fillStyle = ch === 'W' ? white : col; g.fillRect(cx - h + x, cy - h + y, 1, 1); }));
}
// 반짝이 하나의 삶 — 0 → 3 → 0 으로 커졌다 작아짐
function life(t) { const k = Math.floor(t * 7); return k < 0 || k > 6 ? -1 : [0, 1, 2, 3, 2, 1, 0][k]; }
function hash(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

// ---- 시안들 (g 는 도트 단위 좌표, 몬스터 발끝 가운데 (fx, fy), 크기 n 도트) ----
const STYLES = [
  { name: 'A · 보석 반짝임', desc: '몸 둘레에 ✦ 가 돌아가며 하나씩 커졌다 작아짐 (사용자 아이디어)', fn(g, t, fx, fy, n, a) {
      const cnt = 3 + (n >> 4);
      for (let i = 0; i < cnt; i++) {
        const per = 1.4, off = i / cnt, cyc = Math.floor(t / per + off), u = (t / per + off) - cyc, s = life(u);
        if (s < 0) continue;
        const r1 = hash(cyc * 7 + i), r2 = hash(cyc * 13 + i * 3);
        spark(g, Math.round(fx - n / 2 + r1 * n), Math.round(fy - n * 0.15 - r2 * n * 0.85), s, a.c, a.w);
      }
    } },
  { name: 'B · 반짝임 + 바닥 빛', desc: 'A 에 발밑의 은은한 빛 웅덩이 (멀리서도 보임)', under: true, fn(g, t, fx, fy, n, a, under) {
      if (under) {
        const pulse = 0.55 + 0.25 * Math.sin(t * 3);
        g.save(); g.globalAlpha = pulse;
        for (let r = 3; r >= 1; r--) { g.globalAlpha = pulse * (0.18 + (3 - r) * 0.14); g.fillStyle = a.c; g.beginPath(); g.ellipse(fx, fy - 1, n * 0.32 * (1 + r * 0.22), n * 0.09 * (1 + r * 0.3), 0, 0, 7); g.fill(); }
        g.restore(); return;
      }
      STYLES[0].fn(g, t, fx, fy, n, a);
    } },
  { name: 'C · 떠오르는 빛가루', desc: '발밑에서 작은 빛 점이 피어올라 사라짐 (불꽃 · 정기)', fn(g, t, fx, fy, n, a) {
      const cnt = 4 + (n >> 3);
      for (let i = 0; i < cnt; i++) {
        const per = 1.6, u = (t / per + i / cnt) % 1, cyc = Math.floor(t / per + i / cnt);
        const x = Math.round(fx - n * 0.45 + hash(cyc * 5 + i) * n * 0.9 + Math.sin(u * 6 + i) * 1.2), y = Math.round(fy - 1 - u * n * 1.05);
        g.fillStyle = u < 0.3 ? a.w : a.c; g.globalAlpha = 1 - u * 0.7;
        g.fillRect(x, y, 1, 1); if (u < 0.5) g.fillRect(x, y + 1, 1, 1);
        g.globalAlpha = 1;
      }
      if (Math.floor(t * 2.2) % 3 === 0) spark(g, Math.round(fx + n * 0.3), Math.round(fy - n * 0.8), 1, a.c, a.w);
    } },
  { name: 'D · 빛나는 테두리', desc: '몬스터 테두리 선 자체가 기운 색으로 숨 쉬듯 밝아짐 + 가끔 ✦', rim: true, fn(g, t, fx, fy, n, a) {
      const s = life((t % 2.2) / 1.2);
      if (s >= 0) spark(g, Math.round(fx + n * 0.38), Math.round(fy - n * 0.82), s, a.c, a.w);
    } },
  { name: 'E · 도는 반짝임', desc: '✦ 두세 개가 몸 둘레를 천천히 돌고, 앞쪽에 올 때 크게', fn(g, t, fx, fy, n, a) {
      const cnt = n > 16 ? 3 : 2;
      for (let i = 0; i < cnt; i++) {
        const ang = t * 1.6 + i * Math.PI * 2 / cnt, x = fx + Math.cos(ang) * n * 0.55, y = fy - n * 0.45 + Math.sin(ang) * n * 0.22;
        const front = Math.sin(ang) > 0, s = front ? (Math.sin(ang) > 0.6 ? 3 : 2) : 1;
        spark(g, Math.round(x), Math.round(y), s, a.c, a.w);
      }
    } }
];
// 테두리 빛 — 도트의 바깥 테두리(K) 칸만 기운 색으로 바꾼 그림
function rimArt(id, col) {
  const s = MOB_SPRITES[id], mk = rows => { const n = rows.length, c = document.createElement('canvas'); c.width = c.height = n; const g = c.getContext('2d'); rows.forEach((r, y) => { for (let x = 0; x < n; x++) if (r[x] !== '.') { const edge = r[x] === 'K' && [[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy]) => { const rr = rows[y+dy]; return !rr || rr[x+dx] === undefined || rr[x+dx] === '.'; }); g.fillStyle = edge ? col : s.pal[r[x]]; g.fillRect(x, y, 1, 1); } }); return c; };
  return { a: mk(s.a), b: mk(s.b) };
}

const MONS = ['goblin', 'slime', 'darkwolf', 'goblinchief', 'mimic', 'dungeonguardian'];
const arts = Object.fromEntries(MONS.map(id => [id, art(id)]));
const rims = {}; for (const id of MONS) for (const a of AURA) rims[id + a.id] = rimArt(id, a.c);
const views = [];
for (const st of STYLES) {
  const box = document.createElement('div');
  box.innerHTML = `<h3>${st.name}</h3><p>${st.desc}</p>`;
  const c = document.createElement('canvas');
  const W = 6 + MONS.length * 56, H = 60;
  c.width = W * Z; c.height = H * Z; c.style.width = W * Z + 'px';
  box.appendChild(c); document.getElementById('list').appendChild(box);
  views.push({ st, c, g: c.getContext('2d'), W, H });
}
function frame(now) {
  const t = now / 1000;
  for (const v of views) {
    const g = v.g; g.setTransform(Z, 0, 0, Z, 0, 0); g.imageSmoothingEnabled = false;
    for (let y = 0; y < v.H; y += 8) for (let x = 0; x < v.W; x += 8) { g.fillStyle = (x + y) / 8 % 2 ? '#4a4640' : '#504b44'; g.fillRect(x, y, 8, 8); }
    MONS.forEach((id, k) => {
      const A = arts[id], a = AURA[k % AURA.length], fx = 34 + k * 56, fy = 54, n = A.n, fr = Math.floor(t * 1.6) % 2;
      g.fillStyle = 'rgba(20,14,8,.35)'; g.beginPath(); g.ellipse(fx, fy - 1, n * .36, Math.max(2, n * .09), 0, 0, 7); g.fill();
      if (v.st.under) v.st.fn(g, t + k * 0.37, fx, fy, n, a, true);
      let img = fr ? A.b : A.a;
      if (v.st.rim) { const R = rims[id + a.id]; g.drawImage(fr ? A.b : A.a, fx - n / 2, fy - n); g.globalAlpha = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(t * 4)); g.drawImage(fr ? R.b : R.a, fx - n / 2, fy - n); g.globalAlpha = 1; }
      else g.drawImage(img, fx - n / 2, fy - n);
      v.st.fn(g, t + k * 0.37, fx, fy, n, a);
    });
  }
  requestAnimationFrame(frame);
}
