<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover + 아래 safe-area 패딩으로 아이폰 홈 인디케이터를 피합니다 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1007">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>아무도 안 시킨 세계 구하기 — jjunsgame</title>
<!-- 도트 글꼴 — 갈무리(본문) · 둥근모꼴(제목). 바깥에서 받아오므로 인터넷이 없으면
     style.css 의 대체 글꼴(맑은 고딕 등)로 떨어집니다 — 깨지지는 않습니다. -->
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/neodgm/neodgm-webfont@1.601/neodgm/style.css">
<link rel="stylesheet" href="css/style.css?v=20261029133650">
</head>
<body data-tab="journey">

<header class="topbar">
  <div class="brand">
    <span class="logo">◣◥</span>
    <div>
      <h1 id="gameTitle">아무도 안 시킨 세계 구하기</h1>
      <p class="studio">jjunsgame</p>
    </div>
  </div>
</header>

<main class="layout">

  <!-- 왼쪽: 나 -->
  <section class="panel hero-panel">
    <!-- 여태까지의 기록. 회차를 넘겨도 남는 것들입니다. -->
    <div class="frame"><div class="records" id="records"></div></div>

    <div class="frame">
      <div class="level-row">
        <span class="level-badge" id="heroLevel">Lv.1</span>
        <!-- 분배는 패널 맨 아래에 있어서 찍으려면 매번 스크롤해야 했습니다.
             레벨 옆에 두고 창으로 띄웁니다. -->
        <button class="btn tiny" id="openAllocBtn">스탯 분배<span class="alloc-pip" id="allocPip"></span></button>
      </div>

      <div class="hero-rank" id="heroRank"></div>

      <div class="bar-wrap">
        <div class="bar-label"><span>경험치</span><span id="xpText">0 / 0</span></div>
        <div class="bar"><div class="bar-fill xp" id="xpFill"></div></div>
      </div>

      <div class="energy-block">
        <div class="bar-label"><span>에너지</span><span id="energyText">20 / 20</span></div>
        <div class="pips" id="energyPips"></div>
      </div>
    </div>

    <div class="frame"><ul class="stats" id="heroStats"></ul></div>

  </section>

  <!-- 가운데: 여정 — 창들은 renderJourney 가 그립니다 -->
  <section class="panel journey-panel">
    <div id="journey"></div>
    <!-- 1~6격의 월드맵 — 지도는 여기 그대로 두고, 닿으면 조우 · 싸움 · 결과 창이 그 위(#mapOverlay)에 뜹니다 (js/mapview.js) -->
    <div id="mapLayer" class="map-layer">
      <canvas id="mapCanvas"></canvas>
      <div id="mapOverlay" class="map-overlay"></div>
      <div id="mapStick" class="map-stick"><div class="knob"></div></div>
    </div>
  </section>

  <!-- 오른쪽: 장비 -->
  <section class="panel gear-panel">
    <!-- 한 창 — 맨 위 화신 단추(마왕을 꺾은 뒤), 사람 그림과 부위 칸, 특수장비, 세트 효과 -->
    <div class="frame">
      <div id="avatarBar"></div>
      <!-- 사람 그림이 뒤에 깔리고, 그 위 부위 자리마다 칸이 올라갑니다 -->
      <div id="equipSlots" class="equip-slots"></div>
      <!-- 특수장비 칸 넷. 숨어 있는 것을 꺾을 때마다 하나씩 열립니다. -->
      <div id="specialSlots" class="special-slots"></div>
      <!-- 같은 성격을 여러 부위에 끼면 붙는 세트 효과 -->
      <div id="setBonus" class="set-bonus"></div>
    </div>
  </section>

</main>

<!-- 부위를 누르면 뜨는 창. 예전엔 아래로 스크롤해서 골랐는데,
     열두 칸을 오갈 때마다 화면이 위아래로 튀어서 창으로 바꿨습니다. -->
<div id="slotModal" class="modal hidden">
  <div class="modal-back" data-closeslot></div>
  <div class="modal-card">
    <div class="modal-head">
      <h3><span id="collectionTitle">무기</span> <span class="count" id="ownedCount"></span></h3>
      <button class="btn tiny" data-closeslot>닫기</button>
    </div>
    <div id="equipDetail"></div>
    <div id="inventory" class="inventory"></div>
  </div>
</div>

<!-- 화신 창. 사람 그림 왼쪽 위의 화신 칸으로 엽니다 (마왕을 꺾은 뒤). 목록은 ui.js 의 fillAvatars. -->
<div id="avatarModal" class="modal enh-modal hidden">
  <div class="modal-back" data-closeavatar></div>
  <div class="modal-card">
    <div class="modal-head">
      <h3>화신</h3>
      <button class="btn tiny" data-closeavatar>닫기</button>
    </div>
    <div id="avatarBody" class="avatars"></div>
  </div>
</div>

<!-- 강화석 교환. 사람 그림의 「슬롯 강화」 중에 왼쪽 위 「강화석 교환」으로, 또는 강화 창에서 엽니다.
     어느 강화석이든 어느 부위로든 — 바꾸는 일은 전부 이 창 하나에서. -->
<div id="swapModal" class="modal enh-modal hidden">
  <div class="modal-back" data-closeswap></div>
  <div class="modal-card">
    <div class="modal-head">
      <h3>강화석 교환 <span class="count" id="swapRate"></span></h3>
      <button class="btn tiny" data-closeswap>닫기</button>
    </div>
    <div id="swapBody" class="enh-body"></div>
  </div>
</div>

<!-- 떠돌이 상인. 그 지역에 상인이 있으면 갈림길의 「들른다」로 엽니다. 파는 것은 ui.js 의 renderShop 이 그립니다. -->
<div id="shopModal" class="modal hidden">
  <div class="modal-back" data-closeshop></div>
  <div class="modal-card">
    <div class="modal-head">
      <h3>떠돌이 상인 <span class="count" id="shopGold"></span></h3>
      <button class="btn tiny" data-closeshop>닫기</button>
    </div>
    <div id="shopBody" class="shop-body"></div>
  </div>
</div>

<!-- 이 지역에 있는 것. 지역 이름 옆 「1 / 11」 로 엽니다. -->
<div id="rosterModal" class="modal hidden">
  <div class="modal-back" data-closeroster></div>
  <div class="modal-card">
    <div class="modal-head">
      <h3><span id="rosterTitle">지역</span> <span class="count" id="rosterSub"></span></h3>
      <button class="btn tiny" id="rosterAllBtn">전체 도감</button>
      <button class="btn tiny" data-closeroster>닫기</button>
    </div>
    <div id="roster" class="roster"></div>
  </div>
</div>

<!-- 스탯 분배 창. 레벨 옆 버튼으로 엽니다. -->
<div id="allocModal" class="modal hidden">
  <div class="modal-back" data-closealloc></div>
  <div class="modal-card">
    <div class="modal-head">
      <h3>스탯 분배 <span class="count" id="pointCount"></span></h3>
      <button class="btn tiny" data-closealloc>닫기</button>
    </div>
    <div id="alloc" class="alloc"></div>
  </div>
</div>

<!-- 관리자 — 왼쪽 위 이름표(제목 명패)를 빠르게 다섯 번 누르면 열립니다 -->
<div id="adminModal" class="modal hidden">
  <div class="modal-back" data-closeadmin></div>
  <div class="modal-card">
    <div class="modal-head">
      <h3>관리자</h3>
      <button class="btn tiny" data-closeadmin>닫기</button>
    </div>
    <div id="adminBody" class="admin-body"></div>
  </div>
</div>

<!-- 아래: 로그 + 설정. 로그는 길어서 기본으로 접혀 있고 「보기」로 펼칩니다. -->
<section class="panel log-panel">
  <div class="frame">
    <div class="log-head">
      <h3>기록</h3>
      <button class="btn tiny" id="logToggle">보기</button>
    </div>
    <div id="log" class="log" hidden></div>
  </div>

  <div class="frame">
    <h3>설정</h3>
    <div id="settings" class="settings"></div>
  </div>
</section>

<footer class="footer">
  <button id="toTitleBtn" class="btn small">초기 화면으로</button>
  <span class="footer-note">© jjunsgame</span>
</footer>

<!-- 좁은 화면에서만 나오는 하단 탭. 세 패널을 한 번에 하나씩 봅니다. -->
<nav class="mobile-tabs" id="mobileTabs">
  <button data-tab="hero"><span class="mt-icon">◆</span>나</button>
  <button data-tab="journey"><span class="mt-icon">▲</span>여정</button>
  <button data-tab="gear"><span class="mt-icon">■</span>전리품</button>
  <button data-tab="log"><span class="mt-icon">≡</span>기록</button>
</nav>

<!-- 초기 화면 -->
<div id="title" class="title-screen hidden">
  <div class="title-inner">
    <div class="title-plaque">
      <div class="title-mark">◣◥</div>
      <h1 class="title-name">아무도 안 시킨<br>세계 구하기</h1>
      <p class="title-studio">jjunsgame</p>
    </div>
    <div id="titleMenu" class="title-menu"></div>
  </div>
</div>

<!-- 세이브 내보내기 / 가져오기. 초기 화면의 저장 칸에서 엽니다. -->
<div id="saveModal" class="modal save-modal hidden">
  <div class="modal-back" data-closesave></div>
  <div class="modal-card">
    <div class="modal-head">
      <h3 id="saveModalTitle">세이브</h3>
      <button class="btn tiny" data-closesave>닫기</button>
    </div>
    <div id="saveModalBody"></div>
  </div>
</div>

<!-- 튜토리얼 -->
<div id="tutorial" class="overlay hidden">
  <div class="overlay-card tutorial-card">
    <div class="tut-step" id="tutStep"></div>
    <h2 id="tutTitle"></h2>
    <p id="tutBody" class="tut-body"></p>
    <div class="tut-actions">
      <button id="tutNext" class="btn primary">다음<kbd>Space</kbd></button>
      <button id="tutSkip" class="btn small">건너뛰기</button>
    </div>
  </div>
</div>

<!-- 무명의 화신이 말을 거는 창. 마왕을 처음 꺾은 뒤 전리품 창에 들어서면 한 번 뜹니다 (ui.js 의 maybeNamelessTalk) -->
<div id="talk" class="overlay hidden">
  <div class="overlay-card tutorial-card talk-card">
    <div class="tut-step" id="talkWho">무명의 화신</div>
    <p id="talkBody" class="tut-body"></p>
    <div class="tut-actions">
      <button id="talkNext" class="btn primary">다음<kbd>Space</kbd></button>
    </div>
  </div>
</div>

<!-- 싸움이 끝나고 화신을 얻었을 때 결과창 위에 뜨는 창 — 화신의 그림과 한마디 (ui.js 의 avatarMoment).
     그림 칸(agArt)은 지금 이모티콘 — 나중에 화신 그림이 들어올 자리입니다. -->
<div id="avatarGain" class="overlay hidden">
  <div class="overlay-card tutorial-card talk-card avatar-gain-card">
    <div class="tut-step">화신이 되었다</div>
    <div class="ag-art" id="agArt"></div>
    <div class="ag-name" id="agName"></div>
    <p class="tut-body ag-line" id="agLine"></p>
    <div class="av-fx ag-fx" id="agFx"></div>
    <div class="tut-actions">
      <button id="agOk" class="btn primary">받아들인다<kbd>Space</kbd></button>
    </div>
  </div>
</div>

<!-- 회차 종료 오버레이 -->
<div id="overlay" class="overlay hidden">
  <div class="overlay-card">
    <h2 id="overTitle">격이 무너졌다</h2>
    <p id="overReason" class="over-reason"></p>
    <ul class="over-stats" id="overStats"></ul>
    <button id="newRunBtn" class="btn primary">다시 오른다<kbd>Space</kbd></button>
  </div>
</div>

<!-- 맨 뒤의 헤진 지도. 게임과 상관없이 먼저 그려둡니다. -->
<script src="js/backdrop.js?v=20261029133650"></script>
<!-- 효과음과 배경음. 소리 파일 없이 그 자리에서 만듭니다. -->
<script src="js/sound.js?v=20261029133650"></script>
<!-- 전투 이펙트 — assets/fx 의 그림 두 장에서 프레임을 잘라 씁니다 -->
<script src="js/fx.js?v=20261029133650"></script>
<script src="js/data.js?v=20261029133650"></script>
<script src="js/game.js?v=20261029133650"></script>
<!-- 월드맵 — 지도(maps/*.tmj 를 build.py 가 감싼 것) · 걷기 규칙 · 그리기 -->
<script src="js/maps.js?v=20261029133650"></script>
<script src="js/map.js?v=20261029133650"></script>
<script src="js/mapview.js?v=20261029133650"></script>
<script src="js/ui.js?v=20261029133650"></script>
</body>
</html>
