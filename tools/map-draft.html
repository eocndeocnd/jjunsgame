<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>맵 초안 — jjunsgame</title>
<!-- 맵 초안 — 지도 손질용 (docs/MAP-REFERENCE-PLAN.md).
     게임과 같은 규칙(js/map.js) · 그리기(js/mapview.js)로 지도를 걸어 봅니다. 몬스터 성격 점 · 작은 지도 · 시작 자리 고르기가 더 있습니다.
     지도는 maps/overworld.tmj 를 바로 읽습니다 — Tiled 로 고친 뒤 빌드 없이 새로 고침만 하면 됩니다.
     싸움은 게임 규칙(data.js · game.js)을 그대로 씁니다. 아무것도 저장하지 않습니다. -->
<style>
  body { font: 14px/1.45 system-ui, sans-serif; margin: 0 auto; padding: 8px 12px 24px; max-width: 600px; background: #1c1007; color: #f6e7c3; }
  h3 { margin: 4px 0 6px; font-size: 16px; }
  .row { margin: 4px 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  input, select, button { font: inherit; }
  input[type=text] { width: 7em; }
  button { padding: 5px 12px; border: 1px solid #b8863b; background: #7b4a22; color: #f6e7c3; border-radius: 3px; }
  button:disabled { opacity: 0.45; }
  #hud { min-height: 2.9em; white-space: pre-wrap; font-size: 13px; }
  .map { position: relative; width: min(560px, calc(100vw - 28px)); aspect-ratio: 1; margin: 4px auto; border: 2px solid #b8863b; }
  .map canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .map-stick { position: absolute; left: 50%; bottom: 12px; width: 112px; height: 112px; margin-left: -56px; border-radius: 50%;
               background: rgba(28, 16, 7, 0.45); border: 2px solid #b8863b; touch-action: none; user-select: none; }
  .map-stick .knob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: #a8703a; pointer-events: none; }
  #enc { min-height: 5.2em; padding: 6px 8px; background: #ead6a6; color: #3a2312; border-radius: 3px; }
  #enc.idle { background: transparent; color: #977650; }
  #enc b { font-size: 15px; }
  #mini { display: block; margin: 6px auto; border: 1px solid #7b4a22; max-width: 100%; image-rendering: pixelated; }
  #log { white-space: pre-wrap; font: 12px/1.4 monospace; border-top: 1px solid #7b4a22; margin-top: 6px; padding-top: 4px; max-height: 14em; overflow: auto; color: #e3cc95; }
  .legend { font-size: 12px; color: #d8bf86; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin: 0 2px 0 6px; vertical-align: middle; }
</style>
</head>
<body>
<h3>맵 초안 — 걸어 보기</h3>

<div class="row">
  시작 <select id="from"></select>
  레벨 <input id="lv" type="text" inputmode="numeric">
  에너지 <input id="en" type="text" inputmode="numeric" style="width:4em">
  <label><input type="checkbox" id="gear" checked> 앞 격 전리품을 다 낀 채로</label>
  <button id="setup">새 판</button>
  <button id="again" disabled>다음 여정</button>
</div>

<div id="hud"></div>
<div class="map"><canvas id="view"></canvas><div id="stick" class="map-stick"><div class="knob"></div></div></div>
<div id="enc" class="idle"></div>
<div class="legend">
  방향키 · WASD 로도 걷습니다 · 맞선다 Enter · 물러선다 Esc<br>
  <span class="dot" id="dAggro"></span>선공(보면 쫓아옴)
  <span class="dot" id="dPassive"></span>후공(내가 닿아야)
  <span class="dot" id="dShy"></span>중립(달아남)
  · 테두리 빛 = 기운 · 네모 = 정예(초록) · 보스(빨강) · 히든(보라)
</div>
<canvas id="mini"></canvas>
<div id="log"></div>

<script src="../js/data.js"></script>
<script src="../js/game.js"></script>
<script src="../js/map.js"></script>
<script src="../js/mapview.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const TEMPER_NAME = { aggro: '선공', passive: '후공', shy: '중립' };
$('dAggro').style.background = MapView.TEMPER_COLOR.aggro;
$('dPassive').style.background = MapView.TEMPER_COLOR.passive;
$('dShy').style.background = MapView.TEMPER_COLOR.shy;

let map = null, lines = [], closedSaid = 0;
const say = t => { lines.unshift(t); lines.length = Math.min(lines.length, 60); $('log').textContent = lines.join('\n'); };

const view = MapView.create({
  canvas: $('view'), stick: $('stick'), dots: true,
  hooks: MapView.gameHooks(),
  paused: () => !State.run || State.run.over || !!State.run.encounter,
  onEvents
});

// ───────────────────────── 시작 ─────────────────────────
function firstArea(rank) {   // 그 격에서 가장 약한 일반의 구역
  const zi = ZONES.findIndex(z => z.rank === rank);
  const weakest = ENEMIES.find(e => e.zoneIndex === zi && e.kind === 'normal');
  return map.areas.find(a => a.monster === weakest.id);
}
function defaults() {
  const rank = Number($('from').value);
  $('lv').value = rank ? String(Math.round(getEnemy(firstArea(rank).monster).level * 1.3)) : '1';
  $('en').value = String(RULES.START_ENERGY);
}

function setup() {   // 새 판 — 빈 저장본에서, 고른 대로
  blockSaving(); currentSlot = 0;
  State.meta = freshMeta();
  State.meta.tutorialDone = true;
  const rank = Number($('from').value);
  if ($('gear').checked && rank > 1) {
    for (const it of ITEMS) if (!it.ware && it.rank.n < rank && it.slot !== 'special') State.meta.owned[it.id] = 1;
    for (const s of SLOT_IDS) {
      const best = ITEMS.filter(i => i.slot === s && owns(i.id)).sort((a, b) => b.level - a.level)[0];
      if (best) equip(best.id, s);
    }
  }
  lines = [];
  beginRun(true);
}

function beginRun(custom) {   // 여정 하나 — 다음 여정은 레벨 1 · 첫 공간에서, 전리품은 그대로
  startRun();
  const run = State.run;
  const rank = custom ? Number($('from').value) : 0;
  let start = map.start;
  if (rank) {
    const a = firstArea(rank);
    start = { x: a.x + (a.w >> 1), y: a.y + (a.h >> 1) };
    run.zoneIndex = ZONES.findIndex(z => z.rank === rank);
  }
  if (custom) {
    const lv = Math.max(1, Number($('lv').value.replace(/,/g, '')) || 1);
    if (lv > 1) gainXp(totalXpFor(lv) - totalXpFor(1) + 1);
    run.energy = Math.max(1, Number($('en').value) || RULES.START_ENERGY);
  }
  view.start(map, start);
  $('again').disabled = true;
  say(`── ${State.meta.runCount}번째 여정 — 에너지 ${run.energy} · Lv.${fmtLevel(run.level)} ──`);
  drawMiniBase();
  drawEnc();
}

// ───────────────────────── 닿으면 싸움 (게임과 같은 meetOnMap · engage · retreat) ─────────────────────────
function onEvents(evs) {
  const run = State.run;
  for (const e of evs) {
    if (e.type === 'area') {
      const zi = e.area.zone ? ZONES.findIndex(z => z.id === e.area.zone) : 0;
      walkIntoZone(zi);
    } else if (e.type === 'contact') {
      const id = e.mob ? e.mob.monster : e.post.enemy;
      if (!meetOnMap(id, e.mob ? e.mob.aura : null, e.first)) { view.resolve('retreat'); say('에너지가 모자라 맞설 수 없다.'); }
      else say(`${getEnemy(id).icon} ${getEnemy(id).name} — ${e.first === 'foe' ? '몬스터가 먼저 덤볐다' : '내가 먼저 닿았다'}${run.aura ? ` · ✦ ${run.aura.name}` : ''}`);
      view.first = e.first;
      drawEnc();
    } else if (e.type === 'closed' && Date.now() - closedSaid > 1500) {
      closedSaid = Date.now();
      say(`${e.port.name} — 닫혀 있다 (${getEnemy(e.port.opensAfter).name}${josa(getEnemy(e.port.opensAfter).name, '을', '를')} 꺾어야 열림)`);
    } else if (e.type === 'port') say(`${e.port.label || e.port.name} — 게임에서는 여기서 그 지도로 넘어갑니다 (${e.port.to}).`);
  }
}

function doEngage() {
  const run = State.run;
  if (!run.encounter) return;
  const r = engage();
  if (!r) { say('에너지가 모자란다.'); return; }
  view.resolve(r.win ? 'win' : 'lose');
  dismissResult();
  say(r.win
    ? `승리 ${r.enemy.name} — 경험치 +${fmt(r.xp)} · Lv.${fmtLevel(run.level)} · 전리품 ${r.drops.length}`
    : `패배 ${r.enemy.name} — 에너지 −${r.penalty}, 한 칸 밀려남`);
  if (r.win && r.enemy.kind === 'boss') say(`━ ${r.enemy.name}${josa(r.enemy.name, '이', '가')} 쓰러졌다 — 막혔던 길이 열린다 ━`);
  drawEnc();
}
function doRetreat() {
  const run = State.run;
  if (!run.encounter || run.onBoss) return;
  retreat();
  view.resolve('retreat');
  say('물러섰다 — 에너지는 그대로, 한 칸 밀려남');
  drawEnc();
}

function drawEnc() {
  const run = State.run, enc = $('enc');
  if (run.over) {
    enc.className = '';
    enc.innerHTML = `<b>여정 끝</b> — ${run.reason}. 꺾은 것 ${run.kills} · Lv.${fmtLevel(run.level)}<br>전리품은 남습니다. 「다음 여정」으로 첫 공간에서 다시.`;
    $('again').disabled = false;
    return;
  }
  if (!run.encounter) { enc.className = 'idle'; enc.textContent = '걷다가 몬스터에 닿으면 여기에 뜹니다. (게임에서는 지도 위에 조우 창이 뜹니다)'; return; }
  const f = getEnemy(run.encounter);
  const c = winChance(heroStats(), f);
  enc.className = '';
  enc.innerHTML = `<b>${f.icon} ${f.name}</b> ${KINDS[f.kind].name} · Lv.${fmtLevel(f.level)}${run.aura ? ` · <span style="color:${run.aura.color}">✦ ${run.aura.name}</span>` : ''}`
    + ` · 이길 확률 약 ${Math.round(c * 100)}%<br><small>${view.first === 'foe' ? '몬스터가 먼저 덤볐다' : '내가 먼저 닿았다'} — 싸움은 늘 내가 먼저 때림</small><br>`
    + `<button id="bEngage">맞선다${run.onBoss ? '' : ` (에너지 −${RULES.TRAVEL_COST})`}</button> `
    + (run.onBoss ? '물러설 수 없다' : '<button id="bRetreat">물러선다 (에너지 0)</button>');
  $('bEngage').onclick = doEngage;
  if ($('bRetreat')) $('bRetreat').onclick = doRetreat;
}

// ───────────────────────── 글 · 작은 지도 ─────────────────────────
const RANK_COLOR = { 1: '#6b6152', 2: '#4f6b30', 3: '#7a4f2a', 4: '#5c6570', 5: '#5e3a72', 6: '#8c1f24' };
const TILE_COLOR = ['#ead6a6', '#3f240f', '#1f5a96', '#4a5e2a', '#7a7062', '#f2e2b8'];   // 바닥 · 벽 · 물 · 나무 · 바위 · 길
function drawHud() {
  const run = State.run, w = view.world;
  if (!run || !w) return;
  const p = w.player;
  const z = ZONES[run.zoneIndex];
  const near = w.mobs.filter(m => Math.abs(m.x - p.x) + Math.abs(m.y - p.y) <= 6)
    .map(m => `${getEnemy(m.monster).name}(${TEMPER_NAME[m.temper]}${m.aura ? ' · ' + m.aura.name : ''})`);
  $('hud').textContent = `제${z.rank}격 ${z.name} · 에너지 ${run.energy} · Lv.${fmtLevel(run.level)} · 꺾은 것 ${run.kills}`
    + `\n가까이: ${near.length ? near.join(', ') : '없음'}`;
}

const mini = $('mini'), mx = mini.getContext('2d'), MS = 2;   // 칸 하나 = 2px, 좁은 화면이면 CSS 로 줄여 보입니다
let miniBase = null;
function drawMiniBase() {
  mini.width = map.w * MS; mini.height = map.h * MS;
  for (let y = 0; y < map.h; y++) for (let x = 0; x < map.w; x++) {
    const k = y * map.w + x, a = map.areaAt[k] >= 0 ? map.areas[map.areaAt[k]] : null;
    mx.fillStyle = a && a.rank ? RANK_COLOR[a.rank] : map.secret[k] ? TILE_COLOR[1] : TILE_COLOR[map.tile[k]] || '#000';
    mx.fillRect(x * MS, y * MS, MS, MS);
  }
  miniBase = mx.getImageData(0, 0, mini.width, mini.height);
}
function drawMini() {
  if (!miniBase || !view.world) return;
  mx.putImageData(miniBase, 0, 0);
  const hooks = view.world.hooks;
  for (const post of map.posts) if (hooks.postAlive(post.enemy)) {
    mx.fillStyle = MapView.KIND_COLOR[getEnemy(post.enemy).kind];
    mx.fillRect(post.x * MS - 1, post.y * MS - 1, post.w * MS + 2, post.h * MS + 2);
  }
  const p = view.world.player, r = MapRules.RULES.SIGHT;
  mx.strokeStyle = '#f6e7c3'; mx.lineWidth = 1;
  mx.strokeRect((p.x - r) * MS + 0.5, (p.y - r) * MS + 0.5, MapView.VIEW * MS, MapView.VIEW * MS);
  mx.fillStyle = '#fff'; mx.fillRect(p.x * MS - 1, p.y * MS - 1, MS + 2, MS + 2);
}
(function paint() { drawHud(); drawMini(); requestAnimationFrame(paint); })();

// ───────────────────────── 열기 ─────────────────────────
document.addEventListener('keydown', ev => {
  if (ev.target.tagName === 'INPUT' || ev.target.tagName === 'SELECT') return;
  if (ev.key === 'Enter') { ev.preventDefault(); doEngage(); }
  if (ev.key === 'Escape') { ev.preventDefault(); doRetreat(); }
});
$('setup').onclick = setup;
$('again').onclick = () => beginRun(false);
$('from').onchange = defaults;
fetch('../maps/overworld.tmj').then(r => r.json()).then(tmj => {
  map = MapRules.parseTiled(tmj, 'overworld');
  $('from').innerHTML = '<option value="0">첫 공간</option>' + [1, 2, 3, 4, 5, 6].map(n => `<option value="${n}">${n}격 입구 — ${ZONES.find(z => z.rank === n).name}</option>`).join('');
  defaults();
  setup();
}).catch(err => { $('hud').textContent = `지도를 못 읽었습니다 (${err.message}) — 저장소 맨 위에서 python -m http.server 로 연 뒤 들어오세요.`; });
</script>
</body>
</html>
