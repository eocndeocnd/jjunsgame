<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>맵 초안 — jjunsgame</title>
<!-- 맵 초안 (2단계 — 그림 없이 규칙만, docs/MAP-REFERENCE-PLAN.md 8번).
     색칸 지도 위에서 걷기 · 구역 스폰과 다시 스폰 · 선공/후공/중립 · 닿으면 싸움 · 물러서기(에너지 0)를 손으로 만져 봅니다.
     규칙은 js/map.js, 지도는 maps/overworld.tmj (node tools/cli.js maps 로 뽑은 임시 지도 — Tiled 로 열어 고쳐도 됩니다).
     싸움 자체는 게임 규칙(data.js · game.js)을 그대로 씁니다. 아무것도 저장하지 않습니다. -->
<style>
  body { font: 14px/1.45 system-ui, sans-serif; margin: 0 auto; padding: 8px 12px 24px; max-width: 600px; background: #1c1007; color: #f6e7c3; }
  h3 { margin: 4px 0 6px; font-size: 16px; }
  .row { margin: 4px 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  input, select, button { font: inherit; }
  input[type=text] { width: 7em; }
  button { padding: 5px 12px; border: 1px solid #b8863b; background: #7b4a22; color: #f6e7c3; border-radius: 3px; }
  button:disabled { opacity: 0.45; }
  #hud { min-height: 2.9em; white-space: pre-wrap; font-size: 13px; }
  canvas { display: block; image-rendering: pixelated; touch-action: none; }
  #view { margin: 4px auto; border: 2px solid #b8863b; }
  #enc { min-height: 5.2em; padding: 6px 8px; background: #ead6a6; color: #3a2312; border-radius: 3px; }
  #enc.idle { background: transparent; color: #977650; }
  #enc b { font-size: 15px; }
  #stick { width: 132px; height: 132px; margin: 8px auto; border-radius: 50%; background: #3f240f; border: 2px solid #b8863b; position: relative; touch-action: none; user-select: none; }
  #knob { width: 52px; height: 52px; border-radius: 50%; background: #a8703a; position: absolute; left: 40px; top: 40px; pointer-events: none; }
  #mini { margin: 6px auto; border: 1px solid #7b4a22; max-width: 100%; }
  #log { white-space: pre-wrap; font: 12px/1.4 monospace; border-top: 1px solid #7b4a22; margin-top: 6px; padding-top: 4px; max-height: 14em; overflow: auto; color: #e3cc95; }
  .legend { font-size: 12px; color: #d8bf86; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin: 0 2px 0 6px; vertical-align: middle; }
</style>
</head>
<body>
<h3>맵 초안 — 걸어 보기 (그림 없음)</h3>

<div class="row">
  시작 <select id="from"></select>
  레벨 <input id="lv" type="text" inputmode="numeric">
  에너지 <input id="en" type="text" inputmode="numeric" style="width:4em">
  <label><input type="checkbox" id="gear" checked> 앞 격 전리품을 다 낀 채로</label>
  <button id="setup">새 판</button>
  <button id="again" disabled>다음 여정</button>
</div>

<div id="hud"></div>
<canvas id="view"></canvas>
<div id="enc" class="idle"></div>
<div id="stick"><div id="knob"></div></div>
<div class="legend">
  방향키 · WASD 로도 걷습니다 · 맞선다 Enter · 물러선다 Esc<br>
  <span class="dot" style="background:#d0473f"></span>선공(보면 쫓아옴)
  <span class="dot" style="background:#4a80b8"></span>후공(내가 닿아야)
  <span class="dot" style="background:#5aa04f"></span>중립(달아남)
  · 테두리 빛 = 기운 · 네모 = 정예(보라) · 보스(빨강) · 히든(청록)
</div>
<canvas id="mini"></canvas>
<div id="log"></div>

<script src="../js/data.js"></script>
<script src="../js/game.js"></script>
<script src="../js/map.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const VIEW = MapRules.RULES.SIGHT * 2 + 1;   // 보이는 범위 그대로 — 나를 가운데 둔 17×17 칸
const RANK_COLOR = { 1: '#6b6152', 2: '#4f6b30', 3: '#7a4f2a', 4: '#5c6570', 5: '#5e3a72', 6: '#8c1f24' };   // style.css 의 --r1 ~ --r6
const KIND_COLOR = { elite: '#6a2c8f', boss: '#a8262b', hidden: '#1f6f7a' };
const TEMPER = { aggro: ['선공', '#d0473f'], passive: ['후공', '#4a80b8'], shy: ['중립', '#5aa04f'] };
const TILE_COLOR = ['#ead6a6', '#3f240f', '#1f5a96'];   // 바닥 · 벽 · 물 (maps/tiles.png 와 같은 순서)

let map = null, world = null, here = null, closedSaid = 0, lines = [];
const say = t => { lines.unshift(t); lines.length = Math.min(lines.length, 60); $('log').textContent = lines.join('\n'); };

// 지도 규칙이 게임에게 묻는 것들
const hooks = {
  temper: id => MapRules.temperOf(getEnemy(id).arch),
  rollAura: () => rollAura(),
  postAlive: id => { const f = getEnemy(id); return !!f && !isDowned(id) && isRevealed(f); },   // 이 여정에 꺾었거나 아직 안 나타난 히든은 없음
  portOpen: p => !p.opensAfter || isDowned(p.opensAfter)
};

// ───────────────────────── 시작 ─────────────────────────
function firstArea(rank) {   // 그 격에서 가장 약한 일반의 구역
  const zi = ZONES.findIndex(z => z.rank === rank);
  const weakest = ENEMIES.find(e => e.zoneIndex === zi && e.kind === 'normal');
  return map.areas.find(a => a.monster === weakest.id);
}
function defaults() {
  const rank = Number($('from').value);
  $('lv').value = rank ? String(Math.round(getEnemy(firstArea(rank).monster).level * 1.3)) : '1';
  $('en').value = String(RULES.START_ENERGY);
}

function setup() {   // 새 판 — 빈 저장본에서, 고른 대로
  blockSaving(); currentSlot = 0;
  State.meta = freshMeta();
  State.meta.tutorialDone = true;
  const rank = Number($('from').value);
  if ($('gear').checked && rank > 1) {
    for (const it of ITEMS) if (!it.ware && it.rank.n < rank && it.slot !== 'special') State.meta.owned[it.id] = 1;
    for (const s of SLOT_IDS) {
      const best = ITEMS.filter(i => i.slot === s && owns(i.id)).sort((a, b) => b.level - a.level)[0];
      if (best) equip(best.id, s);
    }
  }
  lines = [];
  beginRun(true);
}

function beginRun(custom) {   // 여정 하나 — 다음 여정은 레벨 1 · 첫 공간에서, 전리품은 그대로
  startRun();
  const run = State.run;
  const rank = custom ? Number($('from').value) : 0;
  let start = map.start;
  if (rank) {
    const a = firstArea(rank);
    start = { x: a.x + (a.w >> 1), y: a.y + (a.h >> 1) };
    run.zoneIndex = ZONES.findIndex(z => z.rank === rank);
  }
  if (custom) {
    const lv = Math.max(1, Number($('lv').value.replace(/,/g, '')) || 1);
    if (lv > 1) gainXp(totalXpFor(lv) - totalXpFor(1) + 1);
    run.energy = Math.max(1, Number($('en').value) || RULES.START_ENERGY);
  }
  world = MapRules.createWorld({ ...map, start }, hooks);
  here = null;
  $('again').disabled = true;
  say(`── ${State.meta.runCount}번째 여정 — 에너지 ${run.energy} · Lv.${fmtLevel(run.level)} ──`);
  drawMiniBase();
  drawEnc();
}

// ───────────────────────── 닿으면 싸움 ─────────────────────────
function onContact(e) {
  const run = State.run;
  const foe = getEnemy(e.mob ? e.mob.monster : e.post.enemy);
  run.zoneIndex = foe.zoneIndex;   // 싸움 규칙이 보는 「지금 지역」 = 그 몬스터의 지역
  if (e.post) {
    approachPost(foe.id);          // 정해진 자리 — 닿는 순간 에너지 1, 물러설 수 없음
    if (!run.encounter) { MapRules.resolve(world, 'lose'); say('에너지가 모자라 맞설 수 없다.'); return; }
    say(`━ ${foe.icon} ${foe.name} 앞에 섰다 — 물러설 수 없다 (에너지 −${RULES.TRAVEL_COST}) ━`);
  } else {
    if (run.energy < RULES.TRAVEL_COST) { endRun('에너지 고갈'); MapRules.resolve(world, 'retreat'); return; }
    beginEncounter(foe, false);
    run.aura = e.mob.aura;         // 기운은 서 있을 때부터 보이던 그것
    say(`${foe.icon} ${foe.name}${e.first === 'foe' ? `${josa(foe.name, '이', '가')} 먼저 덤벼들었다` : '에게 닿았다'}${run.aura ? ` — ✦ ${run.aura.name} (${run.aura.desc})` : ''}`);
  }
  world.contactFirst = e.first;
  drawEnc();
}

function doEngage() {
  const run = State.run;
  if (!run.encounter) return;
  if (!run.onBoss) {               // 일반 — 맞설 때 에너지 1 (닿기만 해서는 안 씀)
    if (run.energy < RULES.TRAVEL_COST) { say('에너지가 모자란다.'); return; }
    run.energy -= RULES.TRAVEL_COST;
  }
  const r = engage();
  if (!r) return;
  MapRules.resolve(world, r.win ? 'win' : 'lose');
  say(r.win
    ? `승리 ${r.enemy.name} — 경험치 +${fmt(r.xp)} · Lv.${fmtLevel(run.level)} · 전리품 ${r.drops.length}${r.avatarGained ? ' · 화신!' : ''}`
    : `패배 ${r.enemy.name} — 에너지 −${r.penalty}, 한 칸 밀려남`);
  if (r.win && r.enemy.kind === 'boss') say(`━ ${r.enemy.name}${josa(r.enemy.name, '이', '가')} 쓰러졌다 — 막혔던 길이 열린다 ━`);
  drawEnc();
}
function doRetreat() {
  const run = State.run;
  if (!run.encounter || run.onBoss) return;
  retreat();
  MapRules.resolve(world, 'retreat');
  say('물러섰다 — 에너지는 그대로, 한 칸 밀려남');
  drawEnc();
}

function drawEnc() {
  const run = State.run, enc = $('enc');
  if (run.over) {
    enc.className = '';
    enc.innerHTML = `<b>여정 끝</b> — ${run.reason}. 꺾은 것 ${run.kills} · Lv.${fmtLevel(run.level)}<br>전리품은 남습니다. 「다음 여정」으로 첫 공간에서 다시.`;
    $('again').disabled = false;
    return;
  }
  if (!run.encounter) { enc.className = 'idle'; enc.textContent = '걷다가 몬스터에 닿으면 여기에 뜹니다.'; return; }
  const f = getEnemy(run.encounter);
  const c = winChance(heroStats(), f);
  const first = world.contactFirst === 'foe' ? '몬스터가 먼저 닿았다 — 첫 턴은 몬스터 (전투엔 아직 안 넣음)' : '내가 먼저 닿았다 — 첫 턴은 나';
  enc.className = '';
  enc.innerHTML = `<b>${f.icon} ${f.name}</b> ${KINDS[f.kind].name} · Lv.${fmtLevel(f.level)}${run.aura ? ` · <span style="color:${run.aura.color}">✦ ${run.aura.name}</span>` : ''}`
    + ` · 이길 확률 약 ${Math.round(c * 100)}%<br><small>${first}</small><br>`
    + `<button id="bEngage">맞선다${run.onBoss ? '' : ` (에너지 −${RULES.TRAVEL_COST})`}</button> `
    + (run.onBoss ? '물러설 수 없다' : '<button id="bRetreat">물러선다 (에너지 0)</button>');
  $('bEngage').onclick = doEngage;
  if ($('bRetreat')) $('bRetreat').onclick = doRetreat;
}

// ───────────────────────── 한 틱 ─────────────────────────
function onEvents(evs) {
  for (const e of evs) {
    if (e.type === 'contact') onContact(e);
    else if (e.type === 'closed' && world.time - closedSaid > 1.5) {
      closedSaid = world.time;
      say(`${e.port.name} — 닫혀 있다 (${getEnemy(e.port.opensAfter).name}${josa(getEnemy(e.port.opensAfter).name, '을', '를')} 꺾어야 열림)`);
    } else if (e.type === 'port') say(`${e.port.name} — 7격부터의 지도는 4단계에서 붙습니다.`);
  }
}

let last = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - (last || now)) / 1000);
  last = now;
  if (world && State.run && !State.run.over) onEvents(MapRules.tick(world, dt));
  draw();
  requestAnimationFrame(frame);
}

// ───────────────────────── 그리기 ─────────────────────────
const view = $('view'), vx = view.getContext('2d');
let T = 24;
function resize() {
  const side = Math.min(window.innerWidth - 28, 560);   // 양옆 여백 12px 씩 + 테두리
  T = Math.max(12, Math.floor(side / VIEW));
  view.width = view.height = T * VIEW;
}
function draw() {
  if (!world) return;
  const p = world.player, m = map, half = VIEW >> 1;
  const ox = p.x - half, oy = p.y - half;
  vx.fillStyle = '#000'; vx.fillRect(0, 0, view.width, view.height);
  for (let j = 0; j < VIEW; j++) for (let i = 0; i < VIEW; i++) {
    const x = ox + i, y = oy + j;
    if (x < 0 || y < 0 || x >= m.w || y >= m.h) continue;
    const k = y * m.w + x;
    vx.fillStyle = TILE_COLOR[m.tile[k]] || '#000';
    vx.fillRect(i * T, j * T, T, T);
    const a = m.areaAt[k] >= 0 ? m.areas[m.areaAt[k]] : null;
    if (a && a.rank) { vx.globalAlpha = 0.22; vx.fillStyle = RANK_COLOR[a.rank]; vx.fillRect(i * T, j * T, T, T); vx.globalAlpha = 1; }
    if (m.secret[k]) { vx.fillStyle = 'rgba(234,214,166,0.12)'; vx.fillRect(i * T, j * T, T, T); }   // 아주 옅게 — 눈썰미 있는 사람만
  }
  const inView = (x, y) => x >= ox && y >= oy && x < ox + VIEW && y < oy + VIEW;
  const glyph = (x, y, icon, scale = 0.72) => {
    vx.font = `${Math.round(T * scale)}px system-ui, "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
    vx.textAlign = 'center'; vx.textBaseline = 'middle';
    vx.fillText(icon, (x - ox + 0.5) * T, (y - oy + 0.55) * T);
  };
  for (const port of m.ports) if (inView(port.x, port.y)) {
    vx.fillStyle = hooks.portOpen(port) ? '#3fae4a' : '#5c3a1a';
    vx.fillRect((port.x - ox) * T + 2, (port.y - oy) * T + 2, T - 4, T - 4);
  }
  for (const post of m.posts) {
    if (!inView(post.x, post.y) || !hooks.postAlive(post.enemy)) continue;
    const f = getEnemy(post.enemy);
    vx.strokeStyle = KIND_COLOR[f.kind]; vx.lineWidth = 3;
    vx.strokeRect((post.x - ox) * T + 1.5, (post.y - oy) * T + 1.5, T - 3, T - 3);
    vx.fillStyle = '#000'; glyph(post.x, post.y, f.icon);
  }
  for (const mob of world.mobs) {
    if (!inView(mob.x, mob.y)) continue;
    const cx = (mob.x - ox + 0.5) * T, cy = (mob.y - oy + 0.5) * T;
    if (mob.aura) {   // 기운 — 그 색으로 빛남
      vx.save(); vx.shadowColor = mob.aura.color; vx.shadowBlur = T * 0.6;
      vx.strokeStyle = mob.aura.color; vx.lineWidth = 3;
      vx.beginPath(); vx.arc(cx, cy, T * 0.45, 0, Math.PI * 2); vx.stroke(); vx.restore();
    }
    vx.globalAlpha = mob.frozen > 0 ? 0.45 : 1;
    vx.fillStyle = '#000'; glyph(mob.x, mob.y, getEnemy(mob.monster).icon);
    vx.globalAlpha = 1;
    vx.fillStyle = TEMPER[mob.temper][1];
    vx.beginPath(); vx.arc((mob.x - ox) * T + T * 0.18, (mob.y - oy) * T + T * 0.18, T * 0.13, 0, Math.PI * 2); vx.fill();
    if (mob.mode === 'chase') { vx.fillStyle = '#d0473f'; vx.font = `bold ${Math.round(T * 0.5)}px sans-serif`; vx.fillText('!', (mob.x - ox + 0.82) * T, (mob.y - oy + 0.2) * T); }
  }
  // 나
  vx.fillStyle = '#1c1007'; vx.strokeStyle = '#f6e7c3'; vx.lineWidth = 3;
  vx.beginPath(); vx.arc((half + 0.5) * T, (half + 0.5) * T, T * 0.34, 0, Math.PI * 2); vx.fill(); vx.stroke();
  drawHud();
  drawMini();
}

function drawHud() {
  const run = State.run, p = world.player;
  const a = MapRules.areaAt(world, p.x, p.y);
  if (a) here = a;
  const z = here && here.zone ? ZONES.find(zz => zz.id === here.zone) : null;
  const near = world.mobs.filter(mm => Math.abs(mm.x - p.x) + Math.abs(mm.y - p.y) <= 6)
    .map(mm => `${getEnemy(mm.monster).name}(${TEMPER[mm.temper][0]}${mm.aura ? ' · ' + mm.aura.name : ''})`);
  $('hud').textContent = `${z ? `제${z.rank}격 ${z.name} · ${here.name} 구역` : here ? here.name : '길 위'} · 에너지 ${run.energy} · Lv.${fmtLevel(run.level)} · 꺾은 것 ${run.kills}`
    + `\n가까이: ${near.length ? near.join(', ') : '없음'}`;
}

// 작은 지도 — 지도 전체와 내 자리
const mini = $('mini'), mx = mini.getContext('2d');
const MS = 2;   // 칸 하나 = 2px. 화면이 좁으면 CSS 로 줄여 보입니다
let miniBase = null;
function drawMiniBase() {
  mini.width = map.w * MS; mini.height = map.h * MS;
  for (let y = 0; y < map.h; y++) for (let x = 0; x < map.w; x++) {
    const k = y * map.w + x, a = map.areaAt[k] >= 0 ? map.areas[map.areaAt[k]] : null;
    mx.fillStyle = a && a.rank ? RANK_COLOR[a.rank] : map.secret[k] ? TILE_COLOR[1] : TILE_COLOR[map.tile[k]] || '#000';
    mx.fillRect(x * MS, y * MS, MS, MS);
  }
  miniBase = mx.getImageData(0, 0, mini.width, mini.height);
}
function drawMini() {
  if (!miniBase) return;
  mx.putImageData(miniBase, 0, 0);
  for (const post of map.posts) if (hooks.postAlive(post.enemy)) {
    mx.fillStyle = KIND_COLOR[getEnemy(post.enemy).kind];
    mx.fillRect(post.x * MS - 1, post.y * MS - 1, MS + 2, MS + 2);
  }
  const p = world.player, r = MapRules.RULES.SIGHT;
  mx.strokeStyle = '#f6e7c3'; mx.lineWidth = 1;
  mx.strokeRect((p.x - r) * MS + 0.5, (p.y - r) * MS + 0.5, VIEW * MS, VIEW * MS);
  mx.fillStyle = '#fff'; mx.fillRect(p.x * MS - 1, p.y * MS - 1, MS + 2, MS + 2);
}

// ───────────────────────── 조작 ─────────────────────────
const KEYS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right' };
const held = [];
document.addEventListener('keydown', ev => {
  if (ev.target.tagName === 'INPUT' || ev.target.tagName === 'SELECT') return;
  if (ev.key === 'Enter') { ev.preventDefault(); doEngage(); return; }
  if (ev.key === 'Escape') { ev.preventDefault(); doRetreat(); return; }
  const d = KEYS[ev.key];
  if (!d || !world) return;
  ev.preventDefault();
  if (!held.includes(d)) held.push(d);
  MapRules.setInput(world, held[held.length - 1]);   // 나중에 누른 쪽으로
});
document.addEventListener('keyup', ev => {
  const d = KEYS[ev.key];
  if (!d || !world || !held.includes(d)) return;
  held.splice(held.indexOf(d), 1);
  MapRules.setInput(world, null);
  if (held.length) MapRules.setInput(world, held[held.length - 1]);
});

// 가상 조이스틱 — 칸 단위라 상하좌우 넷으로 끊습니다. 누르고 있으면 계속 걷고, 떼면 섭니다.
// 닿은 뒤에는 같은 쪽으로 누른 채로는 다시 걷지 않습니다 — 손을 떼거나 다른 쪽으로 밀어야 (map.js 의 setInput)
const stick = $('stick'), knob = $('knob');
let stickId = null, stickDir = null;
function stickMove(ev) {
  const r = stick.getBoundingClientRect();
  const dx = ev.clientX - (r.left + r.width / 2), dy = ev.clientY - (r.top + r.height / 2);
  const len = Math.hypot(dx, dy), max = r.width / 2 - 26, k = len > max ? max / len : 1;
  knob.style.left = `${40 + dx * k}px`; knob.style.top = `${40 + dy * k}px`;
  const dir = len < 14 ? null : Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
  if (world && dir !== stickDir) {
    MapRules.setInput(world, null);
    MapRules.setInput(world, dir);
  }
  stickDir = dir;
}
function stickEnd() {
  stickId = null;
  stickDir = null;
  knob.style.left = knob.style.top = '40px';
  if (world) MapRules.setInput(world, null);
}
stick.addEventListener('pointerdown', ev => { stickId = ev.pointerId; stick.setPointerCapture(ev.pointerId); stickMove(ev); });
stick.addEventListener('pointermove', ev => { if (ev.pointerId === stickId) stickMove(ev); });
stick.addEventListener('pointerup', stickEnd);
stick.addEventListener('pointercancel', stickEnd);

// ───────────────────────── 열기 ─────────────────────────
$('setup').onclick = setup;
$('again').onclick = () => beginRun(false);
$('from').onchange = defaults;
window.addEventListener('resize', resize);
fetch('../maps/overworld.tmj').then(r => r.json()).then(tmj => {
  map = MapRules.parseTiled(tmj, 'overworld');
  $('from').innerHTML = '<option value="0">첫 공간</option>' + [1, 2, 3, 4, 5, 6].map(n => `<option value="${n}">${n}격 입구 — ${ZONES.find(z => z.rank === n).name}</option>`).join('');
  defaults();
  resize();
  setup();
  requestAnimationFrame(frame);
}).catch(err => { $('hud').textContent = `지도를 못 읽었습니다 (${err.message}) — 로컬 서버(python -m http.server)로 여세요.`; });
</script>
</body>
