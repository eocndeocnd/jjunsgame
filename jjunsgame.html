// 다음 단계의 표 한 줄. 이미 끝까지 올렸으면 null
function nextEnhance(slot) {
  const lv = enhanceLevel(slot);
  return lv < ENHANCE_MAX ? ENHANCE_TABLE[lv] : null;
}

// 이번 시도의 성공 확률. 실패해도 오르지 않습니다.
function enhanceChance(slot) {
  const nx = nextEnhance(slot);
  return nx ? nx.rate : 0;
}

function canEnhance(slot) {
  const nx = nextEnhance(slot);
  return !!nx && stonesOf(slot) >= nx.cost;
}

// 한 번 시도합니다. 실패하면 강화석만 사라지고 단계는 그대로입니다.
function tryEnhance(slot) {
  if (!canEnhance(slot)) return null;
  const meta = State.meta;
  const nx = nextEnhance(slot);
  const chance = enhanceChance(slot);
  meta.stones[slot] -= nx.cost;

  const success = Math.random() < chance;
  if (success) meta.enhance[slot] = enhanceLevel(slot) + 1;

  const lv = enhanceLevel(slot);
  pushLog(success ? 'enhance' : 'info', success
    ? `⚒ ${SLOT_NAMES[slot]} 강화 성공 — +${lv} (핵심 스탯 +${Math.round(enhanceBonus(lv) * 100)}%)`
    : `${SLOT_NAMES[slot]} 강화 실패 — 강화석 ${fmt(nx.cost)}개가 부서졌다`);
  save();
  return { success, level: lv, cost: nx.cost, chance };
}

// 꺾어본 보스 수만큼 경험치가 영구히 곱해집니다.
// 이게 "다음 회차엔 초반 지역을 훅 지나간다" 는 감각의 정체입니다.
function bossXpMult() {
  return Math.pow(RULES.BOSS_XP_MULT, State.meta.bossesBeaten.length);
}

// ---------- 삼킨 격 ----------
// 『격을 삼키는 검』으로 적립해둔 에너지. 회차 시작부터 얹혀 있습니다.
function bankedEnergy() {
  return State.meta.banked.reduce((n, id) => {
    const e = getEnemy(id);
    return n + (e ? KINDS[e.kind].energy : 0);
  }, 0);
}

function startEnergy() { return RULES.START_ENERGY + bankedEnergy(); }

// 지금 『격을 삼키는 검』을 들고 있는가
function hasDevourer() { return State.meta.equipped.weapon === DEVOURER_ID; }

// 「관측자」가 모습을 드러냈는가
function hiddenUnlocked() { return State.meta.bossesBeaten.length >= HIDDEN_UNLOCK_BOSSES; }

// 히든이 모습을 드러냈는가.
//   관측자          — 보스를 다섯 꺾은 뒤
//   칸을 여는 히든  — 그 지역 보스를 한 번이라도 꺾은 뒤
function isRevealed(foe) {
  if (foe.kind !== 'hidden') return true;
  if (!foe.opens) return hiddenUnlocked();
  const boss = zoneBoss(foe.zoneIndex);
  return !!boss && State.meta.bossesBeaten.includes(boss.id);
}

// 이 지역에서 지금 찾아갈 수 있는 자리들 (아직 안 나타난 히든은 뺍니다)
function visiblePosts(zi) {
  return zonePosts(zi).filter(isRevealed);
}

// ---------- 스탯 분배 ----------
//
// run.spent   이미 찍어 넣은 포인트. 되돌릴 수 없고, 비율을 바꿔도 안 움직입니다.
// run.unspent 레벨업으로 받았지만 아직 안 찍은 포인트.
// meta.weights 앞으로 들어올 포인트를 어떻게 나눌지에 대한 규칙.
//
// 비율은 "지금부터" 에만 적용됩니다. 초반에 생명에 몰아줬다가 나중에 공격으로
// 틀면, 그동안 쌓인 생명은 그대로 남고 새 포인트만 공격으로 갑니다.

// STAT_KEYS 를 따라갑니다. 손으로 적어두면 스탯이 늘 때마다 NaN 이 새어나옵니다.
function emptySpent() { return Object.fromEntries(STAT_KEYS.map(k => [k, 0])); }

// 찍어둔 포인트를 실제 스탯 보너스로 환산
function allocatedStats() {
  const sp = State.run ? State.run.spent : emptySpent();
  const out = emptySpent();
  for (const k of STAT_KEYS) out[k] = sp[k] * POINT_VALUE[k];
  return out;
}

// 안 찍은 포인트를 지금 비율대로 전부 밀어 넣습니다. 돌아올 수 없습니다.
function commitPoints() {
  const run = State.run;
  const w = State.meta.weights;
  const sum = STAT_KEYS.reduce((n, k) => n + (w[k] || 0), 0);
  const pool = run.unspent;
  if (pool <= 0 || sum <= 0) return 0;

  let used = 0, topKey = STAT_KEYS[0], topW = -1;
  for (const k of STAT_KEYS) {
    const give = Math.floor(pool * w[k] / sum);
    run.spent[k] += give;
    used += give;
    if (w[k] > topW) { topW = w[k]; topKey = k; }
  }
  run.spent[topKey] += pool - used;   // 나눠떨어지지 않은 나머지는 비중이 큰 쪽으로
  run.unspent = 0;
  save();
  return pool;
}

// 자동 분배를 켜두면 레벨이 오를 때마다 알아서 들어갑니다.
// 레벨이 한 번에 수천씩 오르는 게임이라 매번 손으로 찍는 건 고역이니까요.
function setAutoAlloc(on) {
  State.meta.autoAlloc = !!on;
  if (on) commitPoints();
  save();
}

// 비율은 "칸" 으로 셉니다. 한 칸 더 넣으면 그만큼 지분이 커지고,
// 나머지 스탯의 지분은 알아서 줄어듭니다.
//   생명만 1칸        → 생명 100%
//   + 공격 1칸        → 50 / 50
//   + 방어 1칸        → 33 / 33 / 33
//   + 생명 1칸 (총 2) → 생명 50 · 공격 25 · 방어 25
function addWeight(stat, n = 1) {
  const w = State.meta.weights;
  w[stat] = Math.max(0, Math.min(99, (w[stat] || 0) + n));
  save();
}

// STAT_KEYS 순서대로 받습니다 — 생명 · 공격력 · 방어력 · 민첩 · 행운
function setWeights(...vals) {
  State.meta.weights = Object.fromEntries(STAT_KEYS.map((k, i) => [k, vals[i] ?? 0]));
  save();
}

function clearWeights() { setWeights(...STAT_KEYS.map(() => 0)); }

// ---------- 저장 / 불러오기 ----------
function save() {
  try {
    if (!currentSlot) return;
    localStorage.setItem(saveKey(currentSlot), JSON.stringify(State.meta));
  } catch (e) {
    console.warn('저장 실패:', e);
  }
}

function load() {
  try {
    const raw = currentSlot ? localStorage.getItem(saveKey(currentSlot)) : null;
    if (!raw) return;
    const data = JSON.parse(raw);
    State.meta = { ...freshMeta(), ...data };
    State.meta.equipped = { ...emptyEquipped(), ...(data.equipped || {}) };
    State.meta.bossesBeaten = Array.isArray(data.bossesBeaten) ? data.bossesBeaten : [];
    State.meta.banked = Array.isArray(data.banked) ? data.banked : [];
    State.meta.specialOpened = Array.isArray(data.specialOpened) ? data.specialOpened : [];
    State.meta.seen = Array.isArray(data.seen) ? data.seen : [];
    State.meta.fresh = (data.fresh && typeof data.fresh === 'object') ? data.fresh : {};
    State.meta.sets = Array.isArray(data.sets) ? data.sets : [null, null, null];
    State.meta.settings = { ...defaultSettings(), ...(data.settings || {}) };
    for (const k of FIXED_SETTINGS) State.meta.settings[k] = defaultSettings()[k];
    State.meta.tutorialDone = !!data.tutorialDone;
    State.meta.weights = { ...defaultWeights(), ...(data.weights || {}) };
    State.meta.autoAlloc = data.autoAlloc !== false;
    State.meta.stones = { ...stoneZeros(), ...(data.stones || {}) };
    State.meta.enhance = { ...slotZeros(), ...(data.enhance || {}) };
    delete State.meta.enhanceFails;   // 실패 보정은 뺐습니다 — 그때 저장된 실패 횟수는 버립니다
    for (const s of SLOT_IDS) State.meta.enhance[s] = Math.min(ENHANCE_MAX, Math.max(0, num(State.meta.enhance[s])));

    // 예전 저장본은 owned 가 배열이었습니다. 개수 맵으로 옮겨줍니다.
    let owned = data.owned || {};
    if (Array.isArray(owned)) {
      const map = {};
      for (const id of owned) map[id] = (map[id] || 0) + 1;
      owned = map;
    }

    // 겹 시스템 시절 저장본은 owned 가 "겹친 개수" 였습니다.
    // 장비는 하나만 남기고, 겹쳐 있던 나머지는 지금 분해한 셈 치고 강화석으로 돌려드립니다.
    // 특수장비에 자리를 내주고 빠진 전리품은 통째로 그 부위의 강화석이 됩니다.
    // 그 밖에 사라진 아이템 id 가 남아 있으면 여기서 걸러냅니다.
    State.meta.owned = {};
    for (const [id, n] of Object.entries(owned)) {
      const it = getItem(id);
      if (!it) {
        const gone = RETIRED_ITEMS[id];
        if (gone) State.meta.stones[gone.slot] += Math.max(1, num(n)) * stoneYield(gone);
        continue;
      }
      State.meta.owned[id] = 1;
      if (n > 1 && !it.unique) State.meta.stones[it.slot] += (n - 1) * stoneYield(it);
    }
    for (const slot of ALL_SLOT_IDS) {
      if (!owns(State.meta.equipped[slot])) State.meta.equipped[slot] = null;
    }

    // 예전 저장본에는 activeSet 이 없습니다. 그때는 세트가 "저장해뒀다 꺼내 쓰는"
    // 물건이라 입고 있던 것이 어느 세트인지가 없었습니다.
    // 지금 입은 것을 0번 세트로 삼고, 나머지는 있던 그대로 둡니다.
    const n = Number(data.activeSet);
    State.meta.activeSet = (Number.isInteger(n) && n >= 0 && n < SET_COUNT) ? n : 0;
    syncActiveSet();
  } catch (e) {
    console.warn('불러오기 실패:', e);
  }
}

function freshMeta() {
  return {
    owned: {},
    stones: stoneZeros(),
    enhance: slotZeros(),
    equipped: emptyEquipped(),
    weights: defaultWeights(),
    autoAlloc: true,
    seen: [],
    tutorialDone: false,
    sets: [null, null, null],
    activeSet: 0,
    settings: defaultSettings(),
    fresh: {},
    bossesBeaten: [],
    banked: [],
    specialOpened: [],
    runCount: 0,
    bestLevel: 1,
    bestKill: 0,
    bestZone: 1,
    cleared: false
  };
}

function wipeSave() {
  if (currentSlot) wipeSlot(currentSlot);
  State.meta = freshMeta();
  startRun();
}

// ---------- 영웅 스탯 계산 ----------
// 레벨에서 오는 기본 스탯 + 착용 중인 전리품 보너스
function heroStats() {
  const level = State.run ? State.run.level : 1;
  const base = heroBaseStats(level);
  const alloc = allocatedStats();
  const total = {};
  for (const k of STAT_KEYS) total[k] = base[k] + alloc[k];
  for (const k of SPECIAL_KEYS) total[k] = 0;

  for (const slot of ALL_SLOT_IDS) {
    const id = State.meta.equipped[slot];
    if (!id || !isSlotOpen(slot)) continue;   // 닫힌 특수장비 칸에 남은 것은 안 셉니다
    const item = getItem(id);
    if (!item) continue;
    const m = slotMult(slot);   // 그 부위를 강화한 만큼 강해집니다 (특수장비 칸은 ×1)
    // 강화는 **핵심 스탯만** 키웁니다.
    // 특수 능력치까지 배수를 먹이면 보스 장비 하나로 크리 +18% 가 나오고,
    // 열두 부위를 채우면 상한에 그냥 닿아버립니다. 그러면 공격·생명·민첩이
    // 아니라 특수 쪽이 주인공이 됩니다. 특수는 장비의 **성격**이지 위력이 아닙니다.
    for (const k of STAT_KEYS)    total[k] += (item[k] || 0) * m;
    for (const k of SPECIAL_KEYS) total[k] += (item[k] || 0);
  }

  // 같은 성격을 여러 부위에 끼면 붙는 세트 효과
  for (const [k, v] of Object.entries(setBonuses())) total[k] += v;

  // 다 모은 격 하나마다 핵심 스탯 전체가 조금씩 — 레벨·분배·장비를 다 합친 뒤에 곱합니다
  const collect = 1 + COLLECTION_BONUS * completedRanks();
  for (const k of STAT_KEYS) total[k] = Math.round(total[k] * collect);
  // 특수 능력치는 상한을 둡니다 — 막기 100% 같은 게 나오면 전투가 성립 안 합니다
  for (const k of SPECIAL_KEYS) total[k] = Math.min(SPECIAL_INFO[k].cap, total[k]);
  return total;
}

// ---------- 전투 ----------
//
// 한 턴에 일어나는 일:
//   1. 명중 판정  — 빗나가면 그 턴은 그냥 날아갑니다 (민첩 같으면 75% 명중)
//   2. 피해량 굴림 — ±15% 편차
//   3. 크리 판정  — 터지면 2배 이상 (민첩이 높을수록 확률·배수 상승)
//
// 1번과 3번이 이 게임에서 승률을 0%/100% 로 굳지 않게 하는 장치입니다.
// 피해량 편차만 있으면 긴 전투에서 평균으로 수렴해버려 승패가 미리 정해집니다.
// 빗나감과 크리는 발동/불발이 뚜렷해서 열 턴쯤 되는 전투를 실제로 뒤집습니다.
// log 에 배열을 넘기면 한 번 한 번의 공격을 적어둡니다 — 전투 화면이 그걸 보고 다시 틀어줍니다.
// 승률을 잴 때는 수백 번 돌리므로 적지 않습니다 (log 없이 부릅니다).
//   { t: 턴, who: 'hero'|'foe', k: 'hit'|'miss'|'block'|'regen'|'steal'|'reflect'|'extra'|'survive',
//     v: 피해·회복량, crit, harm, hp: 내 생명, fhp: 상대 생명 }
const BATTLE_LOG_MAX = 600;

function simulateBattle(hero, enemy, rng = Math.random, log = null) {
  let heroHp = hero.life;
  let foeHp = enemy.life;
  const MAX_TURNS = 3000; // 무한루프 방지

  // 전투 내내 바뀌지 않는 값들은 미리 계산해둡니다
  const hHit = hitChance(hero.dex, enemy.dex);
  const fHit = hitChance(enemy.dex, hero.dex);
  const hCrit = critChance(hero.dex, hero.luck, hero.critRate), hCritDmg = critDamage(hero.dex);
  const fCrit = critChance(enemy.dex, enemy.luck, 0),           fCritDmg = critDamage(enemy.dex);
  const hBase = damageFormula(hero.damage, piercedDefense(enemy.defense, hero.pierce));
  const fBase = damageFormula(enemy.damage, hero.defense);

  const hDouble  = num(hero.doubleHit);    // 한 턴에 두 번
  const hSteal   = num(hero.lifesteal);    // 준 피해의 일부 회복
  const hBlock   = num(hero.block);        // 통째로 흘리기
  const hThorn   = num(hero.reflect);      // 맞은 만큼 되돌리기
  const hRegen   = num(hero.regen);        // 내 턴마다 생명의 일부 회복
  const hHarm    = num(hero.harmTouch);    // 가끔 10배 — 그 한 방은 크리가 안 터집니다
  const hTurn    = num(hero.doubleTurn);   // 상대가 움직이기 전에 한 번 더
  const hSurvive = num(hero.survive);      // 쓰러질 한 방을 1 남기고 버팀 (전투당 한 번)
  let survived = false;

  const roll = () => 0.85 + rng() * 0.30;
  let turn = 0;
  const note = log
    ? (who, k, v = 0, extra = null) => {
        if (log.length < BATTLE_LOG_MAX) log.push({ t: turn, who, k, v, ...extra, hp: Math.max(0, heroHp), fhp: Math.max(0, foeHp) });
      }
    : () => {};

  // 영웅이 한 번 움직입니다. 상대가 쓰러지면 true.
  function heroAct() {
    if (hRegen > 0 && heroHp < hero.life) {
      const heal = Math.min(hero.life - heroHp, hero.life * hRegen);
      heroHp += heal;
      note('hero', 'regen', heal);
    }
    const swings = 1 + (rng() < hDouble ? 1 : 0);
    for (let s = 0; s < swings; s++) {
      if (rng() >= hHit) { note('hero', 'miss', 0, { second: s > 0 }); continue; }   // 빗나감
      let out = hBase * roll();
      const harm = hHarm > 0 && rng() < hHarm;
      const crit = !harm && rng() < hCrit;
      if (harm) out *= HARM_TOUCH_MULT;
      else if (crit) out *= hCritDmg;
      out = Math.max(1, out);
      foeHp -= out;
      note('hero', 'hit', out, { crit, harm, second: s > 0 });
      if (hSteal > 0 && heroHp < hero.life) {
        const heal = Math.min(hero.life - heroHp, out * hSteal);
        heroHp += heal;
        if (heal >= 1) note('hero', 'steal', heal);
      }
      if (foeHp <= 0) return true;
    }
    return false;
  }

  for (turn = 1; turn <= MAX_TURNS; turn++) {
    // ── 영웅의 턴 ── (연속 턴이 터지면 한 번 더 — 한 턴에 한 번까지)
    if (heroAct()) return { win: true, turns: turn, heroHpLeft: heroHp };
    if (hTurn > 0 && rng() < hTurn) {
      note('hero', 'extra');
      if (heroAct()) return { win: true, turns: turn, heroHpLeft: heroHp };
    }

    // ── 화신의 턴 ──
    if (rng() >= fHit) { note('foe', 'miss'); continue; }
    if (rng() < hBlock) { note('foe', 'block'); continue; }   // 막기에 걸리면 통째로 흘립니다
    let inc = fBase * roll();
    const crit = rng() < fCrit;
    if (crit) inc *= fCritDmg;
    inc = Math.max(1, inc);

    // 생존 — 이 한 방에 쓰러질 때만, 전투당 한 번
    if (heroHp - inc <= 0 && !survived && hSurvive > 0 && rng() < hSurvive) {
      survived = true;
      inc = heroHp - 1;
      heroHp = 1;
      note('foe', 'hit', inc, { crit });
      note('hero', 'survive');
    } else {
      heroHp -= inc;
      note('foe', 'hit', inc, { crit });
    }

    // 반사는 상대 방어를 무시하고 그대로 돌려줍니다
    if (hThorn > 0) {
      foeHp -= inc * hThorn;
      note('hero', 'reflect', inc * hThorn);
      if (foeHp <= 0) return { win: true, turns: turn, heroHpLeft: Math.max(0, heroHp) };
    }
    if (heroHp <= 0) return { win: false, turns: turn, heroHpLeft: 0 };
  }
  return { win: false, turns: MAX_TURNS, heroHpLeft: heroHp };
}

// 같은 전투를 여러 번 돌려서 승률을 추정합니다.
// 승패가 정말 뻔한 경우만 시뮬레이션을 건너뜁니다.
function winChance(hero, enemy, samples = 200) {
  const heroDps = Math.max(0.001, expectedTurnDamage(hero, enemy));
  const foeDps  = Math.max(0.001, expectedTurnDamage(enemy, hero));
  const turnsToKill = enemy.life / heroDps;
  const turnsToDie  = hero.life  / foeDps;

  // 운으로도 못 뒤집을 만큼 차이가 크면 굴리지 않습니다.
  // 크리와 빗나감이 있어서 예전보다 훨씬 넉넉하게(3배) 잡아야 합니다.
  if (turnsToKill * 3 < turnsToDie) return 1;
  if (turnsToDie  * 3 < turnsToKill) return 0;

  let wins = 0;
  for (let i = 0; i < samples; i++) if (simulateBattle(hero, enemy).win) wins++;
  return wins / samples;
}

// ---------- 회차 ----------
function startRun() {
  State.meta.runCount += 1;
  State.run = {
    level: 1,
    xp: 0,
    spent: emptySpent(),          // 이미 찍은 포인트 (되돌릴 수 없음)
    unspent: POINTS_PER_LEVEL,    // Lv.1 몫부터 지급
    energy: startEnergy(),   // 기본 + 지금까지 삼켜둔 격
    kills: 0,
    zoneIndex: 0,        // 지금 있는 지역
    zoneCleared: false,  // 이 지역 보스를 꺾어서 길이 열렸는가
    spentOn: {},         // 정예·히든·보스별로 도전에 쓴 에너지 — 꺾으면 그만큼 돌려받습니다
    downed: [],          // 이 여정에서 이미 꺾은 정예·보스 id — 다시 못 만납니다
    progress: 0,         // 이 지역에서 이긴 횟수
    encounter: null,     // 지금 마주한 적 id (없으면 null)
    aura: null,          // 그 화신이 두른 기운 (없으면 null)
    lastResult: null,    // 방금 끝난 전투의 결과 — 결과 화면이 이걸 보고 그립니다
    onBoss: false,       // 그 조우가 보스전인가
    over: false,
    victory: false,
    reason: ''
  };
  if (State.meta.autoAlloc) commitPoints();

  State.log = [];
  const z = ZONES[0];
  const banked = bankedEnergy();
  pushLog('info', `${State.meta.runCount}회차 — 아무것도 아닌 상태로 ${z.name}에 선다. 에너지 ${State.run.energy}.`);
  if (banked > 0) pushLog('devour', `이미 삼켜둔 격이 ${State.meta.banked.length}. 에너지 +${banked}를 들고 시작한다.`);
  save();
}

function endRun(reason) {
  const run = State.run;
  run.over = true;
  run.reason = reason;
  run.encounter = null;
  if (run.level > State.meta.bestLevel) State.meta.bestLevel = run.level;

  if (run.victory) {
    pushLog('rank', `━━ 여정의 끝 — ${State.meta.runCount}회차에 모든 격을 넘어섰다 ━━`);
  } else {
    const r = rankOf(run.level);
    pushLog('death', `격이 무너졌다 — ${reason}  (제${r.n}격 ${r.name} · Lv.${fmtLevel(run.level)} · ${run.kills}명을 꺾음)`);
    pushLog('info', '격은 사라졌지만 빼앗은 것은 남는다.');
  }
  save();
}

// 에너지가 바닥났고 아직 마주한 적이 없으면 여정이 끝납니다.
function checkEnergy() {
  const run = State.run;
  if (run.over || run.encounter) return;
  if (run.energy <= 0) endRun('에너지 고갈');
}

// ---------- 경험치 / 레벨업 ----------
// 레벨이 수백만까지 올라가므로 한 칸씩 빼는 반복문으로는 감당이 안 됩니다.
// 누적 경험치 ↔ 레벨을 닫힌 식으로 바로 환산합니다.
//   누적(L) ≈ (100 / 1.9) * L^1.9   →   L ≈ (누적 * 1.9 / 100)^(1/1.9)
// totalXpFor / levelFromTotalXp 는 data.js 에 있습니다 —
// xpToNext 가 같은 식에서 뽑혀야 해서 수식끼리 한곳에 모았습니다.

function gainXp(amount) {
  const run = State.run;
  const before = run.level;
  const total = totalXpFor(run.level) + run.xp + amount;
  const after = levelFromTotalXp(total);
  run.level = after;
  run.xp = Math.max(0, total - totalXpFor(after));

  const gained = after - before;
  if (gained > 0) {
    run.unspent += gained * POINTS_PER_LEVEL;
    if (State.meta.autoAlloc) commitPoints();
  }
  return gained;
}

// ---------- 여정 ----------
function currentZone() { return ZONES[State.run.zoneIndex]; }

// ─────────────────────────────────────────────────────────────
//  ※ 맵 이동으로 바꿀 때의 이음매 (docs/MAP-PLAN.md 참고)
//
//  나중에 캐릭터를 직접 움직이게 만들 예정입니다. 그때 손댈 곳은
//  아래 세 함수뿐이고, 전투 파이프라인(beginEncounter → engage/retreat)은
//  그대로 씁니다.
//
//    canAct()        — 움직일 수 있는 상태인가          (그대로)
//    pickEncounter() — 누구를 만나는가                  ← 타일 조회로 교체
//    travel()        — 한 걸음 = 에너지 1               ← 방향 인자를 받게 교체
// ─────────────────────────────────────────────────────────────

// 움직일 수 있는 상태인지 확인하고, 에너지가 없으면 여정을 끝냅니다.
function canAct() {
  const run = State.run;
  if (run.over || run.encounter) return false;
  if (run.energy < RULES.TRAVEL_COST) { endRun('에너지 고갈'); return false; }
  return true;
}

// 이 지역에서 다음으로 마주칠 적을 고릅니다.
//
// 완전 무작위로 뽑으면 Lv.1 인데 Lv.18 짜리가 1/9 확률로 튀어나옵니다.
// 그래서 **내 레벨 근처가 자주 뜨도록** 가중치를 겁니다.
//
// 가중치는 레벨 비율(상대/나)에 대한 종 모양 곡선입니다. 로그 축에서 재기 때문에
// 레벨이 1이든 100억이든 체감이 같습니다. 중심을 0.9 에 둬서 살짝 아래쪽,
// 즉 "이길 만한 상대"가 조금 더 자주 나오게 했습니다.
const ENCOUNTER_CENTER = 0.9;   // 내 레벨의 몇 배가 제일 자주 나오는가
const ENCOUNTER_SPREAD = 0.8;   // 클수록 폭넓게 섞여 나옵니다

function encounterWeight(enemyLevel, heroLevel) {
  const z = (Math.log(enemyLevel / Math.max(1, heroLevel)) - Math.log(ENCOUNTER_CENTER)) / ENCOUNTER_SPREAD;
  return Math.exp(-z * z);
}

function pickEncounter(zoneIndex) {
  const pool = zoneNormals(zoneIndex);
  const level = State.run.level;
  const weights = pool.map(e => encounterWeight(e.level, level));
  const total = weights.reduce((a, b) => a + b, 0);

  // 내 레벨이 이 지역을 한참 넘어섰다면 전부 0 에 수렴합니다 — 그땐 제일 센 놈
  if (!(total > 1e-9)) return pool[pool.length - 1];

  let r = Math.random() * total;
  for (let i = 0; i < pool.length; i++) {
    r -= weights[i];
    if (r <= 0) return pool[i];
  }
  return pool[pool.length - 1];
}

// 조우 시작. 누구를 만나든 여기를 거칩니다.
function beginEncounter(foe, isBoss) {
  const run = State.run;
  run.encounter = foe.id;
  run.onBoss = isBoss;
  run.aura = rollAura();   // 보스도 기운을 두를 수 있습니다
  markSeen(foe.id);        // 직접 마주쳐야 이름이 드러납니다
  return run.aura;
}

// ---------- 목격 ----------
// 한 번이라도 마주친 적만 이름이 보입니다. 나머지는 ??? 입니다 —
// 목록에 전부 적어두면 만나는 재미가 없으니까요. 회차가 바뀌어도 기억은 남습니다.
function isSeen(id) { return State.meta.seen.includes(id); }

function markSeen(id) {
  if (!State.meta.seen.includes(id)) {
    State.meta.seen.push(id);
    save();
  }
}

// 길을 떠난다 — 에너지를 쓰고 이 지역의 화신 하나를 만납니다.
function travel() {
  if (!canAct()) return;
  const run = State.run;

  run.energy -= RULES.TRAVEL_COST;
  const foe = pickEncounter(run.zoneIndex);
  const aura = beginEncounter(foe, false);

  if (aura) {
    pushLog('aura', `✦ ${aura.name} ${foe.name}${josa(foe.name, '이', '가')} 나타났다 — ${aura.desc} ✦`);
  } else {
    pushLog('travel', `길을 떠났다 — ${foe.icon} ${foe.name}${josa(foe.name, '이', '가')} 앞을 막아섰다`);
  }
  save();
}

// 정해진 자리의 상대(정예·히든·보스) 도전에 쓴 에너지를 기록합니다 (접근 비용 + 패배 페널티)
function addSpentOn(id, n) {
  const run = State.run;
  if (!run.spentOn) run.spentOn = {};
  run.spentOn[id] = (run.spentOn[id] || 0) + n;
}

// 이 여정에서 이미 꺾었는가 (정예·보스 전용)
function isDowned(enemyId) { return State.run.downed.includes(enemyId); }

// 정해진 자리에 선 것(정예 또는 보스)에게 향한다.
// 늘 그 자리에 있으므로 언제든 갈 수 있지만, 마주하면 물러설 수 없습니다.
// 그리고 한 번 꺾으면 이 여정에선 다시 만날 수 없습니다.
function approachPost(enemyId) {
  if (!canAct()) return;
  const foe = getEnemy(enemyId);
  if (!foe || !foe.once || isDowned(enemyId)) return;

  const run = State.run;
  run.energy -= RULES.TRAVEL_COST;
  addSpentOn(foe.id, RULES.TRAVEL_COST);
  const aura = beginEncounter(foe, true);

  pushLog('rank', foe.kind === 'boss'
    ? `━ ${foe.icon} ${foe.name}${josa(foe.name, '이', '가')} 길을 막았다. 물러설 수 없다 ━`
    : `━ ${foe.icon} ${foe.name} 앞에 섰다. 물러설 수 없다 ━`);
  if (aura) pushLog('aura', `✦ 게다가 ${aura.name} 기운을 두르고 있다 — ${aura.desc} ✦`);
  save();
}

// 보스에게 향한다 (approachPost 의 편의 래퍼)
function approachBoss() {
  const boss = zoneBoss(State.run.zoneIndex);
  if (boss) approachPost(boss.id);
}

// 물러선다 — 에너지는 이미 썼으니 그냥 날아갑니다. 보스한테는 못 씁니다.
function retreat() {
  const run = State.run;
  if (run.over || !run.encounter || run.onBoss) return;
  const foe = getEnemy(run.encounter);
  pushLog('info', `${foe.name} 앞에서 물러섰다. 발걸음만 축냈다.`);
  run.encounter = null;
  run.aura = null;
  checkEnergy();
  save();
}

// 맞선다 — 실제 전투.
function engage() {
  const run = State.run;
  if (run.over || !run.encounter) return null;

  const enemy = getEnemy(run.encounter);
  const wasBoss = run.onBoss;
  const aura = run.aura;
  const hero = heroStats();
  const battleLog = [];   // 전투 화면이 한 방씩 다시 틀어줄 기록
  const result = simulateBattle(hero, enemy, Math.random, battleLog);
  const replay = { log: battleLog, heroMax: hero.life, foeMax: enemy.life };

  run.encounter = null;
  run.onBoss = false;
  run.aura = null;

  // ----- 패배 -----
  // 여정이 바로 끝나지는 않습니다. 대신 에너지를 크게 잃습니다.
  // 일반 -2, 정예 -3, 보스 -5. 큰 자리를 노릴수록 실패가 비쌉니다.
  if (!result.win) {
    const penalty = lossPenaltyFor(enemy.kind);
    run.energy -= penalty;
    if (enemy.once) addSpentOn(enemy.id, penalty);
    pushLog('battle',
      `${enemy.icon} ${enemy.name} 앞에 무릎 꿇었다 — ${result.turns}턴, 에너지 -${penalty}`);
    run.lastResult = { win: false, enemy, turns: result.turns, penalty, aura, drops: [], levelsGained: 0, xp: 0, replay };
    if (run.energy <= 0) {
      run.energy = 0;
      endRun(`${enemy.name}에게 무너졌다`);
    }
    save();
    return run.lastResult;
  }

  // ----- 승리 -----
  run.kills += 1;
  if (enemy.level > State.meta.bestKill) State.meta.bestKill = enemy.level;

  // 경험치 = 기본 × 격차보너스 × 기운 × 꺾은 보스 배수 × 장비의 경험치 보너스
  const gap = underlevelBonus(run.level, enemy.level);
  const auraXp = aura ? aura.xpMult : 1;
  const bossM = bossXpMult();
  const gearXp = xpGearMult();
  const rankXp = rankXpMult(enemy.rank ? enemy.rank.n : 1);
  const xp = Math.round(enemy.xp * gap * auraXp * bossM * gearXp * rankXp);
  const levelBefore = run.level;
  const levelsGained = gainXp(xp);
  const drops = rollDrops(enemy.id, aura ? aura.dropMult : 1);

  const bits = [];
  if (gap > 1.01) bits.push(`격차 ×${gap.toFixed(2)}`);
  if (auraXp > 1) bits.push(`${aura.name} ×${auraXp}`);
  if (bossM > 1.01) bits.push(`보스 ×${bossM.toFixed(2)}`);
  if (gearXp > 1.01) bits.push(`성장 ×${gearXp.toFixed(2)}`);
  const multText = bits.length ? `  (${bits.join(' · ')})` : '';

  pushLog('battle',
    `${enemy.icon} ${enemy.name}${josa(enemy.name, '을', '를')} 꺾었다 (Lv.${fmtLevel(enemy.level)}) — ${result.turns}턴, +${fmt(xp)} EXP${multText}`);

  if (levelsGained > 0) {
    const before = rankOf(run.level - levelsGained);
    const after = rankOf(run.level);
    pushLog('level', `Lv.${fmtLevel(run.level)}  (+${fmtLevel(levelsGained)} 레벨)`);
    if (after.n > before.n) {
      pushLog('rank', `━ 제${after.n}격 · ${after.name}(${after.hanja})에 올랐다 — ${after.desc} ━`);
    }
  }
  for (const d of drops) {
    const g = d.item.grade === 'normal' ? '' : `[${KINDS[d.item.grade].name}] `;
    pushLog('drop', d.isNew
      ? `${g}『${d.item.name}』${josa(d.item.name, '을', '를')} 빼앗았다`
      : `${g}『${d.item.name}』 — 이미 가진 것이라 분해했다. ${SLOT_NAMES[d.item.slot]} 강화석 +${fmt(d.stones)}`);
  }

  if (run.level > State.meta.bestLevel) State.meta.bestLevel = run.level;

  // 정예·히든·보스는 이 여정에서 다시 만날 수 없습니다 — 그래서 그 전리품이 귀합니다
  if (enemy.once) run.downed.push(enemy.id);

  // 『격을 삼키는 검』을 들고 있으면 그 격을 삼켜 에너지로 바꿉니다.
  // 한 번 삼킨 격은 영구히 적립되어, 다음 회차부터 시작 에너지에 얹힙니다.
  let devoured = 0;
  if (enemy.once && hasDevourer() && !State.meta.banked.includes(enemy.id)) {
    devoured = KINDS[enemy.kind].energy;
    State.meta.banked.push(enemy.id);
    run.energy += devoured;
    pushLog('devour',
      `⟡ ${enemy.name}의 격을 삼켰다 — 에너지 +${devoured} (지금 ${run.energy}) · 앞으로 매 회차 시작부터 내 것 ⟡`);
  }

  // 결과 화면이 보고 그릴 내용
  run.lastResult = {
    win: true, enemy, turns: result.turns, aura,
    xp, gap, auraXp, bossM, levelBefore, levelsGained, drops, devoured,
    openedPath: false, replay
  };

  // 정예·히든·보스를 꺾으면 그 상대에게 쓴 에너지를 전부 돌려받습니다.
  // 시작 에너지를 넘어서도 됩니다.
  if (enemy.once) {
    const refund = (run.spentOn && run.spentOn[enemy.id]) || 0;
    if (refund > 0) {
      run.energy += refund;
      run.lastResult.refund = refund;
      pushLog('devour', `⟡ ${enemy.name}에게 쓴 에너지 +${refund} 되찾았다 (지금 ${run.energy}) ⟡`);
    }
  }

  // 칸을 여는 히든을 처음 꺾으면 특수장비 칸이 하나 열립니다 (넷까지)
  if (enemy.opens && !State.meta.specialOpened.includes(enemy.id)) {
    State.meta.specialOpened.push(enemy.id);
    const n = specialOpenCount();
    run.lastResult.openedSpecial = n;
    pushLog('rank', `━━ 특수장비 칸이 열렸다 (${n}/${SPECIAL_SLOT_MAX}) — 보석이나 유물을 끼울 수 있다 ━━`);
    fillSpecialSlots();
  }

  if (enemy.kind === 'boss') {
    // 처음 꺾은 보스라면 영구 경험치 배수가 하나 늘어납니다
    if (!State.meta.bossesBeaten.includes(enemy.id)) {
      State.meta.bossesBeaten.push(enemy.id);
      pushLog('rank', `━━ ${enemy.name}의 격을 빼앗았다 — 앞으로 모든 경험치 ×${bossXpMult().toFixed(1)} ━━`);
      if (hiddenUnlocked() && State.meta.bossesBeaten.length === HIDDEN_UNLOCK_BOSSES) {
        pushLog('devour', '⟡ 어딘가에서 계속 지켜보던 것이 있다. 마계의 왕좌에서 모습을 드러낼 것이다 ⟡');
      }
      // 이 지역에 숨어 있던 것이 이제 모습을 드러냅니다
      const lurker = zonePosts(enemy.zoneIndex).find(p => p.opens);
      if (lurker && !State.meta.specialOpened.includes(lurker.id)) {
        pushLog('devour', `⟡ ${enemy.zoneName} 어딘가에서 숨어 있던 것이 눈을 떴다 ⟡`);
      }
    }

    if (enemy.final) {
      State.meta.cleared = true;
      State.meta.bestZone = ZONES.length;
      run.victory = true;
      endRun('모든 격을 넘어섰다');
      return run.lastResult;
    }

    // 길만 열어둡니다. 넘어갈지 더 머무를지는 본인이 정합니다 —
    // 준비 안 된 채로 다음 지역에 떨어지면 아무것도 못 하고 여정이 끝나니까.
    run.zoneCleared = true;
    run.lastResult.openedPath = true;
    pushLog('rank', `━ 길이 열렸다. 준비되면 다음 지역으로 ━`);
  } else {
    run.progress += 1;
  }

  checkEnergy();
  save();
  return run.lastResult;
}

// 결과 화면을 닫고 다시 갈림길로
function dismissResult() {
  if (State.run) State.run.lastResult = null;
}

// 다음 격으로 넘어간다. 에너지 ZONE_MOVE_COST 가 듭니다.
// 넘어가기 전까지는 이 지역에 머물며 얼마든지 더 사냥할 수 있습니다.
//
// 모자라면 넘어가지 못할 뿐, 여정이 끝나지는 않습니다 —
// 한 걸음(1)은 아직 남아 있을 수 있으니 이 지역에서 더 사냥하면 됩니다.
function moveToNextZone() {
  const run = State.run;
  if (run.over || run.encounter || !run.zoneCleared) return;
  if (run.zoneIndex + 1 >= ZONES.length) return;
  if (run.energy < RULES.ZONE_MOVE_COST) return;

  run.energy -= RULES.ZONE_MOVE_COST;
  run.zoneIndex += 1;
  run.progress = 0;
  run.zoneCleared = false;
  if (run.zoneIndex + 1 > State.meta.bestZone) State.meta.bestZone = run.zoneIndex + 1;

  const z = currentZone();
  const r = RANKS.find(x => x.n === z.rank);
  pushLog('rank', `━━ 제${r.n}격 · ${r.name}(${r.hanja}) — ${z.name}에 들어섰다 ━━`);
  pushLog('info', z.flavor);
  save();
}

// 처치하면 1~3개(기운이 붙으면 그 배수만큼)를 빼앗습니다.
// 이미 가진 것이 또 나오면 **자동으로 분해되어** 그 부위의 강화석이 됩니다 —
// 그래서 드롭이 죽지 않습니다. 다 모은 상대도 잡을 이유가 남습니다.
// **전리품 하나하나에 따로 확률을 굴립니다.**
// 그래서 한 번 잡아 같은 종류가 두 개 나오는 일은 없고, 빈손으로 끝나기도 합니다.
// 빈손이 있어야 행운에 투자할 이유가 생깁니다.
function rollDrops(enemyId, auraMult = 1) {
  const foe = getEnemy(enemyId);

  // 관측자는 검을 한 번 내주면 그걸로 할 일이 끝납니다. 그 뒤로는 경험치만.
  // (다른 히든은 특수장비를 계속 남깁니다 — 겹치면 분해됩니다)
  if (foe && foe.id === 'observer' && owns(DEVOURER_ID)) return [];

  const chance = dropChanceFor(foe, auraMult);
  const stoneMult = 1 + num(heroStats().stoneRate);   // 『세공사의 돋보기』 같은 유물
  const result = [];

  for (const it of dropTable(enemyId)) {
    if (Math.random() >= chance) continue;               // 이번엔 안 나왔다

    if (owns(it.id)) {
      // 이미 가진 것 — 분해해서 그 부위의 강화석으로.
      // 특수장비는 「특수장비 강화석」이 됩니다. 강화할 칸이 없으니 바꾸기로만 씁니다.
      const stones = Math.round(stoneYield(it) * stoneMult);
      State.meta.stones[it.slot] = stonesOf(it.slot) + stones;
      result.push({ item: it, isNew: false, stones });
      continue;
    }

    State.meta.owned[it.id] = 1;
    // NEW! 는 처음 얻은 것에만 켜집니다. 분해된 것은 이미 아는 물건입니다.
    markFresh(it);
    const worn = autoEquipIfBetter(it);
    result.push({ item: it, isNew: true, autoWorn: worn });
  }
  return result;
}

// ---------- 알아서 갈아끼우기 ----------
// 기본은 꺼져 있습니다. 장비마다 성격이 달라서 "가장 강한 것" 이라는 게
// 딱 떨어지지 않고, 그 고민이 이 게임의 재미이기 때문입니다.
//
// 다만 한 회차에 쉰 번 넘게 갈아끼우는 걸 손으로 다 하긴 고됩니다. 그래서
// **켜면** 새로 얻은 것이 지금 낀 것보다 나을 때만 조용히 바꿔줍니다.
// 판단 기준은 "지금 내 레벨의 적을 상대로 몇 턴 버티며 몇 턴 만에 눕히는가" —
// 승률과 같은 잣대라, 성격이 다른 물건끼리도 견줄 수 있습니다.
function gearScore() {
  const ref = enemyStats(State.run ? State.run.level : 1);
  const h = heroStats();
  const mine = expectedTurnDamage(h, ref);
  const theirs = Math.max(0.001, expectedTurnDamage(ref, h));
  return mine * (h.life / theirs);
}

function autoEquipIfBetter(item) {
  if (!State.meta.settings.autoEquip) return false;
  if (!State.run || !item || item.id === DEVOURER_ID) return false;   // 삼키는 검은 스스로 고르게 둡니다
  if (equippedSlotOf(item.id)) return false;

  // 특수장비는 열린 칸 넷 중 어디든 들어갈 수 있습니다 — 가장 나아지는 칸을 고릅니다
  const slots = item.slot === 'special'
    ? SPECIAL_SLOT_IDS.filter(isSlotOpen)
    : [item.slot];
  const before = gearScore();
  let best = null, bestScore = before;
  for (const slot of slots) {
    const cur = State.meta.equipped[slot];
    State.meta.equipped[slot] = item.id;
    const after = gearScore();
    State.meta.equipped[slot] = cur;    // 일단 되돌려 두고 비교만 합니다
    if (after > bestScore) { best = slot; bestScore = after; }
  }
  if (!best) return false;
  State.meta.equipped[best] = item.id;
  syncActiveSet();
  return true;
}

// 특수장비 칸이 새로 열렸을 때, 알아서 갈아끼우기를 켜두었다면 가진 것 중 나은 것으로 채웁니다
function fillSpecialSlots() {
  if (!State.meta.settings.autoEquip || !State.run) return;
  for (const it of itemsInSlot('special')) if (owns(it.id)) autoEquipIfBetter(it);
}

// ---------- 강화석 바꾸기 ----------
// from 의 강화석 spend 개를 내고 to 의 강화석을 STONE_EXCHANGE_RATE 만큼 받습니다 (지금은 2:1).
// from 은 열세 부위 또는 'special', to 는 열세 부위 중 하나입니다.
// 받을 몫이 나눠떨어지지 않으면 남는 만큼은 내지 않습니다 — 버려지는 강화석이 없게.
function exchangeStones(from, to, spend) {
  if (from === to || !SLOT_IDS.includes(to)) return null;
  if (from !== 'special' && !SLOT_IDS.includes(from)) return null;
  const gain = Math.floor(Math.min(num(spend), stonesOf(from)) * STONE_EXCHANGE_RATE);
  if (gain <= 0) return null;
  const paid = Math.ceil(gain / STONE_EXCHANGE_RATE);
  State.meta.stones[from] = stonesOf(from) - paid;
  State.meta.stones[to] = stonesOf(to) + gain;
  pushLog('info', `${SLOT_NAMES[from]} 강화석 ${fmt(paid)}개를 ${SLOT_NAMES[to]} 강화석 ${fmt(gain)}개로 바꿨다`);
  save();
  return { from, to, paid, gain };
}

// to 의 강화석을 gain 개 얻으려면 다른 강화석이 몇 개 드는가
function exchangeCost(gain) { return Math.ceil(Math.max(0, gain) / STONE_EXCHANGE_RATE); }

// ---------- NEW! 표시 ----------
// 새로 얻은 전리품은 **그 부위를 직접 열어볼 때까지** 표시가 남습니다.
// 전투 결과 화면을 스쳐 지나가도 놓치지 않게 하려는 장치입니다.
function markFresh(item) {
  const f = State.meta.fresh;
  if (!f[item.slot]) f[item.slot] = [];
  if (!f[item.slot].includes(item.id)) f[item.slot].push(item.id);
}

function freshCount(slot) { return (State.meta.fresh[slot] || []).length; }
function isFresh(itemId, slot) { return (State.meta.fresh[slot] || []).includes(itemId); }
function totalFresh() { return SLOT_IDS.concat(['special']).reduce((n, s) => n + freshCount(s), 0); }

// 그 부위를 열어봤으면 표시를 끕니다
function clearFresh(slot) {
  if (State.meta.fresh[slot] && State.meta.fresh[slot].length) {
    State.meta.fresh[slot] = [];
    save();
  }
}

// ---------- 행운 ----------
// 드롭 확률에 곱해지는 배수입니다.
//
// 레벨에서 저절로 따라오는 행운은 빼고 **내가 일부러 넣은 만큼**만 셉니다.
// 분배를 행운에 몰았거나 반지·목걸이·팔찌를 챙겨 끼웠을 때만 올라갑니다.
// 그래야 "이번 여정은 싸우러 가는 게 아니라 캐러 간다" 는 선택이 성립합니다.
// 행운 배수는 **찍은 포인트의 비율**만 봅니다.
//
// 두 번 헛짚고 나서 고른 기준입니다.
//   처음엔 "총 행운 − 레벨 기본 행운" 으로 쟀는데, 장비에 붙은 행운이 기본값을
//   수백 배로 압도해서 누가 뭘 찍든 상한에 붙었습니다. 다음엔 행운/민첩 비율로
//   바꿨는데, 그 비율이 레벨과 장비에 따라 0.29~1.45 사이를 오가서 "중립"
//   자리를 잡을 수가 없었습니다.
//
// 찍은 포인트의 비율은 레벨에도 장비에도 흔들리지 않습니다. 역할도 깨끗이
// 갈립니다 — **분배**가 배수를 올리고, **장비**가 전리품 확률(+%)을 올립니다.
//   한 점도 안 줌 ×1.0   ·   균등(1/5) ×1.4   ·   몰빵(6/10) ×2.2
function luckMult() {
  const sp = State.run ? State.run.spent : null;
  if (!sp) return 1;
  let total = 0;
  for (const k of STAT_KEYS) total += num(sp[k]);
  if (total <= 0) return 1;
  const share = num(sp.luck) / total;      // 0 = 한 점도 안 줌, 1 = 전부 행운
  return Math.min(RULES.LUCK_CAP, 1 + RULES.LUCK_POWER * share);
}

// 격이 높을수록 좀처럼 내주지 않습니다 — 단, 다시 만날 수 있는 상대만.
//
//   일반 화신 (몇 번이고 다시 만남)  ×0.93/격  → 제15격에서 ×0.36
//   정예·보스 (회차당 한 번뿐)       ×0.986/격 → 제15격에서 ×0.82
//
// 정예와 보스를 같은 비율로 깎았더니, 회차를 통째로 써서 도착한 자리에서
// 굴림 한 번에 빈손으로 돌아서는 일이 생겼습니다. 저기까지 가는 것 자체가
// 이미 대가라서, 그 위에 확률까지 깎으면 희소성이 아니라 벌이 됩니다.
// 여기에 초반 보너스(1 + EARLY/격)를 곱합니다. 격이 오르면 빠르게 사그라들어서,
// 제1격은 후하고 제15격은 인색한 곡선이 됩니다 (일반 화신 기준 68% → 8%).
function rankDropMult(rank, once) {
  const r = Math.max(1, rank || 1);
  const f = once ? RULES.RANK_DROP_FALLOFF_ONCE : RULES.RANK_DROP_FALLOFF;
  return Math.pow(f, r - 1) * (1 + RULES.RANK_DROP_EARLY / r);
}

// 낮은 격에서 경험치를 얹어줍니다. 격의 제곱으로 나누기 때문에
// 제1격 ×3.0, 제2격 ×1.5, 제3격 ×1.22 로 금방 사그라듭니다 —
// 배우는 구간만 빨리 지나가게 하고, 본편 길이는 건드리지 않으려는 모양입니다.
function rankXpMult(rank) {
  const r = Math.max(1, rank || 1);
  return 1 + RULES.RANK_XP_EARLY / (r * r);
}

// 이 적에게서 전리품 하나가 떨어질 확률
//   기본(등급) × 격에 따른 인색함 × 행운 배수 × 장비의 전리품 확률 × 기운
function dropChanceFor(foe, auraMult = 1, stats = null) {
  const base = KINDS[foe ? foe.kind : 'normal'].dropChance;
  const h = stats || heroStats();
  const rank = foe && foe.rank ? foe.rank.n : 1;
  const once = !!(foe && foe.once);   // 정예·히든·보스 — 회차당 한 번뿐인 상대
  return Math.min(RULES.DROP_CAP,
    base * rankDropMult(rank, once) * luckMult() * (1 + num(h.findRate)) * auraMult);
}

// 전리품을 얼마나 잘 캐는 몸인가 — 세트끼리 비교할 때 씁니다
function findPower(stats = null) {
  const h = stats || heroStats();
  return luckMult() * (1 + num(h.findRate));
}

// 장비가 얹어주는 경험치 배수.
// 전리품 확률과 달리 행운 같은 걸 타지 않고, 오직 착용한 『성장』 장비만 봅니다.
function xpGearMult(stats = null) {
  const h = stats || heroStats();
  return 1 + num(h.xpRate);
}

// ---------- 전리품 ----------
// 특수장비는 어느 칸에 낄지(slot)를 받습니다. 다른 특수장비 칸에 끼워져 있었다면 그쪽에서 빼서 옮깁니다.
function equip(itemId, slot) {
  const item = getItem(itemId);
  if (!item || !owns(itemId)) return;
  const to = item.slot === 'special' ? slot : item.slot;
  if (!to || !isSlotOpen(to) || (item.slot === 'special') !== isSpecialSlot(to)) return;
  const from = equippedSlotOf(itemId);
  if (from && from !== to) State.meta.equipped[from] = null;
  State.meta.equipped[to] = itemId;
  syncActiveSet();
  save();
}

function unequip(slot) {
  State.meta.equipped[slot] = null;
  syncActiveSet();
  save();
}

// ---------- 장비 세트 ----------
// 열두 부위를 매번 손으로 갈아끼우는 건 고역입니다.
// 싸우러 갈 때의 차림과 전리품을 캐러 갈 때의 차림을 따로 입혀두고 갈아입습니다 —
// Inflation RPG 와 Resolute Hero 에도 있는 기능입니다.
//
// **저장하고 꺼내 쓰는 게 아닙니다.** 세 벌을 각각 입혀두고 그중 하나를 입고
// 다니는 것에 가깝습니다. 그래서 「저장」 버튼이 없습니다 —
// 지금 입은 세트를 고치면 그 세트가 곧바로 그렇게 바뀝니다.
//
//   meta.activeSet  지금 입고 있는 세트 번호
//   meta.equipped   지금 몸에 걸친 것. 늘 sets[activeSet] 과 같습니다.
//   meta.sets[n]    n번 세트에 입혀둔 것

// 지금 입은 것을 현재 세트에 그대로 새겨둡니다.
// equip/unequip 뒤에 반드시 불러야 둘이 어긋나지 않습니다.
function syncActiveSet() {
  const n = State.meta.activeSet || 0;
  State.meta.sets[n] = { ...State.meta.equipped };
}

// 다른 세트로 갈아입습니다.
function switchSet(n) {
  if (n === State.meta.activeSet) return;
  syncActiveSet();                       // 입고 있던 것을 먼저 새겨두고
  State.meta.activeSet = n;
  const s = State.meta.sets[n] || {};
  for (const slot of ALL_SLOT_IDS) {
    const id = s[slot];
    // 그 사이에 초기화했거나 없는 물건이면 그냥 비웁니다
    State.meta.equipped[slot] = owns(id) ? id : null;
  }
  save();
}
const SET_COUNT = 3;

// 그 세트에 몇 부위가 채워져 있는가. 비어 있으면 0.
function setFilled(n) {
  const s = (n === State.meta.activeSet) ? State.meta.equipped : State.meta.sets[n];
  if (!s) return 0;
  return ALL_SLOT_IDS.filter(k => owns(s[k]) && isSlotOpen(k)).length;
}

// 지금 입고 있는 세트인가
function isSetActive(n) {
  return n === (State.meta.activeSet || 0);
}

// 각 슬롯에서 가장 좋은 것을 자동으로 착용합니다.
// 자동 착용은 일부러 없앴습니다.
// 장비마다 성격이 달라진 뒤로는 "가장 강한 것" 이라는 게 정의되지 않습니다 —
// 크리 몰빵 무기와 방어형 무기 중 뭐가 나은지는 스탯을 어떻게 찍었느냐에 달렸으니까요.
// 그 고민이 이 게임의 재미라서, 대신 골라주지 않습니다.

// ---------- 로그 ----------
function pushLog(kind, text) {
  State.log.push({ kind, text });
  if (State.log.length > 200) State.log.shift();
}

// ---------- 유틸 ----------

// 한글 조사 자동 선택. "그람을", "아자토스를" 처럼 받침에 맞춰 골라줍니다.
//   한글 음절 코드 = 0xAC00 + (초성*21 + 중성)*28 + 종성
//   → (코드 - 0xAC00) % 28 이 0 이 아니면 받침이 있다는 뜻.
function josa(word, withJong, withoutJong) {
  const c = word.charCodeAt(word.length - 1);
  if (c < 0xAC00 || c > 0xD7A3) return withoutJong; // 한글이 아니면 기본값
  return ((c - 0xAC00) % 28) !== 0 ? withJong : withoutJong;
}

// 큰 숫자를 읽기 쉽게. 레벨이 1,000만까지 가고 경험치는 그보다 훨씬 커집니다.
// 레벨 100조의 누적 경험치가 10²⁸ 쯤이라 Oc(10²⁷)까지 둡니다.
const UNITS = [[1e30, 'No'], [1e27, 'Oc'], [1e24, 'Sp'], [1e21, 'Sx'], [1e18, 'Qi'],
               [1e15, 'Qa'], [1e12, 'T'], [1e9, 'B'], [1e6, 'M'], [1e3, 'K']];

function fmt(n) {
  if (n === null || n === undefined || !isFinite(n)) return '-';
  const abs = Math.abs(n);
  if (abs < 10000) return Math.round(n).toLocaleString('ko-KR');
  for (const [v, s] of UNITS) if (abs >= v) return (n / v).toFixed(2) + s;
  return Math.round(n).toLocaleString('ko-KR');
}

// 레벨은 자릿수를 그대로 보여줍니다 — 1,000만은 눈으로 봐야 맛이 나니까.
function fmtLevel(n) {
  if (!isFinite(n)) return '-';
  return Math.round(n).toLocaleString('ko-KR');
}

</script>
<script>
// ============================================================
//  ui.js  —  화면 그리기와 버튼 연결
//  게임 규칙은 여기 없습니다. game.js 의 함수를 부르기만 합니다.
// ============================================================

const $ = id => document.getElementById(id);

// ---------- 전체 다시 그리기 ----------
function render() {
  renderRecords();
  renderHero();
  renderJourney();
  renderGear();
  renderLog();
  renderSettings();
  renderOverlay();
  renderTabBadges();
  syncMusic();
}

// ---------- 소리 ----------
// 지금 마주하거나 싸우고 있는 상대 — 결과 화면이나 갈림길이면 null
function facingFoe() {
  const run = State.run;
  if (!run) return null;
  if (battle && battle.r === run.lastResult) return run.lastResult.enemy;
  if (!run.lastResult && !run.over && run.encounter) return getEnemy(run.encounter);
  return null;
}

// 배경음 — 초기 화면 · 여정 · 보스(히든 포함)와 마주하거나 싸우는 동안. 여정이 끝나면 멈춥니다.
function syncMusic() {
  if (!$('title').classList.contains('hidden')) { Sound.music('title'); return; }
  const run = State.run;
  if (!run) return;
  if (run.over && !run.lastResult) { Sound.music(null); return; }
  const foe = facingFoe();
  Sound.music(foe && (foe.kind === 'boss' || foe.kind === 'hidden') ? 'boss' : 'field');
}

// 상대가 나타났을 때 — 정예는 세 음, 보스 · 히든은 무겁게. 기운을 둘렀으면 반짝임을 덧붙입니다
function soundEncounter() {
  const run = State.run;
  if (!run || !run.encounter) return;
  const kind = getEnemy(run.encounter).kind;
  Sound.play(kind === 'normal' ? 'encounter' : kind === 'elite' ? 'encounterElite' : 'encounterBoss');
  if (run.aura) Sound.play('aura', { delay: 0.2 });
}

// 누르는 소리. 저마다 소리가 따로 있는 버튼은 뺍니다 (겹치면 지저분합니다)
const OWN_SOUND = '#travelBtn, #engageBtn, #nextZoneBtn, #retreatBtn, #commitBtn, '
  + '[data-post], [data-enhance], [data-equip], [data-unequip], [data-swap], [data-setpick], [data-jset]';
function wireClickSound() {
  document.addEventListener('click', ev => {
    const b = ev.target.closest('button');
    if (!b || b.disabled || b.matches(OWN_SOUND)) return;
    Sound.play('tick');
  }, true);
}

// ---------- 설정 ----------
// 화면에 남긴 건 포인트 자동 분배 하나입니다.
// 알아서 갈아끼우기 · 결과 자동 넘기기는 뺐습니다 (꺼진 채로 고정 — game.js 의 FIXED_SETTINGS).
// 소리 둘은 기기에 저장합니다(device) — 저장 칸을 바꿔도, 초기 화면에서도 그대로입니다.
const SETTINGS_UI = [
  { group: '반복 줄이기' },
  { id: 'autoAlloc', type: 'toggle', name: '포인트 자동 분배', meta: true,
    desc: '레벨이 오를 때마다 정해둔 비율대로 알아서 찍습니다.' },

  { group: '소리' },
  { id: 'sfx', type: 'toggle', name: '효과음', device: true,
    desc: '전투 · 전리품 · 강화 같은 소리.' },
  { id: 'bgm', type: 'toggle', name: '배경음', device: true,
    desc: '초기 화면 · 여정 · 보스전 음악.' }
];

// 나중에 관리자용 설정으로 돌아올 것들 — 지금은 그리지 않고 기본값으로 고정합니다.
// 관리자 화면을 만들 때 이 목록을 renderSettings 와 같은 방식으로 그리면 됩니다.
const ADMIN_SETTINGS_UI = [
  { group: '보기' },
  { id: 'battleSpeed', type: 'choice', name: '전투 보기',
    desc: '싸우는 과정을 체력 바와 글로 보여줍니다.',
    options: [[0, '끔'], [1, '빠르게'], [2, '보통']] },
  { id: 'dropFx', type: 'toggle', name: '전리품 등장 연출',
    desc: '빼앗은 것이 잠깐 뒤에 하나씩 튀어나옵니다.' },
  { id: 'showLocked', type: 'toggle', name: '못 얻은 것 펼쳐두기',
    desc: '부위 창을 열 때 아직 못 얻은 ???? 도 처음부터 보여줍니다.' }
];

function settingValue(s) {
  if (s.device) return Sound.get(s.id);
  return s.meta ? State.meta[s.id] : State.meta.settings[s.id];
}

function renderSettings() {
  const el = $('settings');
  if (!el) return;
  el.innerHTML = SETTINGS_UI.map(s => {
    if (s.group) return `<div class="set-group">${s.group}</div>`;
    const v = settingValue(s);
    const control = s.type === 'toggle'
      ? `<button class="btn tiny set-toggle ${v ? 'on' : ''}" data-set="${s.id}">${v ? '켜짐' : '꺼짐'}</button>`
      : `<div class="set-choice">${s.options.map(([val, label]) =>
          `<button class="btn tiny ${v === val ? 'on' : ''}" data-set="${s.id}" data-val="${val}">${label}</button>`).join('')}</div>`;
    // 화면에는 이름만 둡니다. 설명(desc)은 마우스를 올렸을 때만 뜹니다.
    return `
      <div class="set-row" title="${s.desc}">
        <div class="set-body">
          <span class="set-name">${s.name}</span>
        </div>
        ${control}
      </div>`;
  }).join('') + `
    <div class="set-group">저장</div>
    <div class="set-row">
      <div class="set-body">
        <span class="set-name">이 저장을 지웁니다</span>
        <span class="set-desc">되돌릴 수 없다</span>
      </div>
      <button class="btn tiny danger" id="wipeBtn">초기화</button>
    </div>`;

  for (const b of el.querySelectorAll('[data-set]')) {
    b.addEventListener('click', () => {
      const s = SETTINGS_UI.find(x => x.id === b.dataset.set);
      if (s.type === 'choice') setSetting(s, Number(b.dataset.val));
      else setSetting(s, !settingValue(s));
    });
  }
  const wipe = $('wipeBtn');
  if (wipe) wipe.addEventListener('click', confirmWipe);
}

function setSetting(s, value) {
  if (s.device) Sound.set(s.id, value);
  else if (s.meta) State.meta[s.id] = value;
  else State.meta.settings[s.id] = value;
  if (s.id === 'showLocked') showLocked = value;
  save();
  render();
}

// 지우기는 한 번 더 묻습니다 — 되돌릴 수 없으니까요.
let wipeArmed = false;
function confirmWipe() {
  const b = $('wipeBtn');
  if (!wipeArmed) {
    wipeArmed = true;
    b.textContent = '정말 지웁니다';
    b.classList.add('armed');
    setTimeout(() => {
      if (!wipeArmed) return;
      wipeArmed = false;
      if ($('wipeBtn')) { $('wipeBtn').textContent = '초기화'; $('wipeBtn').classList.remove('armed'); }
    }, 4000);
    return;
  }
  wipeArmed = false;
  try { localStorage.removeItem(saveKey(currentSlot)); } catch (e) {}
  location.reload();
}

// ---------- 최고 기록 ----------
function renderRecords() {
  const m = State.meta;
  const deepest = ZONES[Math.min(m.bestZone, ZONES.length) - 1];
  const bm = bossXpMult();
  $('records').innerHTML = `
    ${record('회차', m.runCount)}
    ${record('최고 레벨', fmtLevel(m.bestLevel))}
    ${record('최심 도달', `${m.bestZone}지역 · ${deepest.name}`)}
    ${record('빼앗은 격', `${m.bossesBeaten.length}/${ZONES.length}`, bm > 1.01 ? 'boost' : '')}
    ${bm > 1.01 ? record('영구 경험치', `×${bm.toFixed(1)}`, 'boost') : ''}
    ${record('전리품', `${ownedIds().length}/${ITEMS.length}`)}
    ${record('도감 완성', `${completedRanks()}/${RANKS.length}`, completedRanks() ? 'boost' : '')}
    ${m.cleared ? record('', '클리어', 'cleared') : ''}
  `;
}

function record(label, value, cls = '') {
  return `<div class="record ${cls}">
    <span class="record-label">${label}</span>
    <span class="record-value">${value}</span>
  </div>`;
}

// ---------- 나 ----------
function renderHero() {
  const run = State.run;
  const base = heroBaseStats(run.level);
  const total = heroStats();

  $('heroLevel').textContent = 'Lv.' + fmtLevel(run.level);
  // 회차는 바로 위 기록 칸에 있습니다 — 여기 또 적으면 한 패널에 같은 숫자가 두 번 찍힙니다

  // 내 격 — 레벨이 올라가면 격이 바뀝니다
  const rank = rankOf(run.level);
  const next = RANKS.find(r => r.minLevel > run.level);
  $('heroRank').innerHTML = `
    <span class="rank-chip r${rank.n}">제${rank.n}격 · ${rank.name}</span>
    ${next ? `<span class="rank-next">제${next.n}격까지 Lv.${fmtLevel(next.minLevel - run.level)}</span>` : ''}
  `;

  // 경험치 바
  const need = xpToNext(run.level);
  $('xpText').textContent = `${fmt(run.xp)} / ${fmt(need)}`;
  $('xpFill').style.width = Math.min(100, (run.xp / need) * 100) + '%';

  // 에너지
  const maxPips = Math.max(RULES.START_ENERGY, run.energy);
  $('energyText').textContent = `${run.energy} / ${RULES.START_ENERGY}`;
  let pips = '';
  for (let i = 0; i < maxPips; i++) {
    pips += `<div class="pip ${i < run.energy ? '' : 'spent'}"></div>`;
  }
  $('energyPips').innerHTML = pips;

  // 스탯 — 레벨에서 온 기본값 위에 분배와 전리품이 얼마나 얹혔는지
  $('heroStats').innerHTML = `
    ${statRow('생명', total.life, total.life - base.life)}
    ${statRow('공격력', total.damage, total.damage - base.damage)}
    ${statRow('방어력', total.defense, total.defense - base.defense)}
    ${statRow('민첩', total.dex, total.dex - base.dex)}
    ${statRow('행운', total.luck, total.luck - base.luck)}
    ${statRow('크리티컬', `${Math.round(critChance(total.dex, total.luck, total.critRate) * 100)}% · ×${critDamage(total.dex).toFixed(1)}`
        + (total.critRate > 0 ? ` <span class="stat-note">(장비 +${pctTxt(total.critRate)})</span>` : ''), 0)}
    ${completedRanks() ? statRow('도감 완성', `${completedRanks()}격 · 핵심 스탯 +${Math.round(completedRanks() * COLLECTION_BONUS * 100)}%`, 0) : ''}
    <li class="stat-head">특수 능력치</li>
    ${['doubleHit', 'pierce', 'lifesteal', 'block', 'reflect', 'regen', 'survive', 'harmTouch', 'doubleTurn']
      .map(k => specialRow(k, total[k])).join('')}
    <li class="stat-head">얻는 것</li>
    ${statRow('전리품 확률', total.findRate > 0
        ? `×${findPower(total).toFixed(2)} <span class="stat-note">(행운 ×${luckMult().toFixed(2)} · 장비 +${Math.round(total.findRate * 100)}%)</span>`
        : `×${luckMult().toFixed(2)}`, 0)}
    ${statRow('경험치', total.xpRate > 0
        ? `×${xpGearMult(total).toFixed(2)} <span class="stat-note">(장비 +${Math.round(total.xpRate * 100)}%)</span>`
        : '×1.00', 0)}
    ${statRow('강화석', `+${Math.round(total.stoneRate * 100)}%`, 0)}
    ${statRow('꺾은 것', run.kills, 0)}
  `;

  // 안 찍은 포인트가 있으면 버튼에 점을 찍습니다 — 창을 안 열어도 보이게.
  const pip = $('allocPip');
  if (pip) pip.classList.toggle('on', run.unspent > 0);
  const ob = $('openAllocBtn');
  if (ob) ob.classList.toggle('ready', run.unspent > 0);

  renderAlloc(run);
}

// ---------- 스탯 분배 ----------
function renderAlloc(run) {
  const w = State.meta.weights;
  const sum = STAT_KEYS.reduce((n, k) => n + (w[k] || 0), 0);
  const alloc = allocatedStats();
  const auto = State.meta.autoAlloc;

  $('pointCount').textContent = run.unspent > 0 ? `${fmt(run.unspent)}P 남음` : '';

  // 행 전체가 버튼입니다. 한 번 누르면 그 스탯이 한 칸 차지하고,
  // 비율은 칸 수대로 알아서 다시 나뉩니다.
  // 왼쪽 굵은 막대 = 이미 찍힌 것, 오른쪽 연한 막대 = 이번에 들어갈 몫.
  const spentSum = STAT_KEYS.reduce((n, k) => n + run.spent[k], 0);

  $('alloc').innerHTML = `
    <div class="alloc-top">
      <div class="alloc-pool ${run.unspent > 0 ? 'ready' : ''}">
        <span class="pool-k">안 찍은 포인트</span>
        <span class="pool-v">${fmt(run.unspent)}</span>
      </div>
      <button class="btn tiny auto-toggle ${auto ? 'on' : ''}" id="autoAllocBtn">
        자동 ${auto ? '켜짐' : '꺼짐'}
      </button>
    </div>
  ` + STAT_INFO.map(s => {
    const n = w[s.id] || 0;
    const share = sum > 0 ? Math.round(n / sum * 100) : 0;
    const held = spentSum > 0 ? run.spent[s.id] / spentSum * 100 : 0;
    const incoming = sum > 0 ? Math.floor(run.unspent * n / sum) : 0;
    return `
      <button class="alloc-row ${n ? 'has' : ''}" data-add="${s.id}">
        <div class="alloc-head">
          <span class="alloc-name">${s.name}</span>
          <span class="alloc-slots">${n ? `${n}칸 · ${share}%` : ''}</span>
          <span class="alloc-share">+${fmt(alloc[s.id])}</span>
        </div>
        <div class="alloc-bar">
          <div class="alloc-fill" style="width:${held}%"></div>
          <div class="alloc-next" style="width:${share}%"></div>
        </div>
        <div class="alloc-foot">
          ${s.desc ? `<span class="alloc-desc">${s.desc}</span>` : ''}
          ${incoming > 0 ? `<span class="alloc-incoming">이번에 ${fmt(incoming)}P</span>` : ''}
          ${n ? `<span class="alloc-sub" data-sub="${s.id}">−</span>` : ''}
        </div>
      </button>`;
  }).join('') + `
    ${sum === 0
      ? '<p class="hint alloc-empty">눌러서 비율을 정한다</p>'
      : ''}
    <button class="btn primary alloc-commit" id="commitBtn"
      ${run.unspent > 0 && sum > 0 ? '' : 'disabled'}>
      ${run.unspent > 0 ? `${fmt(run.unspent)}P 찍는다` : '찍을 포인트 없음'}
    </button>
    <p class="hint alloc-note">찍은 포인트는 되돌릴 수 없다</p>
    <div class="alloc-presets">
      <button class="btn tiny" data-preset="1,1,1,1,1">균형</button>
      <button class="btn tiny" data-preset="1,4,1,2,0">공격</button>
      <button class="btn tiny" data-preset="4,1,3,1,0">방어</button>
      <button class="btn tiny" data-preset="1,2,1,5,1">민첩</button>
      <button class="btn tiny" data-preset="1,1,1,1,4">행운</button>
      <button class="btn tiny" data-preset="0,0,0,0,0">비움</button>
    </div>`;

  for (const b of document.querySelectorAll('[data-add]')) {
    b.addEventListener('click', ev => {
      // 행 안의 − 를 눌렀으면 더하지 말고 빼야 합니다
      const minus = ev.target.closest('[data-sub]');
      if (minus) { addWeight(minus.dataset.sub, -1); render(); return; }
      addWeight(b.dataset.add, 1);
      render();
    });
  }
  for (const b of document.querySelectorAll('[data-preset]')) {
    b.addEventListener('click', () => {
      setWeights(...b.dataset.preset.split(',').map(Number));
      render();
    });
  }
  $('commitBtn').addEventListener('click', () => { commitPoints(); Sound.play('commit'); render(); });
  $('autoAllocBtn').addEventListener('click', () => { setAutoAlloc(!State.meta.autoAlloc); render(); });

  const ob = $('openAllocBtn');
  if (ob && !ob.dataset.wired) { ob.dataset.wired = '1'; ob.addEventListener('click', openAllocModal); }
  for (const b of document.querySelectorAll('[data-closealloc]')) {
    if (b.dataset.wired) continue;
    b.dataset.wired = '1';
    b.addEventListener('click', closeAllocModal);
  }
}

// value 가 문자열이면 그대로 씁니다 (크리티컬처럼 "27% · ×2.5" 같은 값)
// 0.078 → "7.8%"
function pctTxt(v) { return `${(num(v) * 100).toFixed(1)}%`; }

// 특수 능력치 한 줄 — 지금 값과 상한. 상한에 닿았으면 눈에 띄게.
// 0 이어도 보여줍니다 — 무엇을 더 모을 수 있는지가 보여야 하니까요.
function specialRow(key, value) {
  const info = SPECIAL_INFO[key];
  const v = num(value);
  const capped = v >= info.cap - 1e-9;
  return `<li class="${v > 0 ? '' : 'zero'} ${capped ? 'capped' : ''}" title="${info.desc}">
    <span class="stat-name">${info.name}</span>
    <span class="stat-value">${pctTxt(v)}<span class="stat-cap">${capped ? '상한' : `/ ${Math.round(info.cap * 100)}%`}</span></span>
  </li>`;
}

function statRow(name, value, bonus) {
  const bonusText = bonus > 0 ? `<span class="stat-bonus">+${fmt(bonus)}</span>` : '';
  const shown = typeof value === 'string' ? value : fmt(value);
  return `<li>
    <span class="stat-name">${name}</span>
    <span class="stat-value">${shown}${bonusText}</span>
  </li>`;
}

// ---------- 여정 ----------
function renderJourney() {
  const run = State.run;
  const zone = ZONES[run.zoneIndex];
  const rank = RANKS.find(r => r.n === zone.rank);
  const boss = zoneBoss(run.zoneIndex);
  const hero = heroStats();

  // 폰에서는 탭을 옮기면 「나」 화면이 안 보이므로, 에너지는 여기에도 둡니다.
  const max = startEnergy();
  const low = run.energy <= 5;

  // 창 셋 — 지역 · 에너지와 차림 · 무대. 창 사이로 맨 뒤의 지도가 보입니다.
  // 지역 소개글(zone.flavor)은 data.js 에만 남겨두고 화면에는 안 씁니다 — 이름이면 충분합니다.
  let html = `
    <div class="frame zone-card">
      <div class="zone-head">
        <span class="rank-chip r${rank.n}">제${rank.n}격 · ${rank.name}<span class="hanja">${rank.hanja}</span></span>
        <span class="zone-name">${zone.name}</span>
        <button class="zone-count" id="rosterBtn" title="이 지역에 있는 것">
          <span class="zc-k">도감</span>${run.zoneIndex + 1} / ${ZONES.length}
        </button>
      </div>
    </div>

    <div class="frame meter ${low ? 'low' : ''}">
      <div class="journey-energy ${low ? 'low' : ''}">
        <span class="je-k">에너지</span>
        <span class="je-v">${run.energy}<span class="je-max">/${max}</span></span>
        <span class="je-lv"><span class="lv-k">Lv.</span>${fmtLevel(run.level)}</span>
      </div>
      ${journeySets()}
    </div>
  `;

  // ----- 무대: 결과 · 조우 · 갈림길 중 하나 -----
  // 정예 · 보스 · 히든과 마주하거나 싸우는 동안은 무대 창의 테두리가 그 색이 됩니다
  const facing = facingFoe();
  html += `<div class="frame stage ${facing && facing.kind !== 'normal' ? `k-${facing.kind}` : ''}">`;
  // 결과 화면이 먼저입니다. 마지막 에너지로 잡은 전리품도 보고 나서 끝나야 하니까요.
  // (여정이 끝났어도 결과를 닫기 전까지는 종료 화면을 띄우지 않습니다 — renderOverlay 참고)
  if (battle && battle.r === run.lastResult) {
    html += battleCard(battle);
  } else if (run.lastResult) {
    html += resultCard(run.lastResult, run);
    resultSounds(run.lastResult, run);
  } else if (run.over) {
    html += `<p class="stage-msg">여정이 끝났다.</p>`;
  } else if (run.encounter) {
    html += encounterCard(getEnemy(run.encounter), run.onBoss, hero, run.aura);
  } else {
    html += crossroads(boss, hero, run);
  }
  html += `</div>`;

  $('journey').innerHTML = html;
  renderRoster();
  wireJourney();
  if (battle) { paintBattle(); return; }   // 전투가 끝나야 전리품이 튀어나오고 자동 넘기기가 돕니다
  revealDrops();
  scheduleAutoContinue();
}

// ---------- 이 지역에 있는 것 (도감) ----------
// 예전엔 여정 맨 아래에 길게 깔려 있어서, 누가 나오는지 보려면 스크롤을 한참
// 내려야 했습니다. 지역 이름 옆의 「1 / 11」 을 눌러 창으로 띄웁니다.
// 지금 지역만 볼 것인가, 열한 격 전부를 볼 것인가
let rosterAll = false;

function rosterRow(foe, hero, sims) {
  const chance = winChance(hero, foe, sims);
  const down = foe.once && isDowned(foe.id);
  const seen = isSeen(foe.id);
  return `
    <div class="roster-item ${foe.kind} ${down ? 'down' : ''} ${seen ? '' : 'unseen'}">
      <span class="r-icon">${seen ? foe.icon : '·'}</span>
      <span class="r-name">
        ${foe.kind !== 'normal' ? `<span class="grade-tag ${foe.kind}">${KINDS[foe.kind].name}</span>` : ''}
        ${seen ? foe.name : '???'}<span class="lv">Lv.${fmtLevel(foe.level)}</span>
      </span>
      ${rosterDrops(foe)}
      <span class="r-chance ${down ? '' : winFeelClass(chance)}">${down ? '꺾음' : winFeel(chance)}</span>
    </div>`;
}

function renderRoster() {
  const el = $('roster');
  if (!el) return;
  const run = State.run;
  const hero = heroStats();
  const title = $('rosterTitle');
  const sub = $('rosterSub');
  const btn = $('rosterAllBtn');
  if (btn) {
    btn.textContent = rosterAll ? '이 지역' : '전체 도감';
    btn.classList.toggle('on', rosterAll);
  }

  if (!rosterAll) {
    const zone = ZONES[run.zoneIndex];
    const rank = RANKS.find(r => r.n === zone.rank);
    if (title) title.textContent = zone.name;
    const col = rankCollection(rank.n);
    if (sub) sub.textContent = `제${rank.n}격 · ${rank.name} · 전리품 ${col.have}/${col.total}${col.have >= col.total ? ' · 완성' : ''}`;
    el.innerHTML = zoneRoster(run.zoneIndex).map(f => rosterRow(f, hero)).join('');
    return;
  }

  // 전체 — 백서른 마리를 격마다 묶어서 보여줍니다.
  // 승률 계산을 줄여 잡습니다(40판). 전부 제대로 돌리면 2만 판이 넘습니다.
  const seenCount = ENEMIES.filter(f => isSeen(f.id)).length;
  if (title) title.textContent = '전체 도감';
  if (sub) sub.textContent = `${seenCount}/${ENEMIES.length} 마주침`;

  el.innerHTML = ZONES.map((zone, zi) => {
    const rank = RANKS.find(r => r.n === zone.rank);
    const list = zoneRoster(zi);
    const got = list.filter(f => isSeen(f.id)).length;
    const col = rankCollection(rank.n);
    const done = col.have >= col.total;
    return `
      <div class="roster-zone ${zi === run.zoneIndex ? 'here' : ''}">
        <span class="rank-chip r${rank.n}">제${rank.n}격 · ${rank.name}</span>
        <span class="rz-name">${zone.name}</span>
        <span class="rz-col ${done ? 'done' : ''}" title="이 격의 전리품을 다 모으면 핵심 스탯 +${Math.round(COLLECTION_BONUS * 100)}%">${done ? '완성' : `전리품 ${col.have}/${col.total}`}</span>
        <span class="rz-count">${got}/${list.length}</span>
      </div>
      ${list.map(f => rosterRow(f, hero, 40)).join('')}`;
  }).join('');
}

// 도감 줄에 끼워 넣는 전리품 칩.
// 이름은 뺐습니다 — 한 줄에 셋씩 들어가야 해서 자리가 없고,
// **뭘 아직 못 얻었는지**만 보면 되는 자리라 그림과 부위면 충분합니다.
function rosterDrops(foe) {
  const table = dropTable(foe.id);
  if (!table.length) return '<span class="r-drops"></span>';
  return `<span class="r-drops">${table.map(it => {
    const have = owns(it.id);
    return `<span class="rd ${have ? 'have' : 'miss'}" title="${SLOT_NAMES[it.slot]} · ${have ? it.name : '아직 못 얻음'}">
              <span class="rd-ic">${have ? it.fromIcon : '?'}</span>
              <span class="rd-k">${SLOT_NAMES[it.slot]}</span>
            </span>`;
  }).join('')}</span>`;
}

function openRosterModal() {
  renderRoster();
  const m = $('rosterModal');
  if (m) m.classList.remove('hidden');
}
function closeRosterModal() {
  const m = $('rosterModal');
  if (m) m.classList.add('hidden');
}
function isRosterModalOpen() {
  const m = $('rosterModal');
  return !!m && !m.classList.contains('hidden');
}

// ---------- 전리품 등장 ----------
// 0.2초 뒤부터 하나씩 튀어나옵니다.
// 결과 화면이 그려지는 순간 같이 떠 있으면 그냥 글자 한 줄인데,
// 한 박자 늦게 나오면 "떨어졌다" 가 됩니다. 그 한 박자를 위한 장치입니다.
const DROP_DELAY = 200;    // 첫 전리품까지
const DROP_STEP  = 140;    // 그다음부터 하나씩

let dropTimers = [];
function revealDrops() {
  for (const t of dropTimers) clearTimeout(t);
  dropTimers = [];
  const veiled = document.querySelectorAll('.res-drop.veiled');
  veiled.forEach((el, i) => {
    dropTimers.push(setTimeout(() => {
      el.classList.remove('veiled');
      el.classList.add('pop');
      // 새 것은 반짝, 이미 가진 것(분해)은 짤랑
      Sound.play(el.classList.contains('is-new') ? 'drop' : 'stone');
    }, DROP_DELAY + i * DROP_STEP));
  });
}

// ---------- 결과 자동 넘기기 ----------
// 시뮬에서 전투 2339번 중 패배는 71번(3%)뿐이었습니다. 나머지는 결과를 보고
// "계속한다" 만 누르고 지나갑니다. 그 반복을 덜어주되,
// **진 판은 절대 자동으로 넘기지 않습니다** — 그때는 멈춰서 봐야 하니까요.
let autoContinueTimer = null;
function scheduleAutoContinue() {
  if (autoContinueTimer) { clearTimeout(autoContinueTimer); autoContinueTimer = null; }
  const ms = State.meta.settings.autoContinue;
  const r = State.run && State.run.lastResult;
  if (!ms || !r || !r.win || State.run.over) return;

  // 전리품이 다 나온 뒤에 넘겨야 뭘 얻었는지 보입니다
  const shown = (r.drops && r.drops.length && State.meta.settings.dropFx)
    ? DROP_DELAY + (r.drops.length - 1) * DROP_STEP
    : 0;
  autoContinueTimer = setTimeout(() => {
    autoContinueTimer = null;
    if (!State.run || !State.run.lastResult || !State.run.lastResult.win) return;
    dismissResult();
    render();
  }, ms + shown);
}

// ============================================================
//  전투 화면 — 싸우는 과정을 한 방씩 다시 틀어줍니다
// ============================================================
// 승패와 전리품은 「맞선다」를 누르는 순간 이미 정해져 있습니다 (engage).
// 여기서는 그 전투의 기록(lastResult.replay)을 보고 체력 바와 글로 다시 보여줄 뿐입니다.
// 나중에 그림과 효과가 들어올 자리입니다.
//
// 한 줄마다 화면 전체를 다시 그리지 않습니다 — 도감까지 다시 그리면 승률을 수백 번 다시 잽니다.
// 체력 바와 기록 줄만 바꿉니다.
// 건너뛰기는 없습니다 — 나중에 상대와 내 그림, 효과 연출이 들어올 자리라 끝까지 봅니다.
let battle = null;                       // { r: 그 결과, i: 지금까지 보여준 줄 수, step: 줄 간격(ms), timer }
const BATTLE_PACE = { 1: 90, 2: 260 };   // 빠르게 · 보통 — 한 줄에 몇 ms
const BATTLE_MAX_MS = 6000;              // 긴 전투도 이 안에 끝나게 줄 간격을 줄입니다
const BATTLE_LINES = 7;                  // 기록은 최근 일곱 줄만

function startBattle(r) {
  stopBattle();
  const speed = State.meta.settings.battleSpeed;
  const log = r && r.replay && r.replay.log;
  if (!speed || !log || !log.length) return;
  const step = Math.max(30, Math.min(BATTLE_PACE[speed] || 260, BATTLE_MAX_MS / log.length));
  battle = { r, i: 0, step };
  battle.timer = setTimeout(tickBattle, step);
}

function stopBattle() {
  if (battle && battle.timer) clearTimeout(battle.timer);
  battle = null;
}

// 다 보여줬으면 결과 화면으로
function finishBattle() { stopBattle(); render(); }

function tickBattle() {
  if (!battle) return;
  const n = battle.r.replay.log.length;
  battle.i = Math.min(n, battle.i + 1);
  paintBattle();
  // 방금 보여준 줄의 소리. 마지막 줄 뒤에는 승패를 알리는 소리
  const s = battleSound(battle.r.replay.log[battle.i - 1]);
  if (s) Sound.play(s);
  if (battle.i >= n) {
    Sound.play(battle.r.win ? 'win' : 'lose', { delay: 0.15 });
    jingled.add(battle.r);
  }
  // 마지막 줄을 보여준 뒤 잠깐 멈췄다가 결과로
  battle.timer = setTimeout(battle.i >= n ? finishBattle : tickBattle, battle.i >= n ? 700 : battle.step);
}

// 기록 한 줄 → 효과음 이름
function battleSound(e) {
  if (!e) return null;
  if (e.who === 'hero') {
    switch (e.k) {
      case 'hit':     return e.harm ? 'harm' : e.crit ? 'crit' : 'hit';
      case 'reflect': return 'hit';
      case 'miss':    return 'miss';
      case 'regen':
      case 'steal':   return 'heal';
      case 'extra':
      case 'survive': return 'special';
    }
  } else {
    switch (e.k) {
      case 'hit':   return e.crit ? 'foeCrit' : 'foeHit';
      case 'miss':  return 'miss';
      case 'block': return 'block';
    }
  }
  return null;
}

// 결과 화면이 처음 뜰 때 한 번. 전투 보기를 껐으면 승패 소리도 여기서 냅니다.
const jingled = new WeakSet();         // 전투 화면 끝에서 이미 승패 소리를 낸 결과
const soundedResults = new WeakSet();  // 결과 화면 소리를 이미 낸 결과
function resultSounds(r, run) {
  if (soundedResults.has(r)) return;
  soundedResults.add(r);
  if (!jingled.has(r)) Sound.play(r.win ? 'win' : 'lose');
  if (!r.win) return;
  if (r.levelsGained > 0) {
    const rankUp = rankOf(r.levelBefore).n !== rankOf(run.level).n;
    Sound.play(rankUp ? 'rankUp' : 'levelUp', { delay: 0.2 });
  }
  if (r.openedPath) Sound.play('pathOpen', { delay: 0.9 });
  if (r.openedSpecial) Sound.play('unlock', { delay: 1.2 });
}

// 기록 한 줄 → 글. 이름이 길어도 한 줄에 들어가게 짧게 씁니다.
function battleLine(e, foeName) {
  const v = fmt(e.v);
  if (e.who === 'hero') {
    switch (e.k) {
      case 'hit': return { cls: e.harm ? 'b-harm' : e.crit ? 'b-crit' : 'b-hero',
        text: `${e.second ? '이중타격 — ' : ''}${e.harm ? '일격! ' : e.crit ? '치명타! ' : ''}${foeName}에게 ${v}` };
      case 'miss':    return { cls: 'b-miss', text: e.second ? '두 번째 공격이 빗나갔다' : '내 공격이 빗나갔다' };
      case 'regen':   return { cls: 'b-heal', text: `재생 — 생명 +${v}` };
      case 'steal':   return { cls: 'b-heal', text: `흡혈 — 생명 +${v}` };
      case 'reflect': return { cls: 'b-hero', text: `반사 — ${foeName}에게 ${v}` };
      case 'extra':   return { cls: 'b-special', text: '연속 턴 — 한 번 더 움직인다' };
      case 'survive': return { cls: 'b-special', text: '생존 — 생명 1을 남기고 버텼다' };
    }
  } else {
    switch (e.k) {
      case 'hit':   return { cls: e.crit ? 'b-foecrit' : 'b-foe', text: `${e.crit ? '치명타! ' : ''}${foeName}의 공격 — ${v}` };
      case 'miss':  return { cls: 'b-miss', text: `${foeName}의 공격이 빗나갔다` };
      case 'block': return { cls: 'b-special', text: `${foeName}의 공격을 막았다` };
    }
  }
  return { cls: 'b-miss', text: '' };
}

function hpPct(hp, max) { return `${Math.max(0, Math.min(100, (hp / Math.max(1, max)) * 100))}%`; }

// 전투 카드 — 처음 그릴 때. 그다음부터는 paintBattle 이 바 · 숫자 · 줄만 바꿉니다.
function battleCard(b) {
  const { r } = b;
  const foe = r.enemy;
  return `
    <div class="battle" id="battle">
      <div class="bt-side foe">
        <div class="bt-top"><span class="bt-name">${foe.icon} ${foe.name}<span class="lv">Lv.${fmtLevel(foe.level)}</span></span>
          <span class="bt-hp" id="btFoeHp"></span></div>
        <div class="bt-bar"><div class="bt-fill foe" id="btFoeFill"></div></div>
      </div>
      <div class="bt-side hero">
        <div class="bt-top"><span class="bt-name">나<span class="lv">Lv.${fmtLevel(r.levelBefore || State.run.level)}</span></span>
          <span class="bt-hp" id="btHeroHp"></span></div>
        <div class="bt-bar"><div class="bt-fill hero" id="btHeroFill"></div></div>
      </div>
      <div class="bt-log" id="btLog"></div>
    </div>`;
}

function paintBattle() {
  if (!battle) return;
  // 그 사이 결과를 닫았거나 다른 회차로 넘어갔으면 그만둡니다
  if (!State.run || State.run.lastResult !== battle.r) { stopBattle(); return; }
  if (!$('battle')) { renderJourney(); return; }     // 화면만 다시 그려졌으면 카드부터 다시
  const { r, i } = battle;
  const log = r.replay.log;
  const last = i > 0 ? log[i - 1] : null;
  const heroHp = last ? last.hp : r.replay.heroMax;
  const foeHp = last ? last.fhp : r.replay.foeMax;
  $('btFoeFill').style.width = hpPct(foeHp, r.replay.foeMax);
  $('btHeroFill').style.width = hpPct(heroHp, r.replay.heroMax);
  $('btFoeHp').textContent = `${fmt(Math.max(0, foeHp))} / ${fmt(r.replay.foeMax)}`;
  $('btHeroHp').textContent = `${fmt(Math.max(0, heroHp))} / ${fmt(r.replay.heroMax)}`;

  // 최근 몇 줄. 턴이 바뀌는 줄 앞에는 턴 번호를 붙입니다.
  const from = Math.max(0, i - BATTLE_LINES);
  let html = '';
  for (let k = from; k < i; k++) {
    const e = log[k];
    const { cls, text } = battleLine(e, r.enemy.name);
    const newTurn = k === 0 || log[k - 1].t !== e.t;
    html += `<div class="bt-line ${cls} ${k === i - 1 ? 'fresh' : ''}">
      <span class="bt-turn">${newTurn ? `${e.t}턴` : ''}</span>${text}</div>`;
  }
  if (i >= log.length) {
    html += `<div class="bt-line ${r.win ? 'b-win' : 'b-lose'}"><span class="bt-turn"></span>${r.win
      ? `${r.enemy.name}${josa(r.enemy.name, '이', '가')} 쓰러졌다`
      : '쓰러졌다…'}</div>`;
  }
  $('btLog').innerHTML = html;
}

// ---------- 전투 결과 ----------
function resultCard(r, run) {
  const foe = r.enemy;
  const K = KINDS[foe.kind];

  // 경험치가 어디서 얼마나 불었는지
  const mults = [];
  if (r.gap > 1.01)   mults.push(`격차 ×${r.gap.toFixed(2)}`);
  if (r.auraXp > 1)   mults.push(`${r.aura.name} ×${r.auraXp}`);
  if (r.bossM > 1.01) mults.push(`삼킨 격 ×${r.bossM.toFixed(1)}`);

  const lines = [];
  if (r.win) {
    lines.push(row('경험치', `+${fmt(r.xp)}`, mults.length ? mults.join(' · ') : ''));
    lines.push(r.levelsGained > 0
      ? row('레벨', `Lv.${fmtLevel(r.levelBefore)} → Lv.${fmtLevel(run.level)}`, `+${fmtLevel(r.levelsGained)}`)
      : row('레벨', `Lv.${fmtLevel(run.level)}`));
    // 설명 글은 뺐습니다 — 값만 보고 알 수 있게 적습니다 (삼킨 격은 다음 회차부터 붙으니 「시작 에너지」)
    if (r.devoured > 0) lines.push(row('삼킨 격', `시작 에너지 +${r.devoured}`));
    if (r.refund > 0) lines.push(row('되찾은 에너지', `+${r.refund}`));
    if (r.openedSpecial) lines.push(row('특수장비 칸', `열렸다 ${r.openedSpecial}/${SPECIAL_SLOT_MAX}`));
  } else {
    lines.push(row('에너지', `−${r.penalty}`, `남은 ${run.energy}`));
  }

  // 전리품은 **결과가 뜬 다음에** 하나씩 튀어나옵니다.
  // 같이 떠버리면 그냥 글자 줄이지만, 한 박자 늦게 나오면 "뭔가 떨어졌다" 가 됩니다.
  // 늦추는 시간은 renderJourney 가 끝난 뒤 revealDrops() 가 붙여줍니다.
  const fx = State.meta.settings.dropFx;
  const drops = r.win && r.drops.length
    ? `<div class="res-drops">
         <div class="res-sub">빼앗은 것 ${r.drops.length}</div>
         ${r.drops.map((d, i) => `
           <div class="res-drop ${fx ? 'veiled' : ''} ${d.isNew ? 'is-new' : 'is-stone'}" data-drop="${i}">
             <span class="res-slot">${SLOT_NAMES[d.item.slot]}</span>
             <span class="res-name">${d.item.name}</span>
             ${d.item.grade !== 'normal' ? `<span class="grade-tag ${d.item.grade}">${KINDS[d.item.grade].name}</span>` : ''}
             <span class="res-tag">${d.isNew ? '새로 얻음' : `분해 · ${SLOT_NAMES[d.item.slot]} 강화석 +${fmt(d.stones)}`}</span>
             ${d.autoWorn ? '<span class="res-tag worn-now">바로 착용</span>' : ''}
           </div>`).join('')}
       </div>`
    : '';

  return `
    <div class="result ${r.win ? 'win' : 'lose'}">
      <div class="res-head">${r.win ? '승리' : '패배'}</div>
      <div class="res-foe">
        <span class="res-icon">${foe.icon}</span>
        ${r.aura ? `<span class="aura-tag" style="--aura:${r.aura.color}">${r.aura.name}</span>` : ''}
        ${foe.kind !== 'normal' ? `<span class="grade-tag ${foe.kind}">${K.name}</span>` : ''}
        ${foe.name}<span class="lv">Lv.${fmtLevel(foe.level)}</span>
        <span class="res-turns">${r.turns}턴</span>
      </div>
      ${r.openedPath ? `<div class="res-path">길이 열렸다</div>` : ''}
      <div class="res-lines">${lines.join('')}</div>
      ${drops}
      <div class="res-actions">
        <button id="continueBtn" class="btn primary thumb">${run.over ? '여정을 마친다' : '계속한다'}${KEY_HINT}</button>
        ${gearJumpButton(r)}
        ${run.over ? '' : '<button id="toAllocBtn" class="btn">스탯을 다시 나눈다</button>'}
      </div>
    </div>`;
}

// 처음 보는 것을 얻었을 때만 나오는 버튼.
// 분해된 것은 이미 아는 물건이라 확인하러 갈 이유가 없으니 뺍니다
// (NEW! 표시를 켜는 기준과 같습니다 — rollDrops 의 isNew).
//
// 한 부위만 새로 얻었으면 그 부위 이름을 그대로 적어줍니다.
// 어디로 가는지 알고 누르는 편이, 눌러보고 아는 것보다 낫습니다.
function gearJumpButton(r) {
  if (!r.win || !r.drops) return '';
  const fresh = r.drops.filter(d => d.isNew);
  if (!fresh.length) return '';

  const slots = [...new Set(fresh.map(d => d.item.slot))];
  const label = slots.length === 1
    ? `새 ${SLOT_NAMES[slots[0]]} 보러 간다`
    : `새 전리품 ${fresh.length}개 보러 간다`;
  // 특수장비는 칸이 넷이라 열린 첫 칸으로 데려갑니다 (아직 하나도 안 열렸으면 첫 칸 — 닫힌 채로 보입니다)
  const go = slots[0] === 'special' ? (SPECIAL_SLOT_IDS.find(isSlotOpen) || SPECIAL_SLOT_IDS[0]) : slots[0];
  return `<button id="toGearBtn" class="btn" data-goslot="${go}">${label}</button>`;
}

function row(k, v, note) {
  return `<div class="res-row">
    <span class="res-k">${k}</span>
    <span class="res-v">${v}</span>
    <span class="res-note">${note || ''}</span>
  </div>`;
}

// 이 적에게서 뭘 더 빼앗을 게 남았는지.
// 승률 바로 아래에 가로로 늘어놓습니다 — 셋이면 3등분, 둘이면 2등분.
// 그림과 이름만 둡니다. 능력치는 어차피 전리품 탭에서 보니까요.
//
// "다 모았다" 를 알 수 있어야 **이 녀석을 또 잡을 이유가 있는지** 판단이 섭니다.
function dropStrip(foe) {
  const table = dropTable(foe.id);
  if (!table.length) return '';
  const left = table.filter(i => !owns(i.id)).length;
  // 글자로 설명하지 않습니다 — ???? 칸이 남아 있는지만 보면 됩니다.
  return `
    <div class="enc-drops ${left === 0 ? 'done' : ''}">
      <div class="ed-list" style="grid-template-columns:repeat(${table.length}, minmax(0, 1fr))">
        ${table.map(it => {
          const have = owns(it.id);
          return `
            <div class="ed-item ${have ? 'have' : 'miss'}">
              <span class="ed-ic">${have ? it.fromIcon : '?'}</span>
              <span class="ed-name">${have ? it.name : '????'}</span>
            </div>`;
        }).join('')}
      </div>
    </div>`;
}

// 마주한 적 카드
function encounterCard(foe, isBoss, hero, aura) {
  const chance = winChance(hero, foe);
  const gap = underlevelBonus(State.run.level, foe.level);
  const xp = Math.round(foe.xp * gap * (aura ? aura.xpMult : 1) * bossXpMult() * xpGearMult(hero));
  const left = dropTable(foe.id).filter(i => !owns(i.id)).length;
  const penalty = lossPenaltyFor(foe.kind);

  const style = aura ? `style="--aura:${aura.color}"` : '';

  return `
    ${aura ? `<div class="aura-banner" ${style}>✦ ${aura.name} 기운 — ${aura.desc} ✦</div>` : ''}
    <div class="encounter ${isBoss ? 'boss' : ''} ${aura ? 'auraed' : ''}" ${style}>
      <div class="enc-icon">${foe.icon}</div>
      <div class="enc-body">
        <div class="enc-name">
          ${aura ? `<span class="aura-tag">${aura.name}</span>` : ''}${foe.kind !== 'normal' ? `<span class="grade-tag ${foe.kind}">${KINDS[foe.kind].name}</span>` : ''}${foe.name}<span class="lv">Lv.${fmtLevel(foe.level)}</span>
        </div>
        <div class="enc-stats">생명 ${fmt(foe.life)} · 공격 ${fmt(foe.damage)} · 방어 ${fmt(foe.defense)}</div>
        <div class="enc-meta">
          <span class="foe-xp">+${fmt(xp)} EXP${gap > 1.01 ? ` ×${gap.toFixed(2)}` : ''}</span>
          <span class="foe-drop">전리품 ${left > 0 ? `${left}종 ` : ''}각 ${Math.round(dropChanceFor(foe, aura ? aura.dropMult : 1) * 100)}%</span>
        </div>
      </div>
      <div class="enc-chance">
        <span class="chance-value ${winFeelClass(chance)}">${winFeel(chance)}</span>
      </div>
      ${dropStrip(foe)}
    </div>
    <div class="enc-actions">
      <button id="engageBtn" class="btn primary big thumb"><span class="btn-line">맞선다${KEY_HINT}</span></button>
      ${isBoss ? '' : '<button id="retreatBtn" class="btn">물러선다</button>'}
      <p class="enc-warn">지면 에너지 −${penalty}</p>
    </div>`;
}

// 아무도 없을 때 — 떠날 것인가, 정해진 자리로 갈 것인가, 다음 지역으로 갈 것인가
function crossroads(boss, hero, run) {
  const canMove = run.energy >= RULES.TRAVEL_COST;
  const nextZone = ZONES[run.zoneIndex + 1];

  // 정예·히든·보스 — 정해진 자리에 서 있고, 한 여정에 한 번뿐
  const posts = visiblePosts(run.zoneIndex).map(foe => {
    const down = isDowned(foe.id);
    const c = winChance(hero, foe);
    const left = dropTable(foe.id).filter(i => !owns(i.id)).length;
    const K = KINDS[foe.kind];
    const seen = isSeen(foe.id);
    // 설명 글은 뺐습니다. 남기는 건 아직 못 얻은 전리품의 수 하나 — 또 찾아갈지 정하는 데 쓰입니다.
    return `
      <div class="post ${foe.kind} ${down ? 'down' : ''} ${seen ? '' : 'unseen'}">
        <span class="post-icon">${seen ? foe.icon : '❓'}</span>
        <div class="post-body">
          <div class="post-name">
            <span class="grade-tag ${foe.kind}">${K.name}</span>${seen ? foe.name : '???'}<span class="lv">Lv.${fmtLevel(foe.level)}</span>
          </div>
          ${!down && seen && left > 0 ? `<div class="post-desc">못 얻은 것 ${left}</div>` : ''}
        </div>
        ${down
          ? `<span class="post-done">꺾음</span>`
          : `<span class="post-chance ${winFeelClass(c)}">${winFeel(c)}</span>
             <button class="btn post-btn ${foe.kind}" data-post="${foe.id}" ${canMove ? '' : 'disabled'}>향한다</button>`}
      </div>`;
  }).join('');

  return `
    <div class="crossroads">
      ${run.zoneCleared && nextZone ? `
        <button id="nextZoneBtn" class="btn next-btn" ${run.energy >= RULES.ZONE_MOVE_COST ? '' : 'disabled'}>
          ${nextZone.name}(으)로 넘어간다<span class="cost">에너지 ${RULES.ZONE_MOVE_COST}${run.energy >= RULES.ZONE_MOVE_COST
            ? '' : ` · 남은 ${run.energy}`}</span>
        </button>` : ''}

      <button id="travelBtn" class="btn primary big thumb" ${canMove ? '' : 'disabled'}>
        <span class="btn-line">길을 떠난다${KEY_HINT}</span>
        <span class="cost">에너지 ${RULES.TRAVEL_COST}</span>
      </button>

      ${posts}
    </div>`;
}

// ---------- 승률은 숫자로 보여주지 않습니다 ----------
// 정확한 확률 대신 "느낌" 을 한 문장으로. 20% 구간마다 하나씩이고,
// 80% 위쪽만 둘로 나눴습니다 — 거의 이기는 싸움과 확실히 이기는 싸움은 갈려야 하니까요.
// 숫자가 보이면 계산을 하게 되고, 문장이 보이면 판단을 하게 됩니다.
// 속으로는 그대로 winChance 로 재고, 색(초록·노랑·빨강)도 그대로 갈립니다.
//   from — 이 값 이상이면 이 문장 (다음 줄의 from 미만까지)
//   cls  — 문장마다 다른 잉크 (빨강 → 주황 → 황토 → 올리브 → 초록 → 파랑). css 의 .feel-0 ~ .feel-5
const WIN_FEELS = [
  { from: 0.0, text: '불가능할 것 같다',     cls: 'feel-0' },   //  0~20%
  { from: 0.2, text: '이기기 힘들 것 같다',  cls: 'feel-1' },   // 20~40%
  { from: 0.4, text: '해볼 만하다',          cls: 'feel-2' },   // 40~60%
  { from: 0.6, text: '이길 수 있을 것 같다', cls: 'feel-3' },   // 60~80%
  { from: 0.8, text: '어렵지 않을 것 같다',  cls: 'feel-4' },   // 80~90%
  { from: 0.9, text: '잡기 쉬울 것 같다',    cls: 'feel-5' }    // 90~100%
];

function winFeelOf(c) {
  const v = num(c);
  let feel = WIN_FEELS[0];
  for (const f of WIN_FEELS) if (v >= f.from) feel = f;
  return feel;
}
function winFeel(c)      { return winFeelOf(c).text; }
function winFeelClass(c) { return winFeelOf(c).cls; }

// 여정 한복판에서 차림을 바꿉니다.
// 갈아입을 이유가 생기는 자리는 전리품 탭이 아니라 여기입니다 —
// 눈앞의 상대를 보고 정하는 일이라, 탭을 오가게 만들면 아무도 안 씁니다.
// 저장·덮어쓰기는 전리품 탭에 그대로 두고, 여기서는 입기만 합니다.
function journeySets() {
  return `
    <div class="journey-sets">
      <span class="js-k">차림</span>
      ${Array.from({ length: SET_COUNT }, (_, n) => {
        const on = isSetActive(n);
        const filled = setFilled(n);
        return `<button class="js-set ${on ? 'on' : ''}" data-jset="${n}" ${on ? 'disabled' : ''}>
                  세트 ${n + 1}${on ? ' · 입는 중' : (filled ? ` · ${filled}부위` : ' · 빔')}
                </button>`;
      }).join('')}
    </div>`;
}

function wireJourney() {
  const on = (id, fn) => { const el = $(id); if (el) el.addEventListener('click', fn); };
  for (const b of document.querySelectorAll('[data-jset]')) {
    b.addEventListener('click', () => { switchSet(Number(b.dataset.jset)); Sound.play('equip'); render(); });
  }
  on('rosterBtn',    openRosterModal);
  const rab = $('rosterAllBtn');
  if (rab && !rab.dataset.wired) {
    rab.dataset.wired = '1';
    rab.addEventListener('click', () => {
      rosterAll = !rosterAll;
      renderRoster();
      const el = $('roster');
      if (el) el.scrollTop = 0;
    });
  }
  for (const b of document.querySelectorAll('[data-closeroster]')) {
    if (b.dataset.wired) continue;
    b.dataset.wired = '1';
    b.addEventListener('click', closeRosterModal);
  }
  on('travelBtn',    () => { travel();         soundEncounter();         render(); });
  on('nextZoneBtn',  () => { moveToNextZone(); Sound.play('zoneMove');   render(); });
  on('engageBtn',    () => { startBattle(engage()); render(); });   // 소리는 전투 화면이 한 줄씩 냅니다
  on('retreatBtn',   () => { retreat();        Sound.play('retreat');    render(); });
  on('continueBtn',  () => { dismissResult();  render(); });
  on('toAllocBtn',   () => { dismissResult();  render(); spotlightAlloc(); });
  on('toGearBtn',    () => {
    const slot = $('toGearBtn').dataset.goslot;
    dismissResult(); render(); spotlightGear(slot);
  });
  for (const btn of document.querySelectorAll('[data-post]')) {
    btn.addEventListener('click', () => { approachPost(btn.dataset.post); soundEncounter(); render(); });
  }
}

// 분배판을 바로 띄웁니다 — 결과 화면의 「스탯을 다시 나눈다」가 부릅니다.
function spotlightAlloc() {
  openAllocModal();
  const el = $('alloc');
  if (!el) return;
  el.classList.remove('spotlight');
  void el.offsetWidth;            // 애니메이션 재시작용
  el.classList.add('spotlight');
}

// 방금 얻은 전리품이 있는 부위의 창을 바로 열어줍니다.
// clearFresh 는 창을 닫을 때 일어나므로, 열린 목록에는 NEW! 가 그대로 붙어 있습니다.
function spotlightGear(slot) {
  showTab('gear');
  openSlotModal(slot || selectedSlot);
  const inv = $('inventory');
  if (!inv) return;
  inv.classList.remove('spotlight');
  void inv.offsetWidth;
