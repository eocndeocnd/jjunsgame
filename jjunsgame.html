<!-- 맨 뒤의 헤진 지도. 게임과 상관없이 먼저 그려둡니다. -->
<script>
// ============================================================
//  backdrop.js  —  맨 뒤 바탕: 헤진 지도 종이
//  그림 파일을 따로 두지 않고 열 때마다 그립니다. 씨앗이 같으니 늘 같은 지도입니다.
//  화면 크기에 맞춰 3~4px 짜리 도트로 찍은 뒤 CSS 배경(--backdrop)으로 깝니다.
//  게임 규칙과는 상관이 없습니다 — 이 파일이 없어도 게임은 돌아갑니다 (바탕만 민짜 종이색).
// ============================================================
(function () {
  'use strict';

  const SEED = 1984;

  // 종이 사다리 — 밝은 것부터 어두운 것까지. 얼룩 · 접힌 자국 · 잉크 · 그을음이
  // 전부 이 위에서 골라집니다. 색을 따로 섞지 않으니 도트가 지저분해지지 않습니다.
  const PAPER = [
    [0xe8, 0xd1, 0x9e],   // 0 가장 밝은 종이
    [0xdc, 0xc0, 0x89],   // 1 종이
    [0xcf, 0xaf, 0x76],   // 2 바랜 종이
    [0xbf, 0x9c, 0x63],   // 3 얼룩
    [0xaa, 0x85, 0x51],   // 4 옅은 잉크 · 짙은 얼룩
    [0x8e, 0x6b, 0x3e],   // 5 잉크
    [0x6f, 0x51, 0x2c],   // 6 진한 잉크 · 그을음
    [0x4e, 0x36, 0x1b],   // 7 탄 자리
    [0x33, 0x22, 0x10]    // 8 타서 검어진 가장자리
  ];
  const RED = [null, [0xa8, 0x50, 0x3a], [0x8f, 0x2e, 0x22]];   // 붉은 길(바랜) · 표시와 나침반 바늘(진한)
  // 4×4 순서 디더 — 사다리 두 칸 사이를 바둑판 무늬로 섞습니다
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];

  // ---------- 잡음 ----------
  function hash(x, y) {
    let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(SEED, 1442695041);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  function noise(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const u = x - xi, v = y - yi;
    const su = u * u * (3 - 2 * u), sv = v * v * (3 - 2 * v);
    const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
    return a + (b - a) * su + (c - a) * sv + (a - b - c + d) * su * sv;
  }
  function fbm(x, y, oct) {
    let s = 0, amp = 1, norm = 0;
    for (let i = 0; i < oct; i++) {
      s += noise(x, y) * amp;
      norm += amp;
      x = x * 2.03 + 17.1;
      y = y * 2.03 + 9.7;
      amp *= 0.5;
    }
    return s / norm;
  }

  // ---------- 지도 기호 ----------
  // # 잉크 · + 옅은 잉크(그늘) · - 밝힌 자리
  const MOUNTAIN = [
    '....#....',
    '...#+#...',
    '..#.++#..',
    '.#...++#.',
    '#.......#'
  ];
  const HILL = [
    '..#..',
    '.#+#.',
    '#..+#'
  ];
  const TREE = [
    '.#.',
    '###',
    '.+.'
  ];
  const WAVE = [
    '.##..',
    '#..##'
  ];
  const CROSS = [
    '#...#',
    '.#.#.',
    '..#..',
    '.#.#.',
    '#...#'
  ];
  const LETTER_N = [
    '#..#',
    '##.#',
    '#.##',
    '#..#'
  ];

  // ---------- 그리기 ----------
  let lastKey = '';

  function draw() {
    const vw = window.innerWidth || 360;
    const vh = window.innerHeight || 640;
    const S = vw < 700 ? 3 : 4;                 // 도트 한 칸의 크기 (px)
    const W = Math.ceil(vw / S), H = Math.ceil(vh / S);
    const key = `${W}x${H}@${S}`;
    if (key === lastKey) return;
    lastKey = key;

    const N = W * H;
    const tone = new Float32Array(N);           // 사다리 위의 자리 (실수)
    const alive = new Uint8Array(N);            // 종이가 남아 있는 칸
    const red = new Uint8Array(N);              // 붉은 잉크
    const minWH = Math.min(W, H);
    const burnDepth = S === 3 ? 5 : 7;          // 그을음이 안으로 번지는 깊이 (칸)
    const MARGIN = S === 3 ? 7 : 9;             // 종이 끝에서 지도 테두리선까지 (칸)

    const at = (x, y) => (x >= 0 && y >= 0 && x < W && y < H) ? y * W + x : -1;
    const add = (x, y, v) => { const i = at(x, y); if (i >= 0 && alive[i]) tone[i] += v; };
    const stamp = (gx, gy, rows, ink) => {
      for (let r = 0; r < rows.length; r++) {
        for (let c = 0; c < rows[r].length; c++) {
          const ch = rows[r][c];
          if (ch === '.') continue;
          add(gx + c, gy + r, ch === '#' ? ink : ch === '+' ? ink * 0.5 : -0.8);
        }
      }
    };

    // 접힌 자국 — 지도를 접어 들고 다녔던 자리. 세로로 긴 화면은 3단, 가로로 긴 화면은 3열.
    const cols = W > H * 1.2 ? 3 : 2;
    const rows = H > W * 1.2 ? 3 : 2;
    const foldX = [], foldY = [];
    for (let k = 1; k < cols; k++) foldX.push(Math.round(k * W / cols));
    for (let k = 1; k < rows; k++) foldY.push(Math.round(k * H / rows));

    // 1. 종이, 찢어진 가장자리, 그을음
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const i = y * W + x;
        // 접힌 자리가 가장자리와 만나는 곳은 더 깊이 찢어집니다
        let biteV = 0, biteH = 0;
        for (const fx of foldX) biteV = Math.max(biteV, 5 * Math.exp(-((x - fx) ** 2) / 6));
        for (const fy of foldY) biteH = Math.max(biteH, 5 * Math.exp(-((y - fy) ** 2) / 6));
        const rag = 1 + 3.2 * fbm(x * 0.12 + 31, y * 0.12 + 7, 3) + (hash(x, y) - 0.5) * 1.1;
        const e = Math.min(
          Math.min(y, H - 1 - y) - rag - biteV,
          Math.min(x, W - 1 - x) - rag - biteH);
        if (e < 0) continue;                    // 찢겨 나간 자리 — 밑의 어두운 바탕이 보입니다
        alive[i] = 1;

        let t = 1.3
          + (fbm(x * 0.03, y * 0.03, 4) - 0.5) * 3.2              // 크게 바랜 얼룩
          + (fbm(x * 0.21 + 40, y * 0.21 + 40, 2) - 0.5) * 0.9    // 잔 얼룩
          + (hash(x * 3 + 11, y * 5 + 3) - 0.5) * 0.35;           // 종이 결
        const burn = Math.max(0, 1 - e / burnDepth);
        t += burn * burn * 5.6;
        if (e < 1) t = Math.max(t, 7.2);        // 찢어진 끝은 타서 검습니다
        tone[i] = t;
      }
    }

    // 2. 지도 — 테두리선 안쪽에만
    const inMap = (x, y) => Math.min(x, y, W - 1 - x, H - 1 - y) > MARGIN + 1;
    const height = new Float32Array(N);
    const land = new Uint8Array(N);
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const i = y * W + x;
        if (!alive[i]) continue;
        const m = Math.min(x, y, W - 1 - x, H - 1 - y);
        // 지도 테두리 — 굵은 선 하나, 그 안에 점선 하나
        if (m === MARGIN) tone[i] += 2.3;
        else if (m === MARGIN + 2 && ((x + y) & 1)) tone[i] += 1.3;
        if (!inMap(x, y)) continue;
        const wx = (fbm(x * 0.018 + 5, y * 0.018 + 9, 2) - 0.5) * 3;
        const wy = (fbm(x * 0.018 + 21, y * 0.018 + 2, 2) - 0.5) * 3;
        const h = fbm(x * 0.026 + wx, y * 0.026 + wy, 5);
        height[i] = h;
        land[i] = h > 0.5 ? 1 : 0;
        // 경위선 — 아주 옅은 점선
        if ((((x - MARGIN) % 28 === 14) || ((y - MARGIN) % 28 === 14)) && ((x + y) & 1)) tone[i] += 0.8;
      }
    }

    // 해안선과 물결선 — 해안에서 바다 쪽으로 몇 칸씩 떨어진 선을 겹겹이
    const dist = new Int16Array(N).fill(-1);
    const queue = new Int32Array(N);
    let qh = 0, qt = 0;
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const i = y * W + x;
        if (!alive[i] || !inMap(x, y)) continue;
        const nb = [at(x + 1, y), at(x - 1, y), at(x, y + 1), at(x, y - 1)];
        if (land[i]) {
          if (nb.some(j => j >= 0 && inMap(j % W, (j / W) | 0) && !land[j])) tone[i] += 3.2;
        } else {
          tone[i] += 0.4;                        // 바다는 한 톤 어둡게
          if (nb.some(j => j >= 0 && land[j])) { dist[i] = 1; queue[qt++] = i; }
        }
      }
    }
    while (qh < qt) {
      const i = queue[qh++];
      const d = dist[i];
      if (d >= 8) continue;
      const x = i % W, y = (i / W) | 0;
      for (const j of [at(x + 1, y), at(x - 1, y), at(x, y + 1), at(x, y - 1)]) {
        if (j < 0 || dist[j] >= 0 || land[j] || !alive[j]) continue;
        if (!inMap(j % W, (j / W) | 0)) continue;
        dist[j] = d + 1;
        queue[qt++] = j;
      }
    }
    for (let i = 0; i < N; i++) {
      const d = dist[i];
      if (d < 0) continue;
      const x = i % W, y = (i / W) | 0;
      if (d === 2 && (x * 7 + y * 3) % 6 !== 0) tone[i] += 1.6;
      else if (d === 4 && ((x + y) & 1)) tone[i] += 1.2;
      else if (d === 6 && (x + y) % 3 === 0) tone[i] += 0.9;
    }

    // 먼바다의 물결, 산, 숲 — 성긴 격자에 하나씩, 자리는 조금씩 흔들어서
    const openSea = i => i >= 0 && alive[i] && !land[i] && (dist[i] < 0 || dist[i] > 8) && height[i] > 0;
    for (let gy = 0; gy * 9 < H; gy++) {
      for (let gx = 0; gx * 13 < W; gx++) {
        const px = gx * 13 + Math.floor(hash(gx, gy + 500) * 7);
        const py = gy * 9 + Math.floor(hash(gx + 500, gy) * 5);
        if (hash(gx + 900, gy + 900) < 0.55 && openSea(at(px, py)) && openSea(at(px + 4, py + 1))) {
          stamp(px, py, WAVE, 1.7);
        }
      }
    }
    for (let gy = 0; gy * 7 < H; gy++) {
      for (let gx = 0; gx * 10 < W; gx++) {
        const px = gx * 10 + Math.floor(hash(gx + 31, gy + 77) * 4);
        const py = gy * 7 + Math.floor(hash(gx + 77, gy + 31) * 3);
        const i = at(px + 4, py + 4);
        if (i < 0 || !land[i]) continue;
        const h = height[i];
        if (h > 0.69) stamp(px, py, MOUNTAIN, 3.1);
        else if (h > 0.63) stamp(px + 2, py + 2, HILL, 2.8);
      }
    }
    for (let gy = 0; gy * 5 < H; gy++) {
      for (let gx = 0; gx * 6 < W; gx++) {
        const px = gx * 6 + Math.floor(hash(gx + 3, gy + 51) * 3);
        const py = gy * 5 + Math.floor(hash(gx + 51, gy + 3) * 2);
        const i = at(px + 1, py + 1);
        if (i < 0 || !land[i]) continue;
        const h = height[i];
        if (h < 0.53 || h > 0.61) continue;
        if (fbm(px * 0.05 + 70, py * 0.05 + 70, 3) < 0.56) continue;
        stamp(px, py, TREE, 2.6);
      }
    }

    // 3. 물에 젖었던 동그란 자국
    const rings = [
      { cx: 0.80 * W, cy: 0.16 * H, r: 0.11 * minWH + 5 },
      { cx: 0.14 * W, cy: 0.74 * H, r: 0.08 * minWH + 4 }
    ];
    for (const g of rings) {
      const R = Math.ceil(g.r + 3);
      for (let y = Math.floor(g.cy - R); y <= g.cy + R; y++) {
        for (let x = Math.floor(g.cx - R); x <= g.cx + R; x++) {
          const dx = x - g.cx, dy = y - g.cy;
          const d = Math.hypot(dx, dy);
          const gap = Math.abs(d - g.r);
          const a = Math.atan2(dy, dx);
          if (gap < 1.0 && noise(a * 3 + 10, g.r) > 0.3) add(x, y, 1.1);
          else if (d < g.r) add(x, y, g.r - d < 2.5 ? 0.6 : 0.25);
        }
      }
    }

    // 4. 접힌 자국 — 어두운 골 한 줄, 그 옆에 밝게 선 등성이 한 줄
    for (const fx of foldX) {
      for (let y = 0; y < H; y++) {
        const x = fx + Math.round((noise(y * 0.06, fx * 0.7) - 0.5) * 2.2);
        add(x, y, 1.2);
        add(x + 1, y, -0.7);
        if (hash(x, y * 3) > 0.75) add(x, y, -0.6);   // 닳아서 하얗게 일어난 자리
      }
    }
    for (const fy of foldY) {
      for (let x = 0; x < W; x++) {
        const y = fy + Math.round((noise(x * 0.06, fy * 0.7) - 0.5) * 2.2);
        add(x, y, 1.2);
        add(x, y + 1, -0.7);
        if (hash(x * 3, y) > 0.75) add(x, y, -0.6);
      }
    }

    // 5. 붉은 길 — 누군가 지나간 여정. 끝에 ✕
    const pts = [[0.10, 0.34], [0.27, 0.20], [0.46, 0.30], [0.66, 0.24], [0.76, 0.48], [0.60, 0.66], [0.84, 0.84]]
      .map(([u, v], k) => [
        Math.round(u * W + (hash(k, 7) - 0.5) * 6),
        Math.round(v * H + (hash(7, k) - 0.5) * 6)]);
    let step = 0;
    const plot = (x, y) => {
      const i = at(x, y);
      if (i >= 0 && alive[i] && inMap(x, y) && (step++ % 5) < 3) red[i] = 1;
    };
    for (let k = 1; k < pts.length; k++) {
      const [x0, y0] = pts[k - 1], [x1, y1] = pts[k];
      // 곧게 긋지 않고 가운데를 한 번 휘게 합니다
      const mx = Math.round((x0 + x1) / 2 + (hash(k, 99) - 0.5) * 10);
      const my = Math.round((y0 + y1) / 2 + (hash(99, k) - 0.5) * 10);
      line(x0, y0, mx, my, plot);
      line(mx, my, x1, y1, plot);
    }
    const [ex, ey] = pts[pts.length - 1];
    for (let r = 0; r < CROSS.length; r++) {
      for (let c = 0; c < CROSS[r].length; c++) {
        const i = at(ex - 2 + c, ey - 2 + r);
        if (CROSS[r][c] === '#' && i >= 0 && alive[i]) red[i] = 2;
      }
    }

    // 6. 나침반 — 오른쪽 위 구석
    const R = S === 3 ? 6 : 9;
    const ccx = W - MARGIN - R - 5, ccy = MARGIN + R + 7;
    for (let y = ccy - R - 3; y <= ccy + R + 3; y++) {
      for (let x = ccx - R - 3; x <= ccx + R + 3; x++) {
        const i = at(x, y);
        if (i < 0 || !alive[i]) continue;
        const dx = x - ccx, dy = y - ccy;
        const d = Math.hypot(dx, dy);
        if (Math.abs(d - (R + 1.6)) < 0.55) { tone[i] += 2.4; continue; }
        if (Math.abs(d - R * 0.42) < 0.5) tone[i] += 1.4;
        const ax = Math.abs(dx), ay = Math.abs(dy);
        const vert = ay <= R && ax <= (1 - ay / R) * R * 0.24 + 0.2;
        const horz = ax <= R && ay <= (1 - ax / R) * R * 0.24 + 0.2;
        const u = Math.abs(dx + dy) / Math.SQRT2, v = Math.abs(dx - dy) / Math.SQRT2;
        const L = R * 0.62;
        const diag = (u <= L && v <= (1 - u / L) * L * 0.22 + 0.2) || (v <= L && u <= (1 - v / L) * L * 0.22 + 0.2);
        if (vert && dy < 0) red[i] = dx > 0 ? 1 : 2;           // 북쪽 바늘은 붉게
        else if (vert || horz) tone[i] += (dx + dy > 0) ? 3.6 : 1.6;   // 바늘마다 한쪽은 그늘
        else if (diag) tone[i] += 2.0;
      }
    }
    stamp(ccx - 1, ccy - R - 9, LETTER_N, 3.4);

    // 7. 사다리에 올려 도트로 찍습니다
    const cv = document.createElement('canvas');
    cv.width = W;
    cv.height = H;
    const ctx = cv.getContext('2d');
    const img = ctx.createImageData(W, H);
    const px = img.data;
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const i = y * W + x;
        if (!alive[i]) continue;                 // 투명 — CSS 바탕색(가장 어두운 갈색)이 비칩니다
        let c;
        if (red[i]) c = RED[red[i]];
        else {
          const t = tone[i] + BAYER[(y & 3) * 4 + (x & 3)] / 16 - 0.5;
          c = PAPER[Math.max(0, Math.min(PAPER.length - 1, Math.round(t)))];
        }
        const o = i * 4;
        px[o] = c[0]; px[o + 1] = c[1]; px[o + 2] = c[2]; px[o + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);

    const root = document.documentElement.style;
    root.setProperty('--backdrop', `url("${cv.toDataURL('image/png')}")`);
    root.setProperty('--bd-size', `${W * S}px ${H * S}px`);
  }

  // 브레젠험 — 두 점 사이를 칸 단위로 잇습니다
  function line(x0, y0, x1, y1, fn) {
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
    const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx + dy;
    for (;;) {
      fn(x0, y0);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
  }

  // 화면 크기가 바뀌면(돌리기 · 주소창) 다시 그립니다. 같은 씨앗이라 그림은 그대로 이어집니다.
  let timer = null;
  window.addEventListener('resize', () => {
    clearTimeout(timer);
    timer = setTimeout(draw, 180);
  });
  try { draw(); } catch (e) { /* 바탕을 못 그려도 게임은 돌아야 합니다 */ }
})();

</script>
<!-- 효과음과 배경음. 소리 파일 없이 그 자리에서 만듭니다. -->
<script>
// ============================================================
//  sound.js  —  효과음과 배경음
//  소리 파일이 없습니다. 옛 게임기처럼 네모파 · 세모파 · 잡음을 그 자리에서 만듭니다 (Web Audio).
//  그래서 한 파일 빌드에도 그대로 들어가고, 인터넷이 없어도 납니다.
//
//    Sound.play('hit')      효과음
//    Sound.music('field')   배경음 바꾸기 — 같은 곡이면 아무 일도 안 하고, null 이면 멈춥니다
//    Sound.get / Sound.set  효과음 · 배경음 켜고 끄기. 기기에 저장합니다 (저장 칸과 상관없음)
//
//  브라우저는 사용자가 한 번 누르기 전에는 소리를 못 내게 막습니다.
//  그래서 첫 터치 · 클릭 · 키를 기다렸다가 소리를 깨웁니다.
//  화면이 꺼지거나 다른 앱으로 가면 소리를 재우고, 돌아오면 다시 깨웁니다.
//
//  배경음을 직접 만든 곡으로 바꾸고 싶으면 SONGS 대신 소리 파일을 쓰도록 music 만 고치면 됩니다.
// ============================================================
const Sound = (() => {
  'use strict';

  const PREF_KEY = 'jjunsgame.audio';
  const prefs = { sfx: true, bgm: true };
  try { Object.assign(prefs, JSON.parse(localStorage.getItem(PREF_KEY) || '{}')); } catch (e) { /* 저장소가 막힌 곳 */ }

  const SFX_LEVEL = 0.9;     // 효과음 전체 크기
  const BATTLE_LEVEL = 0.6;  // 그중 전투 중 한 줄마다 나는 소리 — 한 판에 수십 번 나서 따로 낮춥니다
  const BGM_LEVEL = 0.38;    // 배경음 전체 크기 — 효과음보다 한참 작게 깝니다 (전투 소리가 묻히지 않게)

  let ac = null;             // AudioContext — 첫 입력 때 만듭니다
  let eng = null;            // 그 위의 소리 엔진
  let want = null;           // 지금 틀어야 할 곡 (소리가 깨기 전에 정해질 수 있습니다)
  let cur = null;            // 지금 도는 곡 — { name, song, gain, step, next, timer }
  const lastPlayed = {};     // 같은 효과음이 한꺼번에 겹쳐 터지지 않게

  // ---------- 음 이름 → 높이 ----------
  const NOTE_IDX = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  const freqCache = new Map();
  function N(name) {
    if (freqCache.has(name)) return freqCache.get(name);
    const m = /^([A-G])([#b]?)(-?\d)$/.exec(name);
    let f = 0;
    if (m) {
      const k = NOTE_IDX[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
      const midi = (Number(m[3]) + 1) * 12 + k;
      f = 440 * Math.pow(2, (midi - 69) / 12);
    }
    freqCache.set(name, f);
    return f;
  }

  // ---------- 엔진 ----------
  // 스피커용 하나를 만들고, 크기를 재는 시험(OfflineAudioContext)에도 똑같이 만듭니다.
  function makeEngine(c) {
    const master = c.createGain();
    master.gain.value = 0.9;
    // 여러 소리가 한꺼번에 겹쳐도 찢어지지 않게 눌러주고, 너무 날카로운 윗소리는 깎습니다
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -14;
    comp.knee.value = 8;
    comp.ratio.value = 4;
    comp.attack.value = 0.003;
    comp.release.value = 0.15;
    const soft = c.createBiquadFilter();
    soft.type = 'lowpass';
    soft.frequency.value = 9000;
    master.connect(comp);
    comp.connect(soft);
    soft.connect(c.destination);

    const sfx = c.createGain();
    const bgm = c.createGain();
    const battle = c.createGain();     // 전투 소리는 효과음 줄기에서 한 번 더 낮춥니다
    battle.gain.value = BATTLE_LEVEL;
    sfx.connect(master);
    bgm.connect(master);
    battle.connect(sfx);

    // 네모파 — 높은 칸이 1/8 · 1/4 · 1/2 인 세 가지. 옛 게임기 소리의 대부분이 이것입니다.
    const pulse = duty => {
      const n = 48;
      const real = new Float32Array(n), imag = new Float32Array(n);
      for (let k = 1; k < n; k++) real[k] = (2 / (k * Math.PI)) * Math.sin(k * Math.PI * duty);
      return c.createPeriodicWave(real, imag);
    };
    // 잡음 — 북 · 타격 · 바람 소리의 재료
    const noiseBuf = c.createBuffer(1, Math.floor(c.sampleRate * 1.0), c.sampleRate);
    const ch = noiseBuf.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;

    return { c, sfx, bgm, battle, noise: noiseBuf, waves: { p12: pulse(0.125), p25: pulse(0.25), p50: pulse(0.5) } };
  }

  // 음 하나. f 에서 f2 로 미끄러질 수 있습니다.
  // sus 가 있으면 음악처럼 조금 줄어든 채 버티다 끝에서 놓고, 없으면 톡 치고 사그라듭니다.
  function tone(e, out, t, o) {
    const c = e.c;
    const osc = c.createOscillator();
    if (o.wave === 'tri') osc.type = 'triangle';
    else if (o.wave === 'sine') osc.type = 'sine';
    else osc.setPeriodicWave(e.waves[o.wave] || e.waves.p25);
    osc.frequency.setValueAtTime(o.f, t);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, t + o.d);

    const g = c.createGain();
    const v = o.v, d = o.d;
    const a = Math.min(0.006, d * 0.3);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + a);
    if (o.sus) {
      const hold = Math.max(t + a + 0.001, t + d - 0.04);
      g.gain.exponentialRampToValueAtTime(v * o.sus, Math.min(hold, t + a + 0.08));
      g.gain.setValueAtTime(v * o.sus, hold);
    }
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    osc.connect(g);
    g.connect(out);
    osc.start(t);
    osc.stop(t + d + 0.03);
  }

  // 잡음 한 번. type 은 걸러낼 방식 — bandpass(가운데만) · lowpass(묵직하게) · highpass(찰랑하게)
  function noise(e, out, t, o) {
    const c = e.c;
    const src = c.createBufferSource();
    src.buffer = e.noise;
    const f = c.createBiquadFilter();
    f.type = o.type || 'bandpass';
    f.frequency.setValueAtTime(o.f || 2000, t);
    if (o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, t + o.d);
    f.Q.value = o.q || 0.8;
    const g = c.createGain();
    g.gain.setValueAtTime(o.v, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.d);
    src.connect(f);
    f.connect(g);
    g.connect(out);
    src.start(t, Math.random() * 0.5);
    src.stop(t + o.d + 0.03);
  }

  // 음 여러 개를 차례로 — 마지막 음만 길게 끌 수 있습니다 (last)
  function arp(e, out, t, notes, step, o) {
    notes.forEach((n, i) => {
      const end = i === notes.length - 1 && o.last;
      tone(e, out, t + i * step, { wave: o.wave, f: N(n), d: end ? o.last : o.d, v: o.v, sus: end ? 0.75 : o.sus });
    });
  }

  // ---------- 효과음 ----------
  const SFX = {
    // 누르기 — 아주 짧고 작게
    tick: (e, o, t) => tone(e, o, t, { wave: 'p25', f: 1320, f2: 990, d: 0.035, v: 0.13 }),

    // 길 · 조우
    encounter: (e, o, t) => {
      tone(e, o, t, { wave: 'p25', f: N('A5'), d: 0.06, v: 0.16 });
      tone(e, o, t + 0.07, { wave: 'p25', f: N('E6'), d: 0.1, v: 0.16 });
    },
    encounterElite: (e, o, t) => arp(e, o, t, ['E5', 'A5', 'E6'], 0.08, { wave: 'p25', d: 0.07, v: 0.15, last: 0.18 }),
    encounterBoss: (e, o, t) => {
      tone(e, o, t, { wave: 'p50', f: N('E3'), d: 0.55, v: 0.12, sus: 0.7 });
      tone(e, o, t, { wave: 'p25', f: N('A#3'), d: 0.55, v: 0.08, sus: 0.7 });
      noise(e, o, t, { type: 'lowpass', f: 500, d: 0.5, v: 0.14 });
      tone(e, o, t + 0.25, { wave: 'tri', f: N('E2'), d: 0.55, v: 0.2, sus: 0.8 });
    },
    aura: (e, o, t) => arp(e, o, t, ['C6', 'E6', 'G6', 'C7'], 0.045, { wave: 'p12', d: 0.08, v: 0.12 }),
    retreat: (e, o, t) => tone(e, o, t, { wave: 'p25', f: 700, f2: 220, d: 0.16, v: 0.16 }),
    zoneMove: (e, o, t) => {
      tone(e, o, t, { wave: 'p25', f: 220, f2: 1320, d: 0.42, v: 0.07 });
      noise(e, o, t, { f: 800, f2: 3000, d: 0.4, v: 0.05 });
      tone(e, o, t + 0.42, { wave: 'tri', f: N('C5'), d: 0.3, v: 0.14, sus: 0.7 });
    },

    // 전투 — 내가 때림
    hit: (e, o, t) => {
      noise(e, o, t, { f: 2200, d: 0.06, v: 0.75 });
      tone(e, o, t, { wave: 'p50', f: 620, f2: 180, d: 0.07, v: 0.28 });
    },
    crit: (e, o, t) => {
      noise(e, o, t, { f: 3200, d: 0.1, v: 0.9 });
      tone(e, o, t, { wave: 'p25', f: 1400, f2: 260, d: 0.11, v: 0.34 });
      tone(e, o, t + 0.03, { wave: 'p12', f: N('E7'), d: 0.05, v: 0.14 });
    },
    harm: (e, o, t) => {                       // 일격 — 땅이 울리게
      tone(e, o, t, { wave: 'sine', f: 140, f2: 38, d: 0.32, v: 0.6 });
      noise(e, o, t, { type: 'lowpass', f: 1600, f2: 300, d: 0.3, v: 0.5 });
      tone(e, o, t, { wave: 'p50', f: 380, f2: 70, d: 0.22, v: 0.16 });
    },
    // 전투 — 내가 맞음 (둔하고 낮게)
    foeHit: (e, o, t) => {
      noise(e, o, t, { type: 'lowpass', f: 900, d: 0.09, v: 0.45 });
      tone(e, o, t, { wave: 'tri', f: 220, f2: 90, d: 0.11, v: 0.4 });
    },
    foeCrit: (e, o, t) => {
      noise(e, o, t, { type: 'lowpass', f: 1200, d: 0.16, v: 0.55 });
      tone(e, o, t, { wave: 'tri', f: 260, f2: 70, d: 0.2, v: 0.5 });
      tone(e, o, t, { wave: 'p50', f: 160, f2: 60, d: 0.18, v: 0.12 });
    },
    miss: (e, o, t) => noise(e, o, t, { f: 5000, f2: 900, q: 1.2, d: 0.14, v: 0.35 }),
    block: (e, o, t) => {
      tone(e, o, t, { wave: 'p25', f: 1900, d: 0.05, v: 0.16 });
      tone(e, o, t + 0.02, { wave: 'p25', f: 2600, d: 0.06, v: 0.14 });
      noise(e, o, t, { type: 'highpass', f: 6000, d: 0.04, v: 0.15 });
    },
    heal: (e, o, t) => arp(e, o, t, ['C6', 'E6', 'G6'], 0.05, { wave: 'tri', d: 0.09, v: 0.2 }),
    special: (e, o, t) => arp(e, o, t, ['G5', 'B5', 'D6', 'G6'], 0.04, { wave: 'p12', d: 0.08, v: 0.16 }),

    // 결과
    win: (e, o, t) => {
      const s = 0.09;
      for (let i = 0; i < 3; i++) tone(e, o, t + s * i, { wave: 'p25', f: N('G5'), d: s * 0.85, v: 0.1 });
      tone(e, o, t + s * 3, { wave: 'p25', f: N('C6'), d: 0.45, v: 0.11, sus: 0.8 });
      tone(e, o, t + s * 3, { wave: 'p12', f: N('E5'), d: 0.45, v: 0.06, sus: 0.8 });
      tone(e, o, t + s * 3, { wave: 'tri', f: N('C4'), d: 0.48, v: 0.16, sus: 0.8 });
    },
    lose: (e, o, t) => {
      ['G4', 'E4', 'C4'].forEach((n, i) => tone(e, o, t + i * 0.16, { wave: 'p25', f: N(n), d: 0.15, v: 0.09 }));
      tone(e, o, t + 0.48, { wave: 'p25', f: N('A3'), f2: N('G#3'), d: 0.6, v: 0.09, sus: 0.8 });
      tone(e, o, t + 0.48, { wave: 'tri', f: N('A2'), d: 0.7, v: 0.16, sus: 0.8 });
    },
    drop: (e, o, t) => {                       // 새 전리품 — 반짝
      tone(e, o, t, { wave: 'p12', f: N('E6'), d: 0.06, v: 0.14 });
      tone(e, o, t + 0.06, { wave: 'p12', f: N('B6'), d: 0.12, v: 0.14 });
      tone(e, o, t + 0.06, { wave: 'sine', f: N('E7'), d: 0.16, v: 0.07 });
    },
    stone: (e, o, t) => {                      // 분해되어 강화석 — 짤랑
      tone(e, o, t, { wave: 'tri', f: 1480, d: 0.05, v: 0.2 });
      tone(e, o, t + 0.015, { wave: 'p25', f: 2200, d: 0.03, v: 0.07 });
    },
    levelUp: (e, o, t) => arp(e, o, t, ['C5', 'E5', 'G5', 'C6', 'E6'], 0.06, { wave: 'p25', d: 0.09, v: 0.13, last: 0.32 }),
    rankUp: (e, o, t) => {
      arp(e, o, t, ['C5', 'E5', 'G5', 'C6'], 0.07, { wave: 'p25', d: 0.1, v: 0.09 });
      arp(e, o, t + 0.3, ['D5', 'F#5', 'A5', 'D6'], 0.07, { wave: 'p25', d: 0.1, v: 0.09 });
      tone(e, o, t + 0.6, { wave: 'p25', f: N('G6'), d: 0.55, v: 0.1, sus: 0.8 });
      tone(e, o, t + 0.6, { wave: 'p12', f: N('B5'), d: 0.55, v: 0.06, sus: 0.8 });
      tone(e, o, t + 0.6, { wave: 'tri', f: N('G3'), d: 0.6, v: 0.16, sus: 0.8 });
    },
    pathOpen: (e, o, t) => {
      arp(e, o, t, ['G5', 'C6', 'E6', 'G6'], 0.08, { wave: 'p25', d: 0.1, v: 0.09, last: 0.5 });
      tone(e, o, t + 0.24, { wave: 'tri', f: N('C4'), d: 0.6, v: 0.15, sus: 0.8 });
    },
    unlock: (e, o, t) => {                     // 특수장비 칸이 열림 — 신비하게
      arp(e, o, t, ['E6', 'B6', 'G#6', 'E7'], 0.07, { wave: 'p12', d: 0.12, v: 0.1, last: 0.5 });
      tone(e, o, t, { wave: 'tri', f: N('E4'), d: 0.8, v: 0.16, sus: 0.7 });
    },
    enhanceOk: (e, o, t) => {
      arp(e, o, t, ['G5', 'D6', 'G6'], 0.07, { wave: 'tri', d: 0.1, v: 0.16, last: 0.35 });
      noise(e, o, t + 0.14, { type: 'highpass', f: 7000, d: 0.25, v: 0.05 });
    },
    enhanceFail: (e, o, t) => {                // 깨지는 소리
      noise(e, o, t, { f: 1400, f2: 300, d: 0.3, v: 0.5 });
      tone(e, o, t, { wave: 'p50', f: 360, f2: 90, d: 0.25, v: 0.2 });
    },
    equip: (e, o, t) => {
      tone(e, o, t, { wave: 'p25', f: 760, d: 0.03, v: 0.16 });
      tone(e, o, t + 0.03, { wave: 'p25', f: 980, d: 0.04, v: 0.14 });
      noise(e, o, t, { type: 'highpass', f: 5000, d: 0.03, v: 0.12 });
    },
    unequip: (e, o, t) => tone(e, o, t, { wave: 'p25', f: 900, f2: 600, d: 0.06, v: 0.15 }),
    commit: (e, o, t) => {
      tone(e, o, t, { wave: 'tri', f: N('C6'), d: 0.06, v: 0.18 });
      tone(e, o, t + 0.06, { wave: 'tri', f: N('G6'), d: 0.12, v: 0.18 });
    },

    // 여정의 끝
    gameOver: (e, o, t) => {
      ['A4', 'G4', 'F4'].forEach((n, i) => tone(e, o, t + i * 0.28, { wave: 'p25', f: N(n), d: 0.26, v: 0.08, sus: 0.8 }));
      tone(e, o, t + 0.84, { wave: 'p25', f: N('E4'), d: 0.9, v: 0.08, sus: 0.8 });
      ['A2', 'F2', 'E2'].forEach((n, i) => tone(e, o, t + i * 0.42, { wave: 'tri', f: N(n), d: i === 2 ? 0.9 : 0.4, v: 0.16, sus: 0.85 }));
    },
    victory: (e, o, t) => {                    // 모든 격을 넘어섰다 — 올라가는 분산화음 끝에 길게
      const s = 0.12;
      // [음, 시작 칸, 길이(칸)]
      [['C5', 0, 1], ['G4', 1, 1], ['C5', 2, 1], ['E5', 3, 1], ['G5', 4, 2], ['E5', 6, 1], ['G5', 7, 1]]
        .forEach(([n, at, len]) => tone(e, o, t + s * at, { wave: 'p25', f: N(n), d: s * len * 0.85, v: 0.1 }));
      tone(e, o, t + s * 8, { wave: 'p25', f: N('C6'), d: 1.2, v: 0.11, sus: 0.8 });
      tone(e, o, t + s * 8, { wave: 'p12', f: N('E5'), d: 1.2, v: 0.06, sus: 0.8 });
      tone(e, o, t + s * 8, { wave: 'tri', f: N('C3'), d: 1.25, v: 0.17, sus: 0.85 });
    }
  };

  // 끝맺는 소리가 나는 동안은 배경음을 잠깐 낮춥니다 (초)
  const JINGLE = { win: 0.8, lose: 1.2, levelUp: 0.7, rankUp: 1.2, pathOpen: 1.0, unlock: 1.0, zoneMove: 0.8, gameOver: 2.0, victory: 2.6 };
  // 전투 중 한 줄마다 나는 소리 — BATTLE_LEVEL 로 따로 낮춥니다
  const BATTLE = new Set(['hit', 'crit', 'harm', 'foeHit', 'foeCrit', 'miss', 'block', 'heal', 'special']);
  const outFor = (e, name) => BATTLE.has(name) ? e.battle : e.sfx;

  // ---------- 배경음 ----------
  // 한 칸 = 16분음표. 음 이름은 그 칸에서 새로 치는 음, - 는 앞 음을 끄는 칸, . 은 쉼표, | 는 마디(읽기 편하라고).
  // 북은 k(큰북) · s(작은북) · h(닫힌 심벌) · o(열린 심벌).
  // 파트마다 길이가 달라도 됩니다 — 짧은 파트는 제 길이로 되풀이됩니다.
  const rep = (s, n) => Array.from({ length: n }, () => s).join(' | ');

  // --- 초기 화면 · 「낡은 지도」 — 가단조, 느리게. 흐르는 분산화음 위에 긴 선율 ---
  const T_AM = 'A3 C4 E4 A4 C5 A4 E4 C4 A3 C4 E4 A4 C5 A4 E4 C4';
  const T_F  = 'F3 A3 C4 F4 A4 F4 C4 A3 F3 A3 C4 F4 A4 F4 C4 A3';
  const T_C  = 'C4 E4 G4 C5 E5 C5 G4 E4 C4 E4 G4 C5 E5 C5 G4 E4';
  const T_G  = 'G3 B3 D4 G4 B4 G4 D4 B3 G3 B3 D4 G4 B4 G4 D4 B3';
  const T_E  = 'E3 G#3 B3 E4 G#4 E4 B3 G#3 E3 G#3 B3 E4 G#4 E4 B3 G#3';
  const bassWhole = n => `${n} - - - - - - - ${n} - - - - - - -`;

  // --- 여정 · 「떠나는 길」 — 다장조, 걷는 빠르기 ---
  const F_C  = 'C4 - E4 - G4 - E4 - C4 - E4 - G4 - E4 -';
  const F_AM = 'A3 - C4 - E4 - C4 - A3 - C4 - E4 - C4 -';
  const F_F  = 'F3 - A3 - C4 - A3 - F3 - A3 - C4 - A3 -';
  const F_G  = 'G3 - B3 - D4 - B3 - G3 - B3 - D4 - B3 -';
  const F_FG = 'F3 - A3 - C4 - A3 - G3 - B3 - D4 - B3 -';
  const F_EM = 'E3 - G3 - B3 - G3 - E3 - G3 - B3 - G3 -';
  const F_DM = 'D3 - F3 - A3 - F3 - D3 - F3 - A3 - F3 -';
  const B_C  = 'C3 - - - G2 - - - C3 - - - G2 - - -';
  const B_AM = 'A2 - - - E2 - - - A2 - - - E2 - - -';
  const B_F  = 'F2 - - - C3 - - - F2 - - - C3 - - -';
  const B_G  = 'G2 - - - D3 - - - G2 - - - D3 - - -';
  const B_FG = 'F2 - - - C3 - - - G2 - - - D3 - - -';
  const B_EM = 'E2 - - - B2 - - - E2 - - - B2 - - -';
  const B_DM = 'D3 - - - A2 - - - D3 - - - A2 - - -';
  const F_BEAT = 'k . h . s . h . k . h . s . h .';
  const F_FILL = 'k . h . s . h . k . h . s . s s';

  // --- 보스 · 「격」 — 마단조, 빠르게. 몰아치는 베이스 ---
  const X_EM = 'E2 - E2 - E3 - E2 - E2 - E3 - E2 - D3 -';
  const X_C  = 'C2 - C2 - C3 - C2 - C2 - C3 - C2 - B2 -';
  const X_D  = 'D2 - D2 - D3 - D2 - D2 - D3 - F#2 - D3 -';
  const X_B  = 'B1 - B1 - B2 - B1 - B1 - B2 - D#2 - F#2 -';
  const H_EM = 'G4 - - - - - - - B4 - - - - - - -';
  const H_C  = 'G4 - - - - - - - E4 - - - - - - -';
  const H_D  = 'F#4 - - - - - - - A4 - - - - - - -';
  const H_B  = 'F#4 - - - - - - - D#4 - - - - - - -';
  const X_BEAT = 'k . h k s . h . k k h . s . h h';
  const X_FILL = 'k . h . s . h . s . s s s s s s';

  const SONGS = {
    title: { bpm: 80, tracks: [
      { wave: 'p12', v: 0.032, sus: 0.5, notes: [T_AM, T_F, T_C, T_G, T_AM, T_F, T_E, T_E].join(' | ') },
      { wave: 'p25', v: 0.06, sus: 0.8, notes: [
        'E5 - - - - - - - D5 - - - C5 - - -',
        'C5 - - - - - - - - - - - A4 - - -',
        'G4 - - - - - - - C5 - - - E5 - - -',
        'D5 - - - - - - - - - - - - - - -',
        'E5 - - - - - - - F5 - - - E5 - - -',
        'C5 - - - - - - - A4 - - - - - - -',
        'B4 - - - - - - - G#4 - - - B4 - - -',
        'E5 - - - - - - - - - - - . . . .'
      ].join(' | ') },
      { wave: 'tri', v: 0.12, sus: 0.85, notes: ['A2', 'F2', 'C3', 'G2', 'A2', 'F2', 'E2', 'E2'].map(bassWhole).join(' | ') }
    ] },

    field: { bpm: 116, tracks: [
      { wave: 'p25', v: 0.065, sus: 0.75, notes: [
        'E5 - - - G5 - A5 - G5 - - - E5 - - -',
        'C5 - - - - - D5 - E5 - - - A4 - - -',
        'F5 - - - E5 - D5 - C5 - - - A4 - - -',
        'B4 - - - C5 - D5 - G4 - - - - - - -',
        'E5 - - - G5 - A5 - C6 - - - B5 - A5 -',
        'G5 - - - E5 - - - A5 - G5 - E5 - - -',
        'F5 - - - A5 - - - G5 - - - B4 - D5 -',
        'C5 - - - - - - - - - - - . . . .',
        'A5 - - - G5 - F5 - E5 - - - F5 - - -',
        'D5 - - - E5 - F5 - G5 - - - - - . .',
        'G5 - - - E5 - D5 - B4 - - - E5 - - -',
        'C5 - - - B4 - C5 - A4 - - - - - . .',
        'F5 - - - A5 - - - D5 - - - F5 - E5 -',
        'D5 - - - B4 - - - G4 - - - B4 - D5 -',
        'E5 - - - D5 - C5 - G5 - - - E5 - - -',
        'D5 - - - - - - - B4 - - - D5 - - -'
      ].join(' | ') },
      { wave: 'p12', v: 0.03, sus: 0.55, notes: [
        F_C, F_AM, F_F, F_G, F_C, F_AM, F_FG, F_C,
        F_F, F_G, F_EM, F_AM, F_DM, F_G, F_C, F_G
      ].join(' | ') },
      { wave: 'tri', v: 0.13, sus: 0.85, notes: [
        B_C, B_AM, B_F, B_G, B_C, B_AM, B_FG, B_C,
        B_F, B_G, B_EM, B_AM, B_DM, B_G, B_C, B_G
      ].join(' | ') },
      { drum: true, v: 0.55, notes: [rep(F_BEAT, 7), F_FILL, rep(F_BEAT, 7), F_FILL].join(' | ') }
    ] },

    boss: { bpm: 150, tracks: [
      { wave: 'p25', v: 0.07, sus: 0.75, notes: [
        'E5 - - . G5 - - . F#5 - E5 - D5 - B4 -',
        'E5 - - - - - - - . . B4 - D5 - E5 -',
        'G5 - - . F#5 - - . E5 - D5 - C5 - D5 -',
        'A4 - - - - - - - D5 - - - F#5 - - -',
        'E5 - - . G5 - - . B5 - A5 - G5 - F#5 -',
        'G5 - - - E5 - - - . . E5 - F#5 - G5 -',
        'A5 - - . G5 - - . F#5 - E5 - D5 - E5 -',
        'F#5 - - - - - - - D#5 - - - B4 - - -'
      ].join(' | ') },
      { wave: 'p12', v: 0.035, sus: 0.7, notes: [H_EM, H_EM, H_C, H_D, H_EM, H_EM, H_C, H_B].join(' | ') },
      { wave: 'tri', v: 0.14, sus: 0.8, notes: [X_EM, X_EM, X_C, X_D, X_EM, X_EM, X_C, X_B].join(' | ') },
      { drum: true, v: 0.6, notes: [rep(X_BEAT, 7), X_FILL].join(' | ') }
    ] }
  };

  // 악보 → 칸마다 { 음, 길이 }
  const compiled = {};
  function compile(name) {
    if (compiled[name]) return compiled[name];
    const def = SONGS[name];
    const tracks = def.tracks.map(tr => {
      const toks = tr.notes.split(/\s+/).filter(x => x && x !== '|');
      const ev = toks.map((tk, i) => {
        if (tk === '-' || tk === '.') return null;
        let len = 1;
        while (i + len < toks.length && toks[i + len] === '-') len++;
        return { n: tk, f: tr.drum ? 0 : N(tk), len };
      });
      return { ...tr, ev, steps: toks.length };
    });
    compiled[name] = { bpm: def.bpm, tracks, steps: Math.max(...tracks.map(t => t.steps)) };
    return compiled[name];
  }

  function drum(e, out, t, kind, v) {
    if (kind === 'k') tone(e, out, t, { wave: 'sine', f: 150, f2: 45, d: 0.16, v: v * 0.55 });
    else if (kind === 's') {
      noise(e, out, t, { f: 1900, q: 0.7, d: 0.13, v: v * 0.22 });
      tone(e, out, t, { wave: 'tri', f: 190, f2: 140, d: 0.07, v: v * 0.12 });
    }
    else if (kind === 'h') noise(e, out, t, { type: 'highpass', f: 7500, d: 0.035, v: v * 0.08 });
    else if (kind === 'o') noise(e, out, t, { type: 'highpass', f: 6500, d: 0.16, v: v * 0.07 });
  }

  // 한 칸을 칩니다 — 파트마다 제 길이로 되풀이
  function playStep(e, out, song, step, t, spb) {
    for (const tr of song.tracks) {
      const ev = tr.ev[step % tr.steps];
      if (!ev) continue;
      if (tr.drum) drum(e, out, t, ev.n, tr.v);
      else if (ev.f) tone(e, out, t, { wave: tr.wave, f: ev.f, d: ev.len * spb * 0.9, v: tr.v, sus: tr.sus });
    }
  }

  function startSong(name) {
    stopSong();
    if (!SONGS[name]) return;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(1, ac.currentTime + 0.6);
    g.connect(eng.bgm);
    cur = { name, song: compile(name), gain: g, step: 0, next: ac.currentTime + 0.1 };
    cur.timer = setInterval(pump, 25);
    pump();
  }

  // 조금 앞까지 미리 악보를 걸어둡니다 — 타이머가 늦게 깨도 박자가 흔들리지 않게
  function pump() {
    if (!cur || !ac || ac.state !== 'running') return;
    const spb = 60 / cur.song.bpm / 4;
    if (cur.next < ac.currentTime - 0.05) cur.next = ac.currentTime + 0.02;   // 한참 밀렸으면 지금부터
    while (cur.next < ac.currentTime + 0.15) {
      playStep(eng, cur.gain, cur.song, cur.step, cur.next, spb);
      cur.next += spb;
      cur.step = (cur.step + 1) % cur.song.steps;
    }
  }

  function stopSong() {
    if (!cur) return;
    clearInterval(cur.timer);
    const g = cur.gain, t = ac.currentTime;
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(Math.max(0.0001, g.gain.value), t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
    setTimeout(() => { try { g.disconnect(); } catch (e) { /* 이미 끊김 */ } }, 700);
    cur = null;
  }

  // ---------- 켜고 끄기 ----------
  function applyPrefs() {
    if (!eng) return;
    eng.sfx.gain.value = prefs.sfx ? SFX_LEVEL : 0;
    eng.bgm.gain.value = prefs.bgm ? BGM_LEVEL : 0;
  }

  function duck(sec) {
    if (!eng || !prefs.bgm) return;
    const g = eng.bgm.gain, t = ac.currentTime;
    g.cancelScheduledValues(t);
    g.setValueAtTime(g.value, t);
    g.linearRampToValueAtTime(BGM_LEVEL * 0.3, t + 0.05);
    g.setValueAtTime(BGM_LEVEL * 0.3, t + sec);
    g.linearRampToValueAtTime(BGM_LEVEL, t + sec + 0.5);
  }

  // 첫 입력에서 소리를 깨웁니다. 그 뒤로도 입력마다 불려서, 잠든 소리를 다시 깨웁니다.
  function wake() {
    try {
      if (!ac) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ac = new AC({ latencyHint: 'interactive' });
        eng = makeEngine(ac);
        applyPrefs();
      }
      if (ac.state === 'suspended' && !document.hidden) ac.resume();
      if (want && prefs.bgm && (!cur || cur.name !== want)) startSong(want);
    } catch (e) { /* 소리가 안 되는 환경 — 조용히 넘어갑니다 */ }
  }
  for (const ev of ['pointerdown', 'keydown', 'touchend']) document.addEventListener(ev, wake, true);

  // 화면을 끄거나 다른 앱으로 가면 재웁니다 — 주머니 속에서 음악이 흐르면 곤란하니까요
  document.addEventListener('visibilitychange', () => {
    if (!ac) return;
    if (document.hidden) ac.suspend();
    else ac.resume();
  });

  function play(name, opts) {
    if (!prefs.sfx || !ac || ac.state !== 'running') return;
    const fn = SFX[name];
    if (!fn) return;
    const now = ac.currentTime;
    if (lastPlayed[name] && now - lastPlayed[name] < 0.03) return;
    lastPlayed[name] = now;
    const delay = (opts && opts.delay) || 0;
    try { fn(eng, outFor(eng, name), now + 0.01 + delay); } catch (e) { /* 한 소리가 실패해도 게임은 계속 */ }
    if (JINGLE[name]) duck(JINGLE[name] + delay);
  }

  function music(name) {
    want = name || null;
    if (!ac || !prefs.bgm) return;
    if (!want) { stopSong(); return; }
    if (cur && cur.name === want) return;
    startSong(want);
  }

  function get(key) { return !!prefs[key]; }

  function set(key, on) {
    prefs[key] = !!on;
    try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch (e) { /* 저장 못 해도 이번엔 적용 */ }
    if (!eng) return;
    applyPrefs();
    if (key === 'bgm') {
      if (on) music(want);
      else stopSong();
    }
  }

  // 시험용 — 실제로 소리를 내지 않고 계산만 해서 가장 큰 값과 평균 크기를 잽니다.
  // (소리가 찢어지지 않는지, 효과음과 배경음의 크기가 맞는지 확인할 때 씁니다)
  async function measure(kind, name, sec) {
    const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const c = new OAC(1, Math.ceil(44100 * sec), 44100);
    const e = makeEngine(c);
    e.sfx.gain.value = SFX_LEVEL;
    e.bgm.gain.value = BGM_LEVEL;
    if (kind === 'sfx') SFX[name](e, outFor(e, name), 0.01);
    else {
      const song = compile(name);
      const spb = 60 / song.bpm / 4;
      for (let s = 0, t = 0.01; t < sec; s++, t += spb) playStep(e, e.bgm, song, s % song.steps, t, spb);
    }
    const buf = await c.startRendering();
    const d = buf.getChannelData(0);
    let peak = 0, sum = 0;
    for (let i = 0; i < d.length; i++) { const a = Math.abs(d[i]); if (a > peak) peak = a; sum += d[i] * d[i]; }
    return { peak: Math.round(peak * 1000) / 1000, rms: Math.round(Math.sqrt(sum / d.length) * 10000) / 10000 };
  }

  return {
    play, music, get, set, measure,
    // 지금 상태 — 시험 · 관리자 도구용
    status: () => ({ ctx: ac ? ac.state : 'none', song: cur ? cur.name : null, want, prefs: { ...prefs } }),
    names: () => ({ sfx: Object.keys(SFX), songs: Object.keys(SONGS) }),
    songInfo: name => { const s = compile(name); return { bpm: s.bpm, steps: s.steps, tracks: s.tracks.map(t => t.steps), seconds: Math.round(s.steps * 60 / s.bpm / 4 * 10) / 10 }; }
  };
})();

</script>
<script>
// ============================================================
//  data.js  —  게임 데이터와 수식
//  숫자 밸런스를 바꾸고 싶으면 이 파일만 고치면 됩니다.
//
//  컨셉: 지구의 신화와 역사에 이름을 남긴 존재들의 "화신"과 싸운다.
//        길을 떠나면 그 지역의 화신이 무작위로 나타난다.
//        보스는 길 끝의 정해진 자리에 늘 서 있다. 물러설 수 없다.

// ---------- 기운(aura) ----------
// 가끔 화신이 이상한 기운을 두르고 나타납니다.

// 이 게임에서 도파민을 담당하는 장치입니다.
// color 는 양피지 위의 잉크색입니다 — 알림 띠의 바탕과 이름 글씨에 그대로 씁니다.
const AURAS = [
  { id: 'gold',   name: '황금빛', color: '#8a6400', desc: '경험치 ×2',            weight: 38, xpMult: 2,  dropMult: 1 },
  { id: 'violet', name: '보랏빛', color: '#6a2c8f', desc: '전리품 ×2',            weight: 26, xpMult: 1,  dropMult: 2 },
  { id: 'burn',   name: '불타는', color: '#b03a12', desc: '경험치 ×5',            weight: 20, xpMult: 5,  dropMult: 1 },
  { id: 'omen',   name: '전조의', color: '#1f5a96', desc: '경험치 ×3 · 전리품 ×2', weight: 11, xpMult: 3,  dropMult: 2 },
  { id: 'myth',   name: '신화의', color: '#2a6e27', desc: '경험치 ×10 · 전리품 ×3', weight: 5,  xpMult: 10, dropMult: 3 }
];

const AURA_TOTAL_WEIGHT = AURAS.reduce((s, a) => s + a.weight, 0);

function rollAura() {
  if (Math.random() >= RULES.AURA_CHANCE) return null;
  let r = Math.random() * AURA_TOTAL_WEIGHT;
  for (const a of AURAS) {
    r -= a.weight;
    if (r <= 0) return a;
  }
  return AURAS[0];
}

// ============================================================
//  전투 수식
// ============================================================

// 실제로 들어가는 피해량.
//   공격력 = 방어력  →  50% 감소
//   방어력이 공격력의 2배  →  66.7% 감소
// 방어력이 아무리 높아도 0이 되진 않는 수확체감 곡선.
function damageFormula(attack, defense) {
  return (attack * attack) / (attack + defense);
}

// ---------- 민첩에서 파생되는 것들 ----------
//
// 승률이 100% 아니면 0% 로만 나오면 게임이 재미없습니다. 긴 전투에서는
// 피해량 편차(±15%)가 평균으로 수렴해서 시작 전에 승패가 정해지기 때문입니다.
// 그래서 원작(Resolute Hero)처럼 **확률 발동** 요소를 넣습니다.
// 빗나가느냐, 크리가 터지느냐 — 이 두 개가 판을 뒤집습니다.

// 크리티컬 확률. 로그 스케일이라 스탯을 열 배 올려야 몇 %p 오릅니다.
// 민첩이 주력이고 행운은 그 절반 이하입니다 — 행운은 전리품이 본업이니까요.
// 장비의 '크리 확률' 특수 능력치가 여기 그대로 더해집니다.
// num() 은 적처럼 특수 능력치가 아예 없는 쪽을 위한 안전망입니다.
// 하나라도 undefined 가 새면 NaN 이 전투식 전체를 먹어치웁니다.
function num(v) { return Number.isFinite(v) ? v : 0; }

function critChance(dex, luck, bonus) {
  const raw = 0.10
    + 0.035 * Math.log10(Math.max(1, num(dex)))
    + 0.015 * Math.log10(Math.max(1, num(luck)))
    + num(bonus);
  return Math.min(0.75, raw);
}

// 크리티컬 배수. 기본 2배에서 시작해 민첩 열 배마다 +0.15.
function critDamage(dex) {
  return 2.0 + 0.15 * Math.log10(Math.max(1, num(dex)));
}

// 회피율. 민첩이 같으면 29%, 아무리 앞서도 58%를 넘지 않습니다.
// (크리 일부를 행운에 넘겨준 대신 민첩은 회피를 더 가져갑니다.)
function dodgeChance(myDex, foeDex) {
  return 0.58 * myDex / (myDex + foeDex);
}

// 명중률 = 1 − 상대 회피율. 민첩이 같으면 71%.
function hitChance(attackerDex, defenderDex) {
  return 1 - dodgeChance(defenderDex, attackerDex);
}

// 관통은 상대 방어력을 그만큼 깎고 때립니다.
function piercedDefense(def, pierce) {
  return def * (1 - Math.min(0.9, num(pierce)));
}

// 한 턴에 기대되는 평균 피해량. 승률 예측의 지름길 판정에 씁니다.
// a = 때리는 쪽, d = 맞는 쪽 (둘 다 스탯 객체)
function expectedTurnDamage(a, d) {
  const base = damageFormula(a.damage, piercedDefense(d.defense, a.pierce));
  const hit = hitChance(a.dex, d.dex) * (1 - Math.min(0.9, num(d.block)));
  const c = critChance(a.dex, a.luck, a.critRate);
  const multi = 1 + Math.min(0.9, num(a.doubleHit));   // 이중타격은 평균 타수를 늘립니다
  // 일격은 그 한 방만 10배이고 크리가 안 터집니다 — 한 방의 기댓값을 둘로 나눠 섞습니다
  const h = Math.min(1, num(a.harmTouch));
  const perSwing = (1 - h) * (1 + c * (critDamage(a.dex) - 1)) + h * HARM_TOUCH_MULT;
  const turns = 1 + Math.min(0.9, num(a.doubleTurn));  // 연속 턴은 한 턴에 움직이는 횟수를 늘립니다
  return base * hit * multi * perSwing * turns;
}

// 일격 한 방의 배수 (원작 Resolute Hero 의 Harm Touch 와 같습니다)
const HARM_TOUCH_MULT = 10;

// ---------- 스탯 곡선 ----------

// 장비를 제외한, 레벨에서 오는 영웅의 순수 스탯.
// 상수항은 Lv.1 근처에서만 의미가 있습니다. 이게 없으면 첫 조우부터 확정 패배라
// 시작이 너무 험합니다. 레벨이 조금만 올라도 곧 무시됩니다.
// 네 스탯 전부 레벨에 **선형**입니다. 이게 승률이 0%/100% 로만 갈리지 않는
// 가장 큰 이유라, 지수를 함부로 올리면 안 됩니다.
//
//   생명 지수 > 공격 지수  →  레벨이 오를수록 전투가 길어집니다.
//   길어지면 운이 평균으로 수렴해서 승패가 시작 전에 결정됩니다.
//   (지수를 1.85 / 1.5 로 뒀을 때 Lv.10억 전투가 1,800턴이었습니다.)
//
// 전부 같은 지수로 맞추면 전투 길이가 전 구간 아홉 턴 안팎으로 고정되고,
// 빗나감과 크리 한 방이 실제로 판을 뒤집습니다.
//
// 숫자가 작아 보일까 걱정할 필요는 없습니다 — 레벨이 100억까지 가므로
// 최종 구간 생명은 1,800억이 됩니다.
// 레벨에서 저절로 오르는 부분은 **절반뿐**입니다.
// 나머지 절반은 아래 분배 포인트로 직접 찍습니다.
function heroBaseStats(level) {
  return {
    life:    Math.round(60 + 9   * level),
    damage:  Math.round(10 + 1.6 * level),
    defense: Math.round( 4 + 1.0 * level),
    dex:     Math.round( 4 + 1.3 * level),
    luck:    Math.round( 4 + 0.8 * level)
  };
}

// ---------- 스탯 분배 ----------
// 레벨당 10 포인트. 레벨이 억 단위까지 가므로 포인트도 수십억이 됩니다
// (Inflation RPG 에서 한 번에 수천 포인트씩 찍는 그 감각).
//
// **한 번 찍은 건 그대로 남습니다.** 비율은 "앞으로 들어올 포인트를 어떻게
// 나눌지" 를 정하는 규칙일 뿐이고, 이미 찍힌 스탯을 건드리지 않습니다.
// 레벨업으로 새 포인트가 생기면 그때 그 비율대로 들어갑니다.
const POINTS_PER_LEVEL = 10;

// 포인트 하나가 주는 양. 네 곳에 고르게 찍으면 예전 곡선과 정확히 같아집니다
// (생명 18L · 공격 3.2L · 방어 2.0L · 민첩 2.6L).
// 한 곳에 몰면 그 스탯만 최대 4배까지 갑니다 — 대신 나머지는 절반만 남습니다.
const POINT_VALUE = { life: 3.6, damage: 0.64, defense: 0.40, dex: 0.52, luck: 0.32 };

const STAT_KEYS = ['life', 'damage', 'defense', 'dex', 'luck'];

// desc 는 분배 창에 이름 밑으로 붙습니다. 이름만으로 무엇을 하는지 알 수 없는 것에만 적습니다.
const STAT_INFO = [
  { id: 'life',    name: '생명',   desc: '' },
  { id: 'damage',  name: '공격력', desc: '' },
  { id: 'defense', name: '방어력', desc: '' },
  { id: 'dex',     name: '민첩',   desc: '회피 · 명중 · 크리티컬' },
  { id: 'luck',    name: '행운',   desc: '전리품 · 약간의 크리티컬' }
];

// 적 스탯. 영웅과 거의 같되 조금씩 약합니다.
// → 같은 레벨이면 영웅이 유리합니다. 다만 확정은 아닙니다 (대략 75%).
function enemyStats(level, lifeMult = 1) {

    life:    Math.round((40 + 17  * level) * lifeMult),

// ---------- 격이 높을수록 단단하다 ----------
// 화신 구간(제7격 설화)부터는 레벨이 같아도 격이 높을수록 생명·공격·방어가 더 높습니다.
//
// 이게 없으면 전리품이 레벨을 따라 같이 커져서, 한 번 앞서기 시작하면
// 위쪽 격이 힘으로는 전혀 막지 못합니다. 『격을 삼키는 검』으로 에너지가 붙은 뒤로는
// 한 회차에 한 지역씩 그냥 지나갑니다 (시뮬에서 제7격~제15격을 여섯 회차 만에 통과).
// 격을 넷이나 늘렸는데도 게임이 길어지지 않았던 이유가 이것이었습니다.
//
// **전리품 성능에는 곱하지 않습니다** (makeItemStats 는 enemyStats 를 그대로 씁니다).
// 그래야 위로 갈수록 부위 강화와 레벨이 더 필요해집니다.
// 민첩은 건드리지 않습니다 — 명중·회피가 흔들리면 승률 곡선이 통째로 바뀝니다.
// 행운은 전리품 생성의 기준값이라 역시 그대로 둡니다.
//
// 앞의 여섯 격(마물 구간)은 건드리지 않습니다. 거기까지 보정을 걸었더니
// 『격을 삼키는 검』을 얻기 전인 마족·마왕에서 수십 회차씩 막혔습니다.
// 아자토스도 빼고 FINAL_BOSS_MULT 로 따로 맞춥니다.
//
// 시뮬 8판 (부위 강화 · 격 15개):
//   격 하나당  0       → 평균 40회차 클리어 (제7격부터 전력 질주)
//              0.10    → 60회차
//              0.15    → 96회차 (88~104)
//   0.15 그대로, +11~+15 를 비싸고 세게 바꾼 뒤 → 85회차 (77~94)
//   특수장비 칸 넷을 더한 뒤 0.15 → 65회차 (61~72) — 위쪽 격 유물이 세서 후반이 빨라졌습니다
//                            0.18 → 82회차 (74~86)
//                            0.19 → 따로 재지 않았습니다 (앞뒤 값으로 보아 90회차 안팎)
//                            0.20 → 102회차, 다만 제13·14격에서 열몇 회차씩 막힙니다
//   정예·히든·보스 전리품 배수를 1.4·1.6·1.8 로 낮춘 뒤
//                            0.19 → 136회차 (124~145, 4판) — 제12→13격에서 25회차씩 막힘
//                            0.16 → 104회차 (95~110, 4판) — 후반 벽이 지역당 10회차 안팎으로
//                            0.17 + 초반(제3~6격) 10% 약하게 → 101회차 (99~104, 4판)   ← 지금
//   (그 뒤 세트 · 도감 · 새 능력치가 들어오면서 줄어든 만큼은 경험치 계수로 되돌렸습니다 — enemyBaseXp)
const RANK_TOUGHNESS = 0.17;
const TOUGH_FROM_RANK = 7;     // 제7격 ×1.17, 제10격 ×1.68, 제15격 ×2.53

// 앞쪽은 거꾸로 — 제3~6격(마수 · 환수 · 마족 · 마왕)은 같은 레벨이어도 10% 약합니다.
// 정예·보스 전리품 배수를 낮춘 뒤로 초반에 끼울 만한 장비가 약해져서,
// 제3격 보스 앞에서 열몇 회차씩 막혔습니다 (제4격 도착 7 → 23회차).
// 그 구간만 풀었습니다. 처음 두 격은 원래 쉬워서 건드리지 않습니다.
//   10% → 제4격 15회차 · 제6격 33회차   15% → 13 · 28회차 (대신 제12→13격이 19회차로 막힘)
//   (경험치 계수를 0.8 로 낮춘 뒤 초반이 다시 느려져서 15% 로 올렸습니다.
//    4판: 제4격 17회차 · 제6격 32회차 · 클리어 90회차 — 대신 제12→13격이 15회차로 길어짐)
const EARLY_SOFTEN = 0.15;
const SOFT_RANKS = [3, 6];

function rankToughness(n) {
  if (n >= SOFT_RANKS[0] && n <= SOFT_RANKS[1]) return 1 - EARLY_SOFTEN;
  return 1 + RANK_TOUGHNESS * Math.max(0, n - TOUGH_FROM_RANK + 1);
}

function toughen(s, rankN, isFinal) {
  if (isFinal) return s;
  const t = rankToughness(rankN);
  s.life    = Math.round(s.life    * t);
  s.damage  = Math.round(s.damage  * t);
  s.defense = Math.round(s.defense * t);
  return s;
}

// ---------- 마지막 하나만은 다릅니다 ----------
// 아자토스도 원래는 다른 보스와 똑같은 식(생명 ×1.3)을 썼습니다. 그랬더니
// 최강 장비를 갖춘 Lv.100억 영웅이 **0.7턴에** 눕혀서 승률이 어느 레벨에서든
// 100% 였습니다. 한 턴에 끝나니 빗나감도 크리도 개입할 틈이 없었습니다.
// (맨몸이면 보스 레벨에서도 28% 였으니, 전투식이 아니라 장비가 문제였습니다.)
//
// 이 값을 정할 때 함정이 하나 있습니다. **아자토스 본인이 떨구는 전리품**
// (만물을 가르는 칼날 · 무(無)의 갑주 · 백치의 왕관) 이 게임에서 제일 좋은데,
// 그건 그를 이겨야 얻습니다. 그걸 낀 영웅으로 재면 승률이 두 배 넘게 부풀어
// 실제로는 닿을 수 없는 난이도가 나옵니다. 아래 숫자는 **그 셋을 빼고** 잰 값입니다.
//
// 그리고 이 싸움을 가르는 건 장비가 아니라 **레벨**입니다. 그의 스탯은 고정인데
// 영웅은 레벨로 계속 자라서, 강화를 몇까지 올렸느냐보다 그를 얼마나 넘어섰느냐가
// 승패를 정합니다. 시뮬에서는 그의 레벨을 1.4~1.9배 넘어선 즈음에 쓰러뜨립니다.
//
// 격이 열다섯으로 늘면서 제15격 화신들이 ×2.35~2.62 로 단단해졌습니다 (RANK_TOUGHNESS).
// 그 탓에 마지막 지역에서 레벨을 올리기가 훨씬 어려워져서, 옛 값
// (생명 5 · 공격 1.6 · 방어 3.0) 그대로는 마지막 벽이 백 회차를 넘겼습니다.
// 생명·공격·방어를 0.8배로 낮춘 지금 값에서 마지막 지역 도착 → 클리어가 약 11회차입니다.
//   아자토스 ×1.00 → 마지막 벽 무한  ·  ×0.85 → 26회차  ·  ×0.80 → 18회차
//   (여기까지는 +11~+15 가 지금보다 약하던 때. 그 구간을 세게 바꾼 뒤 ×0.80 → 11회차,
//    특수장비를 더하고 격 보정을 0.18 로 올린 지금 → 약 8회차)
const FINAL_BOSS_MULT = { life: 4, damage: 1.28, defense: 2.4, dex: 1.5 };

function finalBossStats(level, lifeMult) {
  const s = enemyStats(level, lifeMult);
  s.life    = Math.round(s.life    * FINAL_BOSS_MULT.life);
  s.damage  = Math.round(s.damage  * FINAL_BOSS_MULT.damage);
  s.defense = Math.round(s.defense * FINAL_BOSS_MULT.defense);
  s.dex     = Math.round(s.dex     * FINAL_BOSS_MULT.dex);
  return s;   // 행운은 그대로 — 전리품 생성의 기준값이라 건드리면 드롭이 뒤틀립니다
}

// ---------- 경험치 곡선 ----------
//
// 레벨 상한이 1,000만입니다. 한 번에 한 레벨씩 오르면 평생 못 갑니다.
// 그래서 요구치 곡선을 아주 완만하게(L^0.9) 깔았습니다.
//
//   한 레벨당 요구치   xpToNext(L) = 100 * L^0.9
//   L 까지의 누적      ≈ 52.6 * L^1.9        (위 식을 적분한 값)
//   적이 주는 경험치   enemyBaseXp(L) = 11.5 * L^1.9
//
// 누적과 지수를 1.9 로 똑같이 맞춘 게 핵심입니다. 그래서
// "내 레벨의 적 한 마리 = 지금까지 모은 경험치의 11.5/52.6 ≈ 22%" 가
// 게임 전 구간에서 일정하게 유지됩니다.
//
// 그 22% 가 레벨로는 몇 칸이냐 하면 — 레벨은 누적의 1/1.9 제곱이므로
// 한 마리당 약 +11%. 즉 Lv.1,000 에서는 +110, Lv.100,000 에서는 +11,000.
// 레벨이 높아질수록 한 방에 오르는 칸수가 저절로 불어납니다.
// 레벨이 억 단위까지 가므로 한 칸씩 빼는 반복문으로는 감당이 안 됩니다.
// 누적 경험치 ↔ 레벨을 닫힌 식으로 바로 환산합니다.
//   누적(L) = (100 / 1.9) * L^1.9   →   L = (누적 * 1.9 / 100)^(1/1.9)
const XP_COEF = 100;
const XP_EXP = 1.9;

function totalXpFor(level) {
  return (XP_COEF / XP_EXP) * Math.pow(level, XP_EXP);
}

function levelFromTotalXp(total) {
  return Math.max(1, Math.floor(Math.pow(total * XP_EXP / XP_COEF, 1 / XP_EXP)));
}

// 레벨은 누적 경험치에서 역산하므로(totalXpFor / levelFromTotalXp),
// 표시용 요구치도 반드시 같은 식에서 뽑아야 합니다.
// 예전엔 여기만 따로 100*L^0.9 로 적어둬서 Lv.1 에 100 이라고 떠 있었는데
// 실제로 필요한 건 143 이었습니다 — 경험치 바가 거짓말을 하고 있었습니다.
function xpToNext(level) {
  return Math.round(totalXpFor(level + 1) - totalXpFor(level));
}

// 계수가 게임 길이를 모든 구간에 고르게 늘리고 줄이는 손잡이입니다.
// (격 보정 RANK_TOUGHNESS 는 위쪽 격만 늘리고, 올리면 특정 격에 벽이 생깁니다.)
// 격 11개 시절 기록:
//   1.0 → 25회차 클리어, 전리품 309/328
//   0.7 → 30회차에 7지역 (40회차쯤 클리어할 속도)
// 격 15개 · 부위 강화 · 특수장비 · 세트 · 도감까지 넣은 뒤 (시뮬 4판, 도감 격당 +1%):
//   1.0  → 75회차 안팎 (도감 +2% 일 때는 64)
//   0.85 → 87회차 (75~100)
//   0.8  → 지금 값 (사이)
//   0.75 → 107회차, 다만 제5→6격 · 제12→13격이 20회차씩 막힘
// 상수항 25 는 초반에만 의미가 있습니다.
//
// 이게 없으면 Lv.1 슬라임이 1 EXP 인데 Lv.2 까지 143 이 필요해서,
// 첫 판에 스물몇 마리를 잡아도 레벨이 한 번도 안 오릅니다.
// Lv.1000 에서는 50만 EXP 에 25 가 붙는 셈이라 아무 영향이 없습니다 —
// 영웅 기본 스탯의 상수항(60/10/4)과 똑같은 역할입니다.
function enemyBaseXp(level) {
  return Math.round(0.8 * Math.pow(level, 1.9) + 25);
}

// 나보다 강한 적을 잡으면 경험치 배수.
//   레벨차 3.6배에서 최대 3배, 그 아래로는 선형 감소, 최소 1배.
function underlevelBonus(heroLevel, enemyLevel) {
  const ratio = enemyLevel / Math.max(1, heroLevel);
  const mult = 1 + (ratio - 1) * (2 / 2.6);
  return Math.min(3, Math.max(1, mult));
}

const SPECIAL_KEYS = SPECIALS.map(s => s.id);
const SPECIAL_INFO = Object.fromEntries(SPECIALS.map(s => [s.id, s]));

// ---------- 장비 성격 ----------
// 성격은 **떨어뜨린 적**이 정합니다. 토르의 것은 크리 몰빵, 아이언 골렘의 것은
// 방어와 막기, 뱀파이어의 것은 흡혈 — 그래야 "잡은 놈과 어울리는" 전리품이 됩니다.
//
// tilt 는 핵심 스탯을 기울이는 배수입니다. 하나를 키우면 하나가 줄어듭니다.
// gives 는 그 성격이 붙여주는 특수 능력치입니다.
//
// 같은 부위라도 성격이 다르면 갈아끼울 이유가 생깁니다 — 방어형 신발과
// 신속형 신발 중 뭐가 나은지는 내 스탯 분배에 달렸으니까요.
//
// color 는 꼬리표의 밀랍색입니다. 위에 크림색 글씨가 얹히므로 진하게 잡았습니다.
const ARCHETYPES = {
  fierce: { name: '흉포', color: '#9b2226', tilt: { damage: 1.40, life: 0.65 },                 gives: ['critRate'],            desc: '공격과 치명타에 몰빵' },
  guard:  { name: '수호', color: '#1f5a96', tilt: { defense: 1.40, life: 1.20, damage: 0.60 },  gives: ['block'],               desc: '방어와 생명, 막기' },
  leech:  { name: '흡혈', color: '#6a2c8f', tilt: { damage: 1.20, defense: 0.75 },              gives: ['lifesteal'],           desc: '때린 만큼 회복' },
  swift:  { name: '신속', color: '#2a6e27', tilt: { dex: 1.55, damage: 0.90, life: 0.85 },      gives: ['doubleHit'],           desc: '민첩과 이중타격' },
  pierce: { name: '관통', color: '#5b6470', tilt: { damage: 1.25, defense: 0.80 },              gives: ['pierce'],              desc: '단단한 상대를 뚫는다' },
  thorn:  { name: '반격', color: '#b04a14', tilt: { defense: 1.30, life: 1.15, damage: 0.65 },  gives: ['reflect'],             desc: '맞은 만큼 돌려준다' },
  // 싸움을 포기하고 전리품을 캐는 성격입니다. 공격과 생명을 확실히 깎는 대신
  // 전리품 확률을 올려줍니다 — 꼭 얻어야 할 것이 있는 판에만 갈아끼우는 물건입니다.
  lucky:  { name: '행운', color: '#7d630c', tilt: { luck: 1.90, damage: 0.70, life: 0.80 },     gives: ['findRate'],            desc: '싸움은 약해지고 전리품이 늘어난다' },
  // 행운과 똑같은 거래입니다. 저쪽은 싸움을 팔아 전리품을 사고, 이쪽은 경험치를 삽니다.
  //
  // 쓰는 법은 하나뿐입니다 — 회차를 새로 시작하면 Lv.1 로 돌아가는데, 장비는 그대로
  // 남아 있어서 초반 화신들은 뭘 입든 이깁니다. 그 구간에서 이걸 입고 경험치를
  // 두 배 넘게 빨아들이다가, 상대가 버거워지면 벗고 싸움 장비로 돌아갑니다.
  growth: { name: '성장', color: '#1f6f7a', tilt: { damage: 0.65, life: 0.80, defense: 0.85 }, gives: ['xpRate'],              desc: '싸움은 약해지고 경험치를 더 얻는다' },
  brutal: { name: '분쇄', color: '#7a2e3a', tilt: { damage: 1.30, dex: 0.80 },                  gives: ['critRate', 'pierce'],  desc: '느리지만 한 방이 무겁다' },
  ward:   { name: '보호', color: '#356b4e', tilt: { life: 1.35, defense: 1.10, dex: 0.85 },     gives: ['block', 'lifesteal'],  desc: '오래 버틴다' }
};

const SLOT_NAMES = Object.fromEntries(SLOTS.map(s => [s.id, s.name]));
const SLOT_IDS   = SLOTS.map(s => s.id);

// ---------- 특수장비 ----------
// 열세 부위와 따로 노는 칸입니다. 처음엔 하나도 없고, 숨어 있는 넷
// (제3·5·7·9격의 히든)을 처음 꺾을 때마다 하나씩 열려 최대 넷까지 생깁니다.
// 특수장비라면 어느 칸에든 끼울 수 있습니다 — 보석이든 유물이든.
// 부위 강화는 받지 않습니다. 대신 하나하나가 일반 장비 한 부위보다 뾰족합니다.
const SPECIAL_SLOT_MAX = 4;
const SPECIAL_SLOT_IDS = Array.from({ length: SPECIAL_SLOT_MAX }, (_, i) => `special${i + 1}`);
const ALL_SLOT_IDS = SLOT_IDS.concat(SPECIAL_SLOT_IDS);
const SPECIAL_NUM = ['Ⅰ', 'Ⅱ', 'Ⅲ', 'Ⅳ'];
SLOT_NAMES.special = '특수장비';
SPECIAL_SLOT_IDS.forEach((id, i) => { SLOT_NAMES[id] = `특수장비 ${SPECIAL_NUM[i]}`; });

function isSpecialSlot(slot) { return SPECIAL_SLOT_IDS.includes(slot); }

// 보석 — 핵심 스탯 하나만, 크게. 떨어뜨린 화신의 레벨을 따라 커집니다.
//   그 레벨 화신 스탯의 0.12배 × 등급 배수 (일반 1 · 히든 1.6 · 보스 1.8)
//   무기 한 자루가 공격 0.26배라, 보스 보석 하나(0.22배)가 일반 무기 하나에 조금 못 미칩니다.
// 유물 — 특수 능력치 하나. 레벨이 아니라 **격**을 탑니다. 제5격이 기준값이고
//   격 하나당 +8% (제3격 ×0.84 · 제9격 ×1.32 · 제15격 ×1.80). 정예 ×1.15 · 히든·보스 ×1.3
//   일반 장비 성격이 붙여주는 특수 능력치(1~2%)보다 몇 배 큽니다 — 이 칸의 존재 이유입니다.
const GEM_POWER = 0.12;
const RELIC_BASE = { critRate: 6, doubleHit: 6, pierce: 10, lifesteal: 4, block: 6, reflect: 10,
                     findRate: 40, xpRate: 50, stoneRate: 30,
                     regen: 2, survive: 15, harmTouch: 3, doubleTurn: 8 };
const RELIC_GRADE = { normal: 1, elite: 1.15, hidden: 1.3, boss: 1.3 };

function relicScale(rankN) { return 0.6 + 0.08 * rankN; }

//   opt = { gem: '스탯' }  또는  { relic: ['특수 능력치', …] }
function makeSpecialStats(opt, level, kind, rankN) {
  const out = {};
  if (opt.gem) {
    const e = enemyStats(level);
    out[opt.gem] = Math.max(1, Math.round(GEM_POWER * e[opt.gem] * KINDS[kind].mult));
  }
  for (const key of opt.relic || []) {
    out[key] = +(RELIC_BASE[key] * relicScale(rankN) * RELIC_GRADE[kind] / 100).toFixed(4);
  }
  return out;
}

// 떨어뜨리는 화신의 스탯에 비례해서 성능이 정해집니다.
// 초반 장비든 후반 장비든 그 구간에서의 체감이 같아집니다.
// gradeMult 는 화신의 종류 — 정예는 1.4배, 보스는 1.8배짜리를 남깁니다.
// (예전엔 정예 1.8 · 히든 2.2 · 보스 2.6 이었습니다. 정해진 자리 하나만 잡으면 그 지역
//  일반 화신의 것이 전부 쓸모없어져서, 플레이 타임을 늘리는 쪽으로 낮췄습니다.)
function makeItemStats(slot, level, gradeMult = 1, archetype = null, vital = false) {
  const e = enemyStats(level);
  const p = (vital && VITAL_SLOT_PROFILE[slot]) || SLOT_PROFILE[slot] || {};
  const A = archetype ? ARCHETYPES[archetype] : null;
  const tilt = (A && A.tilt) || {};
  const out = {};

  for (const k of STAT_KEYS) {
    if (!p[k]) continue;
    out[k] = Math.max(1, Math.round(p[k] * e[k] * gradeMult * (tilt[k] ?? 1)));
  }

  // 특수 능력치는 성격에서만 나옵니다. 등급이 높을수록 더 붙습니다.
  if (A) for (const key of A.gives) {
    const s = SPECIAL_INFO[key];
    out[key] = +(s.base * gradeMult / 100).toFixed(4);
  }
  return out;
}

// ============================================================
//  화신의 종류와 전리품 등급
// ============================================================
// 일반 — 길에서 무작위로 만납니다. 몇 번이고 다시 만날 수 있습니다.
// 정예 — 지역마다 둘. 정해진 자리에 서 있고, 안 잡아도 진행에 지장 없습니다.
// 보스 — 지역마다 하나. 꺾어야 다음 지역이 열립니다.
//
// 정예와 보스는 **한 회차에 한 번뿐**입니다. 꺾고 나면 그 여정에선 다시 못 만납니다.
// 대신 훨씬 좋은 걸 남깁니다 — 그래서 그 자리에 갈지 말지가 매번 고민이 됩니다.
const KINDS = {
  // dropChance 는 **전리품 하나하나에 따로** 굴리는 확률입니다.
  // 세 종류를 가진 일반 적이라면 22% 를 세 번 굴리므로
  // 아무것도 못 얻을 확률이 47% 입니다 — 빈손으로 돌아서는 날이 있어야
  // 행운에 투자할 이유가 생깁니다.
  normal: { id: 'normal', name: '일반', mult: 1.0, lifeMult: 1.0,  penalty: 'LOSS_PENALTY',       once: false, energy: 0, dropChance: 0.22 },
  elite:  { id: 'elite',  name: '정예', mult: 1.4, lifeMult: 1.2,  penalty: 'LOSS_PENALTY_ELITE', once: true,  energy: 2, dropChance: 0.32 },
  hidden: { id: 'hidden', name: '히든', mult: 1.6, lifeMult: 1.25, penalty: 'LOSS_PENALTY_ELITE', once: true,  energy: 3, dropChance: 1.00 },
  boss:   { id: 'boss',   name: '격',   mult: 1.8, lifeMult: 1.3,  penalty: 'BOSS_LOSS_PENALTY',  once: true,  energy: 4, dropChance: 0.40 }
};

function lossPenaltyFor(kind) { return RULES[KINDS[kind].penalty]; }

// ============================================================
//  부위 강화
// ============================================================
// 이미 가진 전리품이 또 나오면 **자동으로 분해되어** 그 부위의 강화석이 됩니다.
// 무기가 겹치면 무기 강화석, 팔찌가 겹치면 팔찌 강화석.
// (예전엔 같은 전리품이 겹쳐 쌓였습니다 — 겹당 +15%, 최대 10겹.)
//
// 강화는 장비가 아니라 **부위**에 붙습니다. 무기 칸을 +5 로 올려두면 그 칸에
// 무엇을 끼든 핵심 스탯이 그만큼 커집니다. 회차가 끝나도, 세트를 바꿔도 남습니다.
// 겹은 새 장비로 갈아타면 1겹부터 다시였지만, 강화는 그대로 따라옵니다.
//
// 특수 능력치(크리·막기 …)는 키우지 않습니다. 겹치기 때와 같은 이유로,
// 그쪽까지 키우면 상한에 그냥 닿아서 특수가 주인공이 됩니다.
//
// 표 한 줄이 한 단계입니다. **실패하면 강화석만 사라지고 단계는 그대로**입니다.
//   cost  — 한 번 시도하는 데 드는 강화석
//   rate  — 성공 확률
//   bonus — 그 단계에 닿았을 때 핵심 스탯 증가량 (누적)
//
// +10 까지는 강화석이 넉넉하게 모여서 거의 매번 시도할 수 있습니다. 한 단계에 +5~7%.
// +11 부터는 따로 노는 구간입니다 — 비용이 네 배로 뛰고 확률이 40% 아래로 떨어지는 대신,
// 한 단계에 +20~30% 씩 크게 오릅니다. 실패해도 확률이 오르지 않습니다.
// 시뮬에서는 마지막 지역에 닿을 즈음 평균 +12, 클리어할 때 +12~14 — +15 는 드뭅니다.
const ENHANCE_TABLE = [
  { cost:    30, rate: 1.00, bonus: 0.05 },   // +1
  { cost:    60, rate: 1.00, bonus: 0.10 },   // +2
  { cost:   100, rate: 0.95, bonus: 0.15 },   // +3
  { cost:   150, rate: 0.90, bonus: 0.20 },   // +4
  { cost:   220, rate: 0.85, bonus: 0.25 },   // +5
  { cost:   320, rate: 0.80, bonus: 0.32 },   // +6
  { cost:   450, rate: 0.75, bonus: 0.39 },   // +7
  { cost:   620, rate: 0.70, bonus: 0.46 },   // +8
  { cost:   850, rate: 0.65, bonus: 0.53 },   // +9
  { cost:  1150, rate: 0.60, bonus: 0.60 },   // +10
  { cost:  5000, rate: 0.40, bonus: 0.80 },   // +11
  { cost:  6500, rate: 0.35, bonus: 1.00 },   // +12
  { cost:  8500, rate: 0.30, bonus: 1.25 },   // +13
  { cost: 11000, rate: 0.25, bonus: 1.50 },   // +14
  { cost: 14000, rate: 0.20, bonus: 1.80 }    // +15
];
const ENHANCE_MAX = ENHANCE_TABLE.length;

// ---------- 강화석 바꾸기 ----------
// 다른 부위의 강화석을 모자란 부위의 강화석으로 바꿀 수 있습니다. 대신 절반이 사라집니다.
// 특수장비를 분해한 「특수장비 강화석」도 이렇게 바꿔 씁니다 (특수장비 칸은 강화가 없으니까요).
// 손해가 크게 잡혀 있어야 "흔한 부위를 캐서 몰아주기" 가 정답이 되지 않습니다 —
// 부위마다 따로 모으는 게 기본이고, 이건 한 부위만 크게 뒤처졌을 때 쓰는 비상구입니다.
const STONE_EXCHANGE_RATE = 0.5;   // 2개를 주면 1개

function enhanceBonus(level) {
  return level > 0 ? ENHANCE_TABLE[Math.min(level, ENHANCE_MAX) - 1].bonus : 0;
}

// 분해하면 나오는 강화석 = 기본 × 등급 × 격 × 부위 희소성
//   등급 — 일반 1 · 정예 2 · 히든·보스 3
//   격   — 그 전리품의 격 번호. 제1격 하나보다 제8격 하나가 여덟 배입니다.
//          제1격 일반 화신의 드롭률이 제11격의 5.6배라, 양이 같으면
//          처음 지역에서 캐는 게 최선이 되어버립니다.
//   부위 — 흔한 부위는 덜, 드문 부위는 더 (아래 SLOT_SCARCITY)
const STONE_BASE = 10;
const STONE_GRADE = { normal: 1, elite: 2, hidden: 3, boss: 3 };

function stoneYield(item) {
  const scarce = (SLOT_SCARCITY[item.rank.n] || {})[item.slot] || 1;
  return Math.max(1, Math.round(STONE_BASE * STONE_GRADE[item.grade] * item.rank.n * scarce));
}

// ---------- 격을 삼키는 검 ----------
// 중반에 숨어 있는 「관측자」가 남기는 유일무이한 무기입니다.
//
// 이걸 들고 정예·보스를 처음 꺾으면 그 격의 에너지를 **삼켜서** 즉시 회복하고,
// 동시에 **영구히 적립**됩니다 — 다음 회차부터는 시작 에너지에 그냥 얹혀 있습니다.
//
// 그래서 후반에는 정예를 하나하나 다시 잡을 필요가 없습니다. 이미 내 것이니까.
// 곧장 더 깊은 보스로 직행해서 회차를 단축하는 게 이 검의 목적입니다.
//
// 대신 무기 자리를 잡아먹습니다. 전투력을 포기하고 에너지를 모을 것인가 —
// 그게 이 검이 만드는 선택입니다.
const DEVOURER_ID = 'observer_0';

// 「관측자」가 나타나는 조건: 보스를 다섯 꺾어 마족 구간까지 넘어선 뒤부터.
const HIDDEN_UNLOCK_BOSSES = 5;

// ============================================================
//  격(格)
// ============================================================
// 아래에서 위로 올라가는 열다섯 계단입니다.

// 뒤의 아홉은 화신 — 인간의 이야기에서 시작해 바깥의 것까지.

// ============================================================
//  레벨 사다리
// ============================================================
// 적의 레벨은 손으로 적지 않습니다. 등장 순서만 정하면 1 부터 상한까지
// 기하급수로 자동 배치됩니다.
//
// 그래서 적을 중간에 끼워 넣기만 해도 사다리가 저절로 촘촘해집니다.
// 촘촘할수록 "아슬아슬한 상대"가 많아지고, 승률이 0%/100% 로만 갈리지 않습니다.
// 지금은 183마리라 한 칸이 약 1.19배입니다.
//
// 격을 열한 개에서 열다섯 개로 늘리면서 상한도 100억에서 100조로 올렸습니다.
// 상한을 그대로 두고 쉰 마리를 끼워 넣으면 한 칸이 1.13배로 좁아질 뿐,
// 올라가야 할 거리는 그대로라 게임이 길어지지 않습니다.
// 한 칸의 폭(≈1.19배)을 지키고 사다리를 위로 늘려야 늘어난 격만큼 길이가 붙습니다.
const LEVEL_CAP = 1e14;  // 100조 — 아자토스의 레벨
const LADDER_FLAT = 8;          // 맨 아래 여덟 칸은 1,2,…,8 로 손으로 깝니다
                                // (안 그러면 저레벨이 전부 Lv.1 로 뭉개집니다)

// 읽기 좋게 유효숫자 세 자리로 자릅니다 — Lv.4,663 보다 Lv.4,660 이 낫습니다
function roundSig(n, digits = 3) {
  if (n < 100) return Math.round(n);
  const m = Math.pow(10, Math.floor(Math.log10(n)) - digits + 1);
  return Math.round(n / m) * m;
}

function buildLadder(total) {
  const steps = total - LADDER_FLAT;
  const r = Math.pow(LEVEL_CAP / LADDER_FLAT, 1 / steps);
  const out = [];
  for (let i = 0; i < total; i++) {
    out.push(i < LADDER_FLAT
      ? i + 1
      : roundSig(LADDER_FLAT * Math.pow(r, i - LADDER_FLAT + 1)));
  }
  return out;
}

  shiva:       { replace: 'necklace', item: ['special', '시바의 셋째 눈',  { relic: ['pierce'] }] },    // 14격
  cthulhu:     { replace: 'helm',     item: ['special', '잠든 신의 우상',  { relic: ['doubleHit'] }] }, // 15격

  // ── 원작의 네 능력치 (재생 · 생존 · 일격 · 연속 턴) — 이른 격 하나, 늦은 격 하나씩 ──
  trollking:   { replace: 'necklace', item: ['special', '트롤의 심장',        { relic: ['regen'] }] },      // 2격 보스 — 베어도 다시 붙는
  minotaur:    { replace: 'belt',     item: ['special', '미궁의 뿔',          { relic: ['harmTouch'] }] },  // 3격
  wyvern:      { replace: 'cloak',    item: ['special', '와이번의 날개막',    { relic: ['doubleTurn'] }] }, // 3격
  phoenix:     { replace: 'necklace', item: ['special', '다시 타오르는 잿불', { relic: ['regen'] }] },      // 4격 — 타 죽어야 사는 새
  lichking:    { replace: 'necklace', item: ['special', '죽지 않는 성물함',   { relic: ['survive'] }] },    // 5격 보스
  heracles:    { replace: 'necklace', item: ['special', '네메아를 꺾은 주먹', { relic: ['harmTouch'] }] },  // 10격 보스
  hermes:      { replace: 'belt',     item: ['special', '전령의 날개',        { relic: ['doubleTurn'] }] }, // 13격
  izanagi:     { replace: 'cloak',    item: ['special', '황천의 복숭아',      { relic: ['survive'] }] }     // 14격 — 황천에서 도망치며 던진
};

// 특수장비에 자리를 내준 전리품. 저장본에 남아 있으면 그 부위의 강화석으로 바꿔 드립니다.
const RETIRED_ITEMS = {};

// ============================================================
//  세트 효과 · 도감 보상
// ============================================================
// 같은 성격의 장비를 여러 부위에 끼면 그 성격의 특수 능력치가 더 붙습니다.
// 일반 부위 열세 칸만 셉니다 (특수장비에는 성격이 없습니다).
// 값은 그 단계의 합계입니다 — 6부위가 되면 3부위 값 대신 6부위 값이 붙습니다.
// 분쇄·보호 세트는 원작의 일격·재생을 붙여줍니다 (그 둘은 원래 유물로만 나옵니다).
const SET_STEPS = [3, 6];
const SET_BONUS = {
  fierce: { critRate:  [0.03, 0.07] },
  guard:  { block:     [0.03, 0.07] },
  leech:  { lifesteal: [0.02, 0.05] },
  swift:  { doubleHit: [0.03, 0.07] },
  pierce: { pierce:    [0.05, 0.12] },
  thorn:  { reflect:   [0.05, 0.12] },
  lucky:  { findRate:  [0.20, 0.50] },
  growth: { xpRate:    [0.25, 0.60] },
  brutal: { harmTouch: [0.015, 0.04] },
  ward:   { regen:     [0.01, 0.03] }
};

// 한 격의 전리품을 전부 모으면 영구히 핵심 스탯(생명 · 공격 · 방어 · 민첩 · 행운)이 오릅니다.
// 정예 · 히든 · 보스의 것까지 다 모아야 합니다. 열다섯 격을 다 채우면 +15%.
// 레벨 · 분배 · 장비를 다 합친 뒤에 곱해서 생각보다 셉니다 — 격당 +2% 로 뒀더니
// 초반 격 도감이 일찍 차면서 게임이 101 → 64회차로 줄었습니다.
const COLLECTION_BONUS = 0.01;

// ============================================================
//  위 데이터를 펼쳐서 실제로 쓰는 배열 만들기
// ============================================================
const ENEMIES = [];
const ITEMS = [];

// 등장 순서대로 레벨을 깔아줍니다. 적을 몇 마리 추가하든 알아서 다시 배분됩니다.
const TOTAL_FOES = ZONES.reduce((n, z) => n + z.enemies.length, 0);
const LADDER = buildLadder(TOTAL_FOES);

// ---------- 한 화신이 남기는 전리품은 최대 세 종류 ----------
// EXTRA_DROPS 를 덧붙이면서 쉰한 마리가 네 종류가 됐습니다.
// 위 EXTRA_DROPS 주석에 "개수를 늘려도 한 번에 떨어지는 양은 그대로" 라고
// 적혀 있었는데 **틀린 말이었습니다.** 드롭은 종류마다 따로 굴리므로
// 네 종류는 곧 한 번 잡을 때 떨어지는 양이 3분의 1 늘어난다는 뜻입니다.
//
// 버릴 것은 **나중에 덧댄 것(EXTRA_DROPS)부터** 고릅니다.
// 처음엔 "흔한 부위부터" 버리게 했는데, 무기가 전체에서 제일 흔한 부위라
// **열한 보스가 전부 무기를 잃었습니다** — 아자토스의 『만물을 가르는 칼날』까지요.
// 손으로 쓴 e.d 목록은 그 화신의 정체이고 EXTRA_DROPS 는 부위 수를 채우려고
// 덧댄 것이니, 양보해야 하는 쪽은 덧댄 쪽입니다.
// 덧댄 것끼리는 흔한 부위부터, 같은 부위가 두 번 붙은 것은 무조건 먼저 버립니다.
const MAX_DROPS_PER_ENEMY = 3;

const SLOT_TALLY = {};
for (const z of ZONES) {
  for (const e of z.enemies) {
    for (const [slot] of e.d.concat(EXTRA_DROPS[e.id] || [])) {
      SLOT_TALLY[slot] = (SLOT_TALLY[slot] || 0) + 1;
    }
  }
}

// 남길 것들을 **원래 자리 번호와 함께** 돌려줍니다.
// 전리품 id 가 `적id_순번` 이라, 잘라내고 번호를 다시 매기면 저장해둔
// 전리품이 엉뚱한 물건으로 바뀝니다. 그래서 번호는 원래 것을 그대로 씁니다.
// (특수장비에 자리를 내준 것은 넘어오기 전에 이미 빠져 있습니다 — 번호만 비워둡니다.)
function trimDrops(withIdx, enemyId, baseCount) {
  if (withIdx.length <= MAX_DROPS_PER_ENEMY) return withIdx;

  const seen = new Set();
  const scored = withIdx.map(({ spec, idx }) => {
    const slot = spec[0];
    const dupe = seen.has(slot);
    seen.add(slot);
    let score = (dupe ? 100000 : 0)                    // 같은 부위 중복이 가장 먼저
              + (idx >= baseCount ? 1000 : 0)          // 그다음이 덧댄 것
              + (SLOT_TALLY[slot] || 0);               // 같은 조건이면 흔한 부위부터
    if (`${enemyId}_${idx}` === DEVOURER_ID) score = -1;   // 격을 삼키는 검은 절대 안 버립니다
    if (slot === 'special') score = -1;                    // 특수장비도 — 이미 하나를 빼고 넣은 자리입니다
    return { spec, idx, score };
  });
  scored.sort((a, b) => a.score - b.score || a.idx - b.idx);
  return scored.slice(0, MAX_DROPS_PER_ENEMY).sort((a, b) => a.idx - b.idx);
}

let ladderIndex = 0;
ZONES.forEach((zone, zi) => {
  const rank = RANKS.find(r => r.n === zone.rank);

  zone.enemies.forEach((e, ei) => {
    const kind = e.kind || 'normal';
    const K = KINDS[kind];
    const level = LADDER[ladderIndex++];
    const arch = e.a || ENEMY_ARCHETYPE[e.id] || 'guard';

    // 각 격의 시작 레벨 = 그 지역 첫 적의 레벨
    if (ei === 0) rank.minLevel = level;

    ENEMIES.push({
      id: e.id,
      name: e.name,
      title: e.title,
      level,
      icon: e.icon,
      kind,                       // normal | elite | hidden | boss
      arch,                       // 이 적이 남기는 전리품의 성격
      boss: kind === 'boss',
      once: K.once,               // 한 회차에 한 번만 만날 수 있는가
      opens: !!e.opens,           // 처음 꺾으면 특수장비 칸이 하나 열리는가
      final: !!e.final,
      zoneIndex: zi,
      zoneId: zone.id,
      zoneName: zone.name,
      rank,
      ...toughen(e.final ? finalBossStats(level, K.lifeMult) : enemyStats(level, K.lifeMult), rank.n, !!e.final),
      xp: enemyBaseXp(level)
    });

    // [부위, 이름] 뒤에 숫자를 붙이면 그 전리품만 성능 배수를 따로 줍니다.
    // 세 번째가 'none' 이면 성격 없이 맨 스탯만 (격을 삼키는 검처럼 특별한 것).
    // 부위가 'special' 이면 특수장비 — 세 번째에 { gem } 또는 { relic } 이 옵니다.
    const sp = SPECIAL_DROPS[e.id];
    let list = e.d.concat(EXTRA_DROPS[e.id] || []);
    let retired = -1;
    if (sp) {
      retired = list.findIndex(x => x[0] === sp.replace);
      if (retired >= 0) {
        RETIRED_ITEMS[`${e.id}_${retired}`] = { slot: sp.replace, grade: kind, rank, name: list[retired][1] };
      }
      list = list.concat([sp.item]);   // 번호는 맨 뒤에 새로 받습니다 — 빠진 것의 번호를 물려받지 않게
    }
    const cands = list.map((spec, idx) => ({ spec, idx })).filter(c => c.idx !== retired);
    const drops = trimDrops(cands, e.id, e.d.length);
    drops.forEach(({ spec: [slot, name, opt], idx: i }) => {
      const noArch = opt === 'none';
      const isSpecial = slot === 'special';
      const id = `${e.id}_${i}`;
      const stats = noArch ? {}
        : isSpecial ? makeSpecialStats(opt, level, kind, rank.n)
        : makeItemStats(slot, level, (typeof opt === 'number' ? opt : K.mult), arch, VITAL_FOES.has(e.id));
      ITEMS.push({
        id,
        name,
        slot,
        grade: kind,              // 전리품 등급 = 떨어뜨린 화신의 종류
        arch: (noArch || isSpecial) ? null : arch,
        special: isSpecial ? (opt.gem ? 'gem' : 'relic') : null,   // 특수장비라면 보석인가 유물인가
        unique: id === DEVOURER_ID,   // 단 하나뿐인 물건 — 다시 나오지 않습니다
        note: id === DEVOURER_ID
          ? '정예·보스를 처음 꺾을 때마다 그 격을 삼켜 에너지로 바꾼다. 삼킨 에너지는 다음 회차부터 시작과 함께 주어진다. 싸움에는 아무 도움이 되지 않는다.'
          : null,
        level,
        rank,
        from: e.id,
        fromName: e.name,
        fromIcon: e.icon,         // 전리품 아이콘 = 떨어뜨린 적의 아이콘
        ...stats
      });
    });
  });
});

// ---------- 부위 희소성 ----------
// 부위마다 전리품 가짓수가 다릅니다 (무기가 허리띠의 서너 배). 그대로 두면
// 무기 강화석이 허리띠 강화석보다 몇 배 빨리 모입니다.
//
// **격마다 따로** 셉니다. 회차 대부분을 지금 격 안에서 보내기 때문에,
// 게임 전체로는 고르게 맞춰도 마지막 격에 허리띠가 하나뿐이면 거기서
// 오래 머무는 동안 허리띠만 강화가 멈춥니다 (시뮬에서 실제로 +7 에 묶였습니다).
//
// 한 회차에 몇 번이고 만나는 일반 화신의 것을 1, 회차당 한 번뿐인 정예·보스의
// 것을 0.3 으로 쳐서 그 격에서 부위별로 얼마나 자주 떨어지는지 어림하고,
// 그 역수만큼 분해량을 보정합니다. 전리품을 추가하면 알아서 다시 계산됩니다.
//   SLOT_SCARCITY[격 번호][부위]
const SLOT_SCARCITY = (() => {
  const out = {};
  for (const r of RANKS) {
    const supply = Object.fromEntries(SLOT_IDS.map(s => [s, 0]));
    for (const it of ITEMS) {
      if (it.unique || it.rank.n !== r.n) continue;
      supply[it.slot] += it.grade === 'normal' ? 1 : 0.3;
    }
    const have = SLOT_IDS.filter(s => supply[s] > 0);
    const mean = have.reduce((n, s) => n + supply[s], 0) / Math.max(1, have.length);
    out[r.n] = Object.fromEntries(SLOT_IDS.map(s =>
      [s, supply[s] > 0 ? Math.min(3, Math.max(0.4, mean / supply[s])) : 1]));
  }
  return out;
})();

// 격마다 전리품 id — 도감 완성을 셀 때 씁니다
const RANK_ITEMS = Object.fromEntries(RANKS.map(r => [r.n, ITEMS.filter(i => i.rank.n === r.n).map(i => i.id)]));

// id 로 바로 찾습니다 — 스탯을 셀 때마다 수백 개를 훑지 않게
const ENEMY_BY_ID = Object.fromEntries(ENEMIES.map(e => [e.id, e]));
const ITEM_BY_ID  = Object.fromEntries(ITEMS.map(i => [i.id, i]));
function getEnemy(id) { return ENEMY_BY_ID[id]; }
function getItem(id)  { return id ? ITEM_BY_ID[id] : undefined; }
function dropTable(enemyId) { return ITEMS.filter(i => i.from === enemyId); }

// 부위별 전리품 목록 (낮은 격부터) — 전리품 도감에 씁니다
function itemsInSlot(slot) { return ITEMS.filter(i => i.slot === slot); }

// 지역별 조회
function zoneRoster(zi)   { return ENEMIES.filter(e => e.zoneIndex === zi); }
function zoneNormals(zi)  { return ENEMIES.filter(e => e.zoneIndex === zi && e.kind === 'normal'); }
function zoneBoss(zi)     { return ENEMIES.find(e => e.zoneIndex === zi && e.kind === 'boss'); }
// 정예 + 히든 + 보스 — 정해진 자리에 서 있는 것들
function zonePosts(zi)    { return ENEMIES.filter(e => e.zoneIndex === zi && e.once); }

</script>
<script>
// ============================================================
//  game.js  —  게임 규칙과 상태
//  화면 그리는 코드는 전혀 없습니다. 순수 로직만.
// ============================================================

// ---------- 세이브 슬롯 ----------
// 슬롯 두 개를 따로 씁니다. 슬롯을 고르기 전에는 아무것도 저장되지 않습니다.
const SAVE_SLOTS = 2;
const saveKey = n => `jjunsgame.rpg.v3.slot${n}`;

let currentSlot = 0;               // 0 = 아직 안 고름 (초기화면)

// 각 슬롯에 뭐가 들었는지 — 초기화면에 보여줄 요약
function slotSummary(n) {
  try {
    const raw = localStorage.getItem(saveKey(n));
    if (!raw) return null;
    return summarizeMeta(JSON.parse(raw));
  } catch (e) { return null; }
}

// 저장 내용 한 덩이를 초기화면에 보여줄 요약으로 — 가져오기 전에 미리 보여줄 때도 씁니다
function summarizeMeta(d) {
  const owned = d.owned && !Array.isArray(d.owned) ? Object.keys(d.owned).length : (d.owned || []).length;
  return {
    runCount: d.runCount || 0,
    bestLevel: d.bestLevel || 1,
    bestZone: d.bestZone || 1,
    owned,
    bosses: (d.bossesBeaten || []).length,
    cleared: !!d.cleared
  };
}

// ---------- 세이브 내보내기 / 가져오기 ----------
// 세이브는 브라우저마다 따로 저장돼서 폰 ↔ PC, 파일로 연 것 ↔ 주소로 연 것 사이에 옮겨지지 않습니다.
// 저장 내용을 글자 한 줄(세이브 코드)로 바꿔서 복사하거나 파일로 옮깁니다.
//   JJG1.<base64(gzip(json))>   압축한 것 — 요즘 브라우저는 다 됩니다
//   JJG0.<base64(json)>         압축을 못 하는 브라우저용
// 안의 json 은 { game, v, at, slot, meta } 이고, meta 가 localStorage 에 들어가는 그대로입니다.
// 가져온 뒤 그 슬롯을 열 때 load() 를 거치므로, 예전 형식(겹 시스템 등)도 알아서 옮겨집니다.
// 진행 중인 회차(레벨·에너지)는 원래 저장되지 않습니다 — 이어하기를 해도 새 회차로 시작합니다.
const SAVE_CODE_GAME = 'jjunsgame';

function bytesToB64(bytes) {
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}

function b64ToBytes(b64) {
  const s = atob(b64);
  const out = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
  return out;
}

async function pipeBytes(bytes, transform) {
  const stream = new Blob([bytes]).stream().pipeThrough(transform);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function exportSaveCode(n) {
  const raw = localStorage.getItem(saveKey(n));
  if (!raw) return null;
  const json = JSON.stringify({ game: SAVE_CODE_GAME, v: 3, at: Date.now(), slot: n, meta: JSON.parse(raw) });
  const bytes = new TextEncoder().encode(json);
  if (typeof CompressionStream === 'function') {
    try { return 'JJG1.' + bytesToB64(await pipeBytes(bytes, new CompressionStream('gzip'))); } catch (e) {}
  }
  return 'JJG0.' + bytesToB64(bytes);
}

// 세이브 코드를 풀어서 meta 를 돌려줍니다. 못 쓰는 코드면 이유를 담아 throw 합니다.
// localStorage 에 든 날것의 json 을 그대로 붙여넣어도 받아줍니다.
async function parseSaveCode(text) {
  const code = String(text || '').trim();
  if (!code) throw new Error('붙여넣은 내용이 없습니다.');

  let obj;
  if (!code.startsWith('JJG')) {
    // 날것의 저장 내용(json)을 그대로 붙여넣은 경우
    try { obj = JSON.parse(code); } catch (e) { obj = null; }
    if (!obj || typeof obj !== 'object') {
      throw new Error('세이브 코드가 아닙니다. JJG 로 시작하는 글자 전체를 붙여넣어 주세요.');
    }
    if (!obj.game) obj = { game: SAVE_CODE_GAME, meta: obj };
  } else {
    const m = /^JJG([01])\.([A-Za-z0-9+/=\s]+)$/.exec(code);
    if (!m) throw new Error('코드가 잘렸거나 망가졌습니다.');
    let bytes;
    try { bytes = b64ToBytes(m[2].replace(/\s+/g, '')); } catch (e) { throw new Error('코드가 잘렸거나 망가졌습니다.'); }
    if (m[1] === '1') {
      if (typeof DecompressionStream !== 'function') throw new Error('이 브라우저는 압축된 세이브 코드를 열 수 없습니다.');
      try { bytes = await pipeBytes(bytes, new DecompressionStream('gzip')); }
      catch (e) { throw new Error('코드가 잘렸거나 망가졌습니다.'); }
    }
    try { obj = JSON.parse(new TextDecoder().decode(bytes)); } catch (e) { throw new Error('코드가 잘렸거나 망가졌습니다.'); }
  }

  const meta = obj && obj.meta;
  if (obj.game !== SAVE_CODE_GAME || !meta || typeof meta !== 'object' || Array.isArray(meta)) {
    throw new Error('이 게임의 세이브가 아닙니다.');
  }
  if (!('owned' in meta) && !('runCount' in meta)) throw new Error('저장 내용이 비어 있습니다.');
  return meta;
}

// 가져온 저장 내용을 그 슬롯에 씁니다 (있던 기록은 덮어씁니다)
function importSave(n, meta) {
  localStorage.setItem(saveKey(n), JSON.stringify(meta));
}

function hasAnySave() {
  for (let n = 1; n <= SAVE_SLOTS; n++) if (slotSummary(n)) return true;
  return false;
}

// 슬롯을 열고 게임을 시작합니다. fresh 면 그 슬롯을 비우고 새로 시작.
function openSlot(n, fresh) {
  currentSlot = n;
  State.meta = freshMeta();
  if (fresh) { try { localStorage.removeItem(saveKey(n)); } catch (e) {} }
  else load();
  startRun();
}

function wipeSlot(n) {
  try { localStorage.removeItem(saveKey(n)); } catch (e) {}
}

// ---------- 상태 ----------
// meta  = 회차가 끝나도 살아남는 것 (전리품, 기록)
// run   = 이번 여정에만 존재하는 것 (레벨, 경험치, 에너지, 위치)
// 모든 부위를 비워둔 착용표 — 특수장비 칸 넷도 들어 있습니다 (닫혀 있어도 자리는 있습니다)
function emptyEquipped() {
  return Object.fromEntries(ALL_SLOT_IDS.map(s => [s, null]));
}

// 부위마다 0 — 강화 단계가 이 모양입니다
function slotZeros() {
  return Object.fromEntries(SLOT_IDS.map(s => [s, 0]));
}

// 강화석은 열세 부위에 「특수장비」 하나가 더 붙습니다 — 특수장비를 분해하면 여기로 모입니다
function stoneZeros() {
  return { ...slotZeros(), special: 0 };
}

// 분배 비율의 기본값. STAT_KEYS 를 따라가야 스탯이 늘어도 NaN 이 안 샙니다.
// (행운을 추가했을 때 여기를 안 고쳐서 생명까지 NaN 이 됐던 적이 있습니다.)
function defaultWeights() {
  return Object.fromEntries(STAT_KEYS.map(k => [k, 1]));
}

// ---------- 설정 ----------
// 한 판을 끝까지 시뮬레이션해보고 **실제로 반복되는 조작**을 세어서 골랐습니다.
// 76회차 동안:
//   장비 갈아입기 4085번 (회차당 54번)  → autoEquip
//   전투 2339번 중 패배는 71번(3%)뿐    → autoContinue (거의 언제나 "계속한다"만 누름)
//   물러남 224번
// 숫자가 큰 것부터 덜어주는 것이 설정의 값어치입니다.
function defaultSettings() {
  return {
    autoContinue: 0,    // 전투 결과를 스스로 넘기기까지의 시간(ms). 0 이면 안 넘김
    autoEquip: false,   // 새로 얻은 것이 지금 낀 것보다 나으면 알아서 갈아끼우기
    dropFx: true,       // 전리품이 뒤늦게 튀어나오는 연출
    showLocked: false,  // 아직 못 얻은 ???? 를 기본으로 펼쳐둘 것인가
    battleSpeed: 2      // 전투 보기 — 0 끔 · 1 빠르게 · 2 보통
  };
}

// 화면에서 뺀 설정 — 열 때마다 기본값으로 돌려둡니다.
// 예전에 바꿔둔 값이 고칠 수 없는 채로 남아 있으면 안 되니까요.
// 알아서 갈아끼우기 · 결과 자동 넘기기는 아예 뺐고(꺼짐),
// 보기 셋(전투 보기 · 전리품 등장 연출 · 못 얻은 것 펼쳐두기)은 나중에 관리자용 설정으로 돌아옵니다 —
// 그때 여기서 빼면 됩니다.
const FIXED_SETTINGS = ['autoContinue', 'autoEquip', 'dropFx', 'showLocked', 'battleSpeed'];

const State = {
  meta: {
    owned: {},                        // 전리품 id → 1 (가진 것만 들어 있습니다)
    stones: stoneZeros(),             // 부위 → 강화석. 이미 가진 전리품을 분해해서 모읍니다 (특수장비 포함)
    enhance: slotZeros(),             // 부위 → 강화 단계 (0 ~ ENHANCE_MAX)
    equipped: emptyEquipped(),
    weights: defaultWeights(),        // 앞으로 들어올 포인트의 분배 규칙
    autoAlloc: true,                  // 레벨업 때 알아서 찍어줄 것인가
    seen: [],                         // 한 번이라도 마주친 적 id
    tutorialDone: false,         // 튜토리얼을 봤는가
    sets: [null, null, null],    // 세 벌의 차림. equipped 는 늘 sets[activeSet] 과 같습니다
    activeSet: 0,                // 지금 입고 있는 세트 번호
    settings: defaultSettings(),
    fresh: {},                   // 부위 → 아직 안 열어본 새 전리품 id 목록 — 이름이 드러납니다
    bossesBeaten: [],                 // 지금까지 꺾어본 보스 id — 영구 경험치 배수의 근거
    banked: [],                       // 격을 삼켜 에너지를 영구 적립한 적 id
    specialOpened: [],                // 특수장비 칸을 열어준 히든 id — 이 수만큼 칸이 열려 있습니다
    runCount: 0,
    bestLevel: 1,
    bestKill: 0,                      // 지금까지 꺾은 가장 높은 레벨
    bestZone: 1,                      // 지금까지 도달한 가장 깊은 지역 (1부터)
    cleared: false                    // 아자토스를 꺾은 적이 있는가
  },
  run: null,
  log: []
};

// 가졌는가
function owns(itemId) { return !!(itemId && State.meta.owned[itemId]); }
function ownedIds() { return Object.keys(State.meta.owned); }

// ---------- 특수장비 칸 ----------
// 열린 칸 수 = 처음 꺾어본 히든(칸을 여는 것) 수. 넷이 끝입니다.
function specialOpenCount() { return Math.min(SPECIAL_SLOT_MAX, State.meta.specialOpened.length); }

// 이 칸에 무언가를 끼울 수 있는가. 일반 부위는 늘 열려 있습니다.
function isSlotOpen(slot) {
  return !isSpecialSlot(slot) || SPECIAL_SLOT_IDS.indexOf(slot) < specialOpenCount();
}

// 그 전리품이 지금 어느 칸에 끼워져 있는가 (없으면 null).
// 특수장비는 넷 중 어느 칸에든 들어갈 수 있어서 item.slot 만으로는 모릅니다.
function equippedSlotOf(itemId) {
  for (const s of ALL_SLOT_IDS) if (State.meta.equipped[s] === itemId) return s;
  return null;
}

// NEW! 표시는 부위별로 셉니다. 특수장비 칸 넷은 한 묶음입니다.
function freshKey(slot) { return isSpecialSlot(slot) ? 'special' : slot; }

// ---------- 세트 효과 ----------
// 지금 낀 일반 부위 열셋을 성격별로 셉니다
function setCounts(equipped = State.meta.equipped) {
  const c = {};
  for (const s of SLOT_IDS) {
    const it = getItem(equipped[s]);
    if (it && it.arch) c[it.arch] = (c[it.arch] || 0) + 1;
  }
  return c;
}

// 개수 → 몇 단계가 켜졌는가 (0 · 1 · 2)
function setStep(count) {
  let step = 0;
  SET_STEPS.forEach((n, i) => { if (count >= n) step = i + 1; });
  return step;
}

// 켜진 세트 효과를 특수 능력치별로 더한 것
function setBonuses(equipped = State.meta.equipped) {
  const out = {};
  for (const [arch, n] of Object.entries(setCounts(equipped))) {
    const step = setStep(n);
    if (!step || !SET_BONUS[arch]) continue;
    for (const [k, vals] of Object.entries(SET_BONUS[arch])) out[k] = (out[k] || 0) + vals[step - 1];
  }
  return out;
}

// ---------- 도감 ----------
// 그 격의 전리품을 몇 개 모았는가
function rankCollection(n) {
  const all = RANK_ITEMS[n] || [];
  return { have: all.filter(owns).length, total: all.length };
}

// 다 모은 격의 수 — 이만큼 핵심 스탯이 COLLECTION_BONUS 씩 오릅니다
function completedRanks() {
  let n = 0;
  for (const r of RANKS) {
    const c = rankCollection(r.n);
    if (c.total > 0 && c.have >= c.total) n++;
  }
  return n;
}

// ---------- 부위 강화 ----------
// 표와 강화석 공식은 data.js 의 ENHANCE_TABLE · stoneYield 에 있습니다.
function enhanceLevel(slot) { return State.meta.enhance[slot] || 0; }
function stonesOf(slot) { return State.meta.stones[slot] || 0; }

// 그 부위에 낀 장비의 핵심 스탯에 곱해지는 값
function slotMult(slot) { return 1 + enhanceBonus(enhanceLevel(slot)); }
